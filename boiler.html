<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marine Boiler Trainer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#245676">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage-a:#245676; --stage-b:#0b2131;
  --bg:#e7edf0; --panel:#f3f6f7; --card:#ffffff; --ink:#10222d; --ink2:#4d616d; --line:#cbd6dc; --chip:#e3eaee;
  --accent:#f2c230; --accent-ink:#1b1708;
  --ok:#17804f; --warn:#a96a00; --bad:#c32f2f; --info:#1f6fa8;
  --c-comb:#e8742f; --c-water:#3a9bdc; --c-mount:#e0b020; --c-feed:#3fae7c;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08141b; --panel:#112430; --card:#17303f; --ink:#e8f0f4; --ink2:#a0b4c0; --line:#28475a; --chip:#1e3a4b;
    --ok:#4fd197; --warn:#f0b445; --bad:#ff7070; --info:#6cb8ee;
  }
}
:root[data-theme="dark"]{
  --bg:#08141b; --panel:#112430; --card:#17303f; --ink:#e8f0f4; --ink2:#a0b4c0; --line:#28475a; --chip:#1e3a4b;
  --ok:#4fd197; --warn:#f0b445; --bad:#ff7070; --info:#6cb8ee;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--stage-a) 50%,var(--panel) 50%)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 0;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--stage-a),var(--stage-b))}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.nogl{position:absolute;inset:auto 16px 16px;margin:0;padding:12px 14px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px}

/* stage overlays */
#top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 10px 0;pointer-events:none;color:#eaf3f8}
#top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.05;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.brand strong{font:700 24px/1 var(--font-disp);letter-spacing:.01em}
.brand span{font-size:14.5px;opacity:.82;margin-top:3px}
.seg{display:inline-flex;background:rgba(8,26,38,.62);border:1px solid rgba(190,225,245,.22);border-radius:9px;padding:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;color:inherit;padding:6px 10px;border-radius:7px;font-size:14px;font-weight:500;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#top .seg{color:#dcecf5}
#readout{position:absolute;left:10px;right:64px;top:58px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.pill{display:flex;align-items:baseline;gap:5px;background:rgba(8,26,38,.66);border:1px solid rgba(190,225,245,.2);color:#eaf3f8;border-radius:8px;padding:3px 9px 4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill i{font-style:normal;font-size:14px;opacity:.8}
.pill b{font:600 22px/1 var(--font-disp);font-variant-numeric:tabular-nums}
.pill u{text-decoration:none;font-size:14px;opacity:.8}
.pill.warn{border-color:#f0b445;background:rgba(120,78,0,.7)}
.pill.bad{border-color:#ff7070;background:rgba(130,20,20,.75)}
#state{flex-basis:100%;font-size:15.5px;color:#dff0f8;text-shadow:0 1px 6px rgba(0,0,0,.6);padding-left:2px}
#cams{position:absolute;right:10px;top:58px;display:flex;flex-direction:column;gap:6px}
#cams button{width:46px;min-height:36px;border:1px solid rgba(190,225,245,.22);background:rgba(8,26,38,.62);color:#dcecf5;border-radius:8px;font-size:13px;padding:4px 0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#cams button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#alarmBanner{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;max-width:calc(100% - 24px);border:0;border-radius:9px;padding:8px 14px;font-weight:600;font-size:15px;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#alarmBanner.warn{background:#9a6200}
#alarmBanner.bad{background:#b52a2a}
#toast{position:absolute;left:50%;transform:translateX(-50%) translateY(6px);bottom:56px;max-width:calc(100% - 24px);background:rgba(8,26,38,.9);color:#eaf3f8;border:1px solid rgba(190,225,245,.25);border-left:4px solid var(--info);border-radius:8px;padding:8px 12px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:left}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.ok{border-left-color:#4fd197}#toast.warn{border-left-color:#f0b445}#toast.bad{border-left-color:#ff7070}

/* pins */
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#pins.hide{display:none}
.pin{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border:0;background:none;pointer-events:auto;display:grid;place-items:center;will-change:transform,opacity}
.pin .dot{width:13px;height:13px;border-radius:50%;background:var(--pc,#fff);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.4)}
.pin .lab{position:absolute;left:22px;top:50%;transform:translateY(-50%);white-space:nowrap;background:rgba(8,26,38,.9);color:#fff;font-size:13.5px;padding:2px 8px;border-radius:5px;display:none;pointer-events:none}
body.names .pin .lab,.pin.on .lab{display:block}
.pin.on{z-index:3}
.pin.on .dot{transform:scale(1.45);background:var(--accent);box-shadow:0 0 0 3px rgba(242,194,48,.35),0 2px 8px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){.pin.on .dot{animation:ping 1.8s ease-out infinite}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,194,48,.7)}100%{box-shadow:0 0 0 14px rgba(242,194,48,0)}}

/* panel */
#panel{flex:0 0 auto;height:48%;display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);position:relative;z-index:5;min-height:0}
#panel.snap{transition:height .22s ease}
#grab{flex:0 0 22px;display:grid;place-items:center;touch-action:none;cursor:ns-resize}
#grab i{width:42px;height:5px;border-radius:3px;background:var(--line)}
#tabs{flex:0 0 auto;display:flex;border-bottom:1px solid var(--line);padding:0 6px}
#tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font:600 18px/1.1 var(--font-disp);color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px}
#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#body{flex:1 1 0;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 22px;-webkit-overflow-scrolling:touch}
.view[hidden]{display:none}
h2{font:700 30px/1.05 var(--font-disp);margin:2px 0 4px}
h3{font:600 19px/1.2 var(--font-body);margin:16px 0 4px}
p{margin:0 0 8px}
.muted{color:var(--ink2)}
.small{font-size:15.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -14px 6px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:15px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:15px;color:var(--ink2);margin:2px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend s{width:18px;height:6px;border-radius:3px;display:inline-block}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.prow{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gc,#999);border-radius:8px;min-height:48px}
.prow b{font-weight:600;flex:1}
.prow small{color:var(--ink2);font-size:15px}
.prow:active{background:var(--chip)}
.back{border:0;background:none;color:var(--info);padding:4px 0;font-weight:600;font-size:16.5px;min-height:36px}
.gtag{display:inline-block;border-radius:999px;padding:3px 11px;font-size:15px;background:var(--chip);border-left:5px solid var(--gc,#999);margin-bottom:6px}
.facts{margin:6px 0 0;padding-left:20px}
.facts li{margin:3px 0}
.watch{margin-top:12px;padding:10px 12px;border-radius:8px;background:rgba(242,194,48,.18);border-left:5px solid var(--accent)}
.watch b{display:block;margin-bottom:2px}
.pnav{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px;font-weight:600;min-height:46px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{flex:0 0 auto;padding:7px 12px;min-height:40px;font-size:16.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

/* steps */
.procs{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 10px;padding:0 14px 4px;scrollbar-width:none}
.procs::-webkit-scrollbar{display:none}
.prog{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:2px 0 8px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stepno{font:600 16.5px var(--font-body);color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.chk{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--chip);font-size:16.5px}
.chk .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink2);flex:0 0 auto;display:grid;place-items:center;font-size:13px;line-height:1}
.chk.ok .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.ok .tick::after{content:"✓"}
.caution{margin-top:10px;padding:10px 13px;border-radius:8px;background:rgba(195,47,47,.12);border-left:5px solid var(--bad);font-size:16.5px}

/* simulator */
.gauges{display:grid;grid-template-columns:1.3fr .7fr;gap:10px;align-items:stretch}
.gbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gbox svg{width:100%;height:auto;max-height:150px}
.gbox .cap{font-size:15px;color:var(--ink2);margin-top:2px}
.temps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.temps div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
.temps b{display:block;font:600 22px/1.1 var(--font-disp);font-variant-numeric:tabular-nums}
.temps span{font-size:14px;color:var(--ink2)}
.seqrow{display:flex;gap:4px;margin:6px 0 12px}
.seqrow span{flex:1;text-align:center;font-size:14.5px;padding:5px 2px;border-radius:6px;background:var(--chip);color:var(--ink2)}
.seqrow span.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seqrow span.bad{background:var(--bad);color:#fff;font-weight:600}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ctl:first-of-type{border-top:0}
.ctl label,.ctl>span{font-weight:500;flex:1}
.ctl .seg{background:var(--chip);border-color:var(--line);backdrop-filter:none}
.ctl .seg button{color:var(--ink);min-height:38px;padding:6px 12px}
.ctl .seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.ctl input[type=range]{flex:0 0 150px;accent-color:#c99a00;height:32px}
.ctl output{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.alist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.alist li{padding:8px 11px;border-radius:7px;font-size:16.5px;border-left:5px solid var(--warn);background:rgba(240,180,69,.16)}
.alist li.bad{border-left-color:var(--bad);background:rgba(195,47,47,.14)}
.alist li.none{border-left-color:var(--ok);background:rgba(23,128,79,.12)}

/* quiz */
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);min-height:48px}
.opt.right{border-color:var(--ok);background:rgba(23,128,79,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(195,47,47,.13)}
.opt:disabled{cursor:default}
.score{font:700 54px/1 var(--font-disp);margin:6px 0}

@media (min-width:900px) and (min-aspect-ratio:1/1){
  #app{flex-direction:row}
  #panel{width:440px;height:100%!important;border-radius:0;order:2;box-shadow:-6px 0 24px rgba(0,0,0,.22)}
  #grab{display:none}
  #tabs{padding-top:8px}
  #alarmBanner{bottom:16px}
  #toast{bottom:64px}
}
@media (max-width:420px){.brand strong{font-size:21px}.seg button{padding:6px 8px;font-size:13.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="gl" aria-label="Interactive 3D model of a ship's auxiliary boiler. Drag to rotate, pinch or scroll to zoom, tap a part to learn about it." tabindex="0"></canvas>
    <div id="pins"></div>
    <header id="top">
      <div class="brand"><strong>Boiler trainer</strong><span>Oil-fired auxiliary boiler</span></div>
      <div class="seg" id="viewseg" role="group" aria-label="View style">
        <button data-view="cut" aria-pressed="true">Cutaway</button>
        <button data-view="xray" aria-pressed="false">X-ray</button>
        <button data-view="ext" aria-pressed="false">Outside</button>
      </div>
    </header>
    <div id="readout" aria-live="off">
      <div class="pill" id="pp"><i>Steam</i><b id="r-p">0.0</b><u>bar</u></div>
      <div class="pill" id="pl"><i>Water</i><b id="r-l">50</b><u>%</u></div>
      <div class="pill" id="pt"><i>Exhaust</i><b id="r-t">25</b><u>°C</u></div>
      <div id="state"></div>
    </div>
    <div id="cams" role="group" aria-label="Camera">
      <button data-cam="front">Front</button>
      <button data-cam="right">Right</button>
      <button data-cam="back">Back</button>
      <button data-cam="top">Top</button>
      <button id="namesBtn" aria-pressed="false">Names</button>
    </div>
    <button id="alarmBanner" hidden></button>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <section id="panel" aria-label="Learning panel">
    <div id="grab" role="button" aria-label="Resize panel" tabindex="0"><i></i></div>
    <nav id="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="parts" aria-selected="true">Parts</button>
      <button role="tab" data-tab="steps" aria-selected="false">Procedures</button>
      <button role="tab" data-tab="run" aria-selected="false">Simulator</button>
      <button role="tab" data-tab="quiz" aria-selected="false">Quiz</button>
    </nav>
    <div id="body">
      <section class="view" id="v-parts" role="tabpanel"></section>
      <section class="view" id="v-steps" role="tabpanel" hidden></section>
      <section class="view" id="v-run" role="tabpanel" hidden></section>
      <section class="view" id="v-quiz" role="tabpanel" hidden></section>
    </div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=(s,e)=>(e||document).querySelector(s);
const $$=(s,e)=>Array.from((e||document).querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/*SIM-START*/
const SIM=(function(){
  const LL=24,LOW=34,FEED_ON=44,FEED_OFF=56,HIGH=70,HH=80,CL_LIMIT=150;
  const P_CUTOUT=7.0,P_CUTIN=5.8,P_LOWFIRE=6.2,P_HPTRIP=7.5;
  const SV_SET=[8.0,8.2],SV_RESEAT=[7.55,7.75];
  const TAB=[[100,1.013],[110,1.433],[120,1.985],[130,2.701],[140,3.613],[150,4.758],[160,6.178],[170,7.917],[180,10.03],[190,12.55]];
  const cl=(v,a,b)=>v<a?a:v>b?b:v;
  function psatGauge(T){
    if(T<=100)return 0;
    for(let i=1;i<TAB.length;i++){
      if(T<=TAB[i][0]){const a=TAB[i-1],b=TAB[i];return a[1]+(b[1]-a[1])*(T-a[0])/(b[0]-a[0])-1.013;}
    }
    return TAB[TAB.length-1][1]-1.013;
  }
  function create(){
    return {speed:3,t:0,
      burnerOn:false,ventOpen:true,feedMode:'auto',stopTarget:0,stopValve:0,demand:0.5,bottomBlow:false,scumBlow:false,
      faults:{feedPump:false,flame:false,pressureCtl:false},
      Tw:30,P:0,level:50,tds:25,Tf:25,Tg:25,
      burner:'off',btimer:0,wait:'',flame:false,fuelValve:false,spark:false,fire:0,fan:0,damper:0,
      cutoutLatched:false,lockout:null,feedCall:false,feedPump:false,
      svOpen:[false,false],svLift:[0,0],flows:{steam:0,sv:0,vent:0},events:[]};
  }
  function ev(s,msg,sev){s.events.push({msg:msg,sev:sev||'info'});if(s.events.length>30)s.events.shift();}
  function trip(s,reason){
    if(s.lockout)return;
    s.lockout=reason;s.burnerOn=false;s.flame=false;s.fuelValve=false;s.spark=false;s.burner='lockout';s.btimer=0;
    ev(s,'BURNER TRIP: '+reason,'bad');
  }
  function sub(s,dt){
    s.t+=dt;
    s.stopValve+=cl(s.stopTarget-s.stopValve,-dt/6,dt/6);
    if(s.P<P_CUTIN)s.cutoutLatched=false;
    // feed control (level electrodes)
    if(s.level<FEED_ON)s.feedCall=true;else if(s.level>=FEED_OFF)s.feedCall=false;
    const want=(s.feedMode==='auto'&&s.feedCall)||s.feedMode==='manual';
    s.feedPump=want&&!s.faults.feedPump&&s.level<HH;
    // protective trips
    if(!s.lockout&&(s.burner==='prepurge'||s.burner==='ignition'||s.burner==='running')){
      if(s.level<LL)trip(s,'LOW-LOW WATER LEVEL');
      else if(!s.faults.pressureCtl&&s.P>=P_HPTRIP)trip(s,'HIGH STEAM PRESSURE');
    }
    // burner sequence
    let fanT=0,dampT=0;
    switch(s.burner){
      case 'off':case 'standby':{
        s.flame=false;s.fuelValve=false;s.spark=false;
        if(s.burnerOn&&!s.lockout){
          const pOk=s.cutoutLatched?s.P<P_CUTIN:s.P<P_CUTOUT;
          if(s.level<30){s.burner='off';s.wait='Waiting: water level below 30%';}
          else if(!pOk){s.burner='standby';s.wait='Standby: pressure above cut-in';}
          else{s.burner='prepurge';s.btimer=0;s.wait='';ev(s,'Pre-purge: fan on, damper open','info');}
        }else{s.burner='off';s.wait='';}
        break;}
      case 'prepurge':
        fanT=1;dampT=1;s.btimer+=dt;
        if(!s.burnerOn){s.burner='off';}
        else if(s.btimer>=8){s.burner='ignition';s.btimer=0;ev(s,'Ignition: spark on, fuel valve opens','info');}
        break;
      case 'ignition':
        fanT=1;dampT=0.35;s.spark=true;s.fuelValve=true;s.btimer+=dt;
        if(!s.burnerOn){s.spark=false;s.fuelValve=false;s.burner='postpurge';s.btimer=0;}
        else if(!s.faults.flame&&s.btimer>=2.5){s.flame=true;s.spark=false;s.burner='running';s.btimer=0;s.fire=Math.max(s.fire,0.5);ev(s,'Flame proved: burner running','ok');}
        else if(s.btimer>=5){trip(s,'FLAME FAILURE (no flame proved)');}
        break;
      case 'running':{
        fanT=1;s.fuelValve=true;s.flame=true;
        if(s.faults.flame){trip(s,'FLAME FAILURE (flame lost)');break;}
        const fT=(s.P<1.5)?0.55:(s.P<P_LOWFIRE?1:0.55);
        s.fire+=cl(fT-s.fire,-dt*0.15,dt*0.15);
        dampT=0.3+0.6*cl((s.fire-0.5)/0.5,0,1);
        if(!s.burnerOn){s.burner='postpurge';s.btimer=0;s.flame=false;s.fuelValve=false;ev(s,'Burner stopped: post-purge','info');}
        else if(!s.faults.pressureCtl&&s.P>=P_CUTOUT){s.burner='postpurge';s.btimer=0;s.flame=false;s.fuelValve=false;s.cutoutLatched=true;ev(s,'Pressure cut-out at 7.0 bar: burner off','info');}
        break;}
      case 'postpurge':
        fanT=1;dampT=1;s.flame=false;s.fuelValve=false;s.spark=false;s.btimer+=dt;
        if(s.btimer>=6)s.burner='off';
        break;
      case 'lockout':
        s.flame=false;s.fuelValve=false;s.spark=false;s.btimer+=dt;
        fanT=s.btimer<6?1:0;dampT=s.btimer<6?1:0;
        break;
    }
    if(!s.flame)s.fire=Math.max(0,s.fire-dt*0.8);
    s.fan+=cl(fanT-s.fan,-dt*0.6,dt*0.6);
    s.damper+=cl(dampT-s.damper,-dt*0.4,dt*0.4);
    // heat and steam
    const heat=s.flame?85*s.fire:0;
    const ff=cl((s.P-0.3)/2.5,0,1);
    const steamU=s.stopValve>0.03?s.stopValve*s.demand*ff:0;
    let svU=0;
    for(let i=0;i<2;i++){
      if(s.P>=SV_SET[i]&&!s.svOpen[i]){s.svOpen[i]=true;ev(s,'Safety valve '+(i?'B':'A')+' lifting at '+s.P.toFixed(1)+' bar','bad');}
      else if(s.P<=SV_RESEAT[i]&&s.svOpen[i]){s.svOpen[i]=false;ev(s,'Safety valve '+(i?'B':'A')+' reseated','ok');}
      s.svLift[i]+=((s.svOpen[i]?1:0)-s.svLift[i])*Math.min(1,dt*6);
      if(s.svOpen[i])svU+=1.2+Math.max(0,s.P-SV_SET[i]);
    }
    const feedRate=s.feedPump?1.2:0;
    const blowRate=(s.bottomBlow?2:0)+(s.scumBlow?0.6:0);
    const hot=Math.max(0,s.Tw-80);
    const qOut=80*(steamU+svU)+2+0.04*Math.max(0,s.Tw-30)+(feedRate+blowRate)*0.046*hot;
    let Tn=s.Tw+(heat-qOut)/50*dt;
    let ventU=0;
    if(s.ventOpen&&Tn>100){
      const Tc=100+(Tn-100)*Math.exp(-dt*0.8);
      ventU=Math.max(0,(Tn-Tc)*50/(dt*80));
      Tn=Tc;
    }
    s.Tw=Math.max(15,Tn);
    s.P=s.ventOpen?0:psatGauge(s.Tw);
    const evap=steamU+svU+ventU;
    s.level=cl(s.level+(feedRate-0.35*evap-blowRate)*dt,0,100);
    s.tds=Math.max(5,s.tds+0.2*evap*dt-s.tds*((s.bottomBlow?0.03:0)+(s.scumBlow?0.012:0))*dt);
    const tfT=s.flame?650+650*s.fire:Math.max(s.Tw*0.9,30);
    s.Tf+=(tfT-s.Tf)*Math.min(1,dt*(s.flame?0.6:0.05));
    const tgT=s.flame?150+0.5*s.Tw+80*s.fire:Math.max(30,s.Tw*0.4);
    s.Tg+=(tgT-s.Tg)*Math.min(1,dt*(s.flame?0.4:0.04));
    s.flows.steam=steamU;s.flows.sv=svU;s.flows.vent=ventU;
  }
  function step(s,dtReal){
    let dt=Math.min(dtReal,0.1)*s.speed;
    while(dt>1e-6){const h=Math.min(dt,0.1);sub(s,h);dt-=h;}
  }
  function alarms(s){
    const a=[];
    if(s.lockout)a.push({text:'Burner trip: '+s.lockout,sev:'bad'});
    if(s.svOpen[0]||s.svOpen[1])a.push({text:'Safety valve lifting',sev:'bad'});
    if(s.level>=HH)a.push({text:'High-high water level: feed pump stopped',sev:'bad'});
    else if(s.level>=HIGH)a.push({text:'High water level',sev:'warn'});
    if(s.level<LL)a.push({text:'Low-low water level',sev:'bad'});
    else if(s.level<LOW)a.push({text:'Low water level',sev:'warn'});
    if(s.faults.feedPump&&s.feedCall)a.push({text:'Feed pump failed to start',sev:'bad'});
    if(s.tds>CL_LIMIT)a.push({text:'High chloride: blow down',sev:'warn'});
    if(!s.svOpen[0]&&s.P>=7.2)a.push({text:'High steam pressure',sev:'warn'});
    return a;
  }
  function status(s){
    switch(s.burner){
      case 'off':return s.wait||(s.burnerOn?'Starting':'Burner off');
      case 'standby':return s.wait||'Standby';
      case 'prepurge':return 'Pre-purge: clearing the furnace';
      case 'ignition':return 'Ignition: spark and fuel';
      case 'running':return s.fire>0.8?'Firing: high fire':'Firing: low fire';
      case 'postpurge':return 'Post-purge';
      case 'lockout':return 'LOCKOUT: reset required';
    }
    return '';
  }
  const act={
    burner(s,on){
      if(on&&s.lockout){ev(s,'Reset the lockout first','warn');return;}
      s.burnerOn=on;
      if(on&&s.level<30)ev(s,'Burner will not start: water level below 30%','warn');
    },
    reset(s){
      if(!s.lockout)return;
      if(s.level<30){ev(s,'Cannot reset: restore the water level first','warn');return;}
      if(s.P>=P_HPTRIP&&!s.faults.pressureCtl){ev(s,'Cannot reset: pressure still high','warn');return;}
      s.lockout=null;s.burner='off';s.btimer=0;ev(s,'Lockout reset: burner can be started','ok');
    },
    vent(s,open){s.ventOpen=open;},
    feedMode(s,m){s.feedMode=m;},
    stop(s,open){s.stopTarget=open?1:0;},
    demand(s,v){s.demand=cl(v,0,1);},
    bottomBlow(s,on){s.bottomBlow=on;if(on&&s.level<45)ev(s,'Level is low: do not blow down','warn');},
    scum(s,on){s.scumBlow=on;},
    fault(s,key,on){s.faults[key]=on;ev(s,(on?'Fault set: ':'Fault cleared: ')+({feedPump:'feed pump failure',flame:'flame failure',pressureCtl:'pressure controls fail'}[key]),on?'warn':'ok');}
  };
  function preset(s,name){
    const sp=s.speed;Object.assign(s,create(),{speed:sp});
    if(name==='steaming'){
      Object.assign(s,{Tw:165,ventOpen:false,stopTarget:1,stopValve:1,demand:0.5,burnerOn:true,burner:'running',flame:true,fuelValve:true,fan:1,damper:0.6,fire:0.55,Tf:1000,Tg:290,level:52,tds:110});
      s.P=psatGauge(165);
    }
  }
  return {create,step,alarms,status,act,preset,psatGauge,C:{LL,LOW,FEED_ON,FEED_OFF,HIGH,HH,CL_LIMIT,P_CUTOUT,P_CUTIN,P_HPTRIP,SV_SET}};
})();

 {t:'Open the air vent',b:'Keep the air vent open and the main steam stop valve shut while steam is raised.',why:'Air must leave as the water heats. Left in, it spoils heat transfer and keeps the shell from filling with clean steam.',part:'air_vent',chk:s=>s.ventOpen&&s.stopTarget===0,chkL:'Air vent open, steam stop valve shut',doL:'Set vent open, stop valve shut',doF:s=>{SIM.act.vent(s,true);SIM.act.stop(s,false);}},
 {t:'Put feed control on automatic',b:'Set the feed pump selector to AUTO with the standby pump ready. The level electrodes will start and stop the pump.',why:'Automatic feed keeps the level steady while you watch the flame and pressure.',part:'level_probes',chk:s=>s.feedMode==='auto',chkL:'Feed pump selector on AUTO',doL:'Set feed to AUTO',doF:s=>SIM.act.feedMode(s,'auto')},
 {t:'Prepare the fuel',b:'Check the fuel service tank, line up the fuel valves, and start the fuel pump and heater. Heavy fuel must reach its correct temperature.',why:'Fuel must be at the right viscosity to atomise. Cold oil gives a ragged spray and a smoky or failed light-off.',part:'fuel_unit'},
 {t:'Start the burner',b:'Press burner START. The sequence runs by itself: pre-purge, ignition, flame proving. The flame scanner lamp turns green when flame is proved.',why:'Pre-purge clears any fuel vapour from the furnace so it cannot explode at light-off.',caut:'If the burner fails to light, do not repeat attempts quickly. Let the purge finish and find the cause before resetting.',part:'burner',chk:s=>s.flame,chkL:'Flame proved',doL:'Start the burner',doF:s=>SIM.act.burner(s,true)},
 {t:'Warm up slowly',b:'The burner stays at low fire while the boiler is cold. Let the water heat gradually. Steam will begin to come out of the air vent.',why:'Fast heating makes the thick tube plates and shell expand unevenly. That cracks welds and loosens tube ends.',part:'furnace',chk:s=>s.Tw>=100,chkL:'Water is boiling (100°C)'},
 {t:'Close the air vent',b:'When steam blows freely from the vent, close it. Pressure now begins to rise.',why:'Only steam is coming out, so the air is gone.',caut:'Closing too early traps air. Closing too late wastes water and fuel.',part:'air_vent',chk:s=>!s.ventOpen&&s.Tw>=100,chkL:'Vent closed with steam raised',doL:'Close the air vent',doF:s=>SIM.act.vent(s,false)},
 {t:'Check joints and the glass under pressure',b:'At about 1 to 2 bar, re-tighten the manhole and handhole nuts evenly, and blow through the gauge glass again. Look for leaks.',why:'Joints settle as they warm, and a new gasket may weep until nipped up.',part:'manhole',chk:s=>s.P>=1.5,chkL:'Pressure has reached 1.5 bar'},
 {t:'Raise to working pressure',b:'Above about 1.5 bar the burner goes to high fire. Near the set point it falls back to low fire, and it cuts out at 7.0 bar.',why:'The pressure switches hold the pressure in the working band without you touching the burner.',part:'pressure_switch',chk:s=>s.P>=5.5,chkL:'Pressure is 5.5 bar or more'},
 {t:'Open the main steam stop valve',b:'Warm the steam line and drain condensate first, then open the stop valve slowly. Bring on the load gradually.',why:'A slow opening warms the pipe evenly and keeps condensate from slamming through it.',caut:'Opening quickly onto a cold line causes water hammer.',part:'steam_stop',chk:s=>s.stopTarget===1&&s.P>=4,chkL:'Stop valve open with pressure above 4 bar',doL:'Open the stop valve',doF:s=>SIM.act.stop(s,true)}
]},
{id:'run',n:'Running',steps:[
 {t:'Pressure',b:'Keep working pressure between 5.8 and 7.0 bar. The burner swings between low and high fire and cuts out at 7.0 bar.',why:'Steady pressure means supply matches demand.',part:'pressure_gauge',chk:s=>s.P>=5&&s.P<7.0,chkL:'Pressure is in the working band'},
 {t:'Water level',b:'The level swings around mid-glass. The feed pump starts at about 44% and stops at about 56%.',why:'A big swing, or a level that keeps climbing, points to a feed or control fault.',part:'gauge_glass',chk:s=>s.level>=40&&s.level<=60,chkL:'Level is 40 to 60%'},
 {t:'Flame and exhaust',b:'The flame should be bright orange-yellow, steady and centred. The exhaust should be a light haze.',why:'Black smoke means poor atomisation or too little air.',part:'flame_eye'},
 {t:'Feed and hotwell',b:'Hotwell temperature should be about 80°C and the observation tank free of oil. Check the feed pump runs and changes over cleanly.',why:'Oil in the feed is one of the quickest ways to ruin a boiler.',part:'hotwell'},
 {t:'Water treatment',b:'Test chloride and alkalinity every day. Keep chloride below 150 ppm. Use the scum blowdown little and often to hold it down.',why:'Concentrated water foams and carries over into the steam.',part:'dosing',chk:s=>s.tds<150,chkL:'Chloride below 150 ppm',doL:'Open scum blowdown',doF:s=>SIM.act.scum(s,true)},
 {t:'Bottom blowdown',b:'Blow down briefly, at low load or low fire, with the level above normal and following the ship\'s schedule.',why:'It removes the sludge that settles at the lowest point.',caut:'Never leave a blowdown valve unattended. The level falls quickly.',part:'bottom_blowdown'},
 {t:'Prove the safety valves',b:'Lift each safety valve by hand with the easing gear at the intervals set by the maker and class rules, with the boiler under pressure.',why:'Proves they are free to lift when they are needed.',part:'safety_valves'},
 {t:'Test the level controls',b:'Test the low-level alarm and trip as the maker describes, and blow down the level chamber to keep the probes clean.',why:'A level control that has never been tested cannot be trusted.',part:'level_probes'}
]},
{id:'stop',n:'Shut-down',steps:[
 {t:'Reduce the load',b:'Reduce the steam demand and bring the water level a little above normal.',why:'A slightly high level gives a margin as the boiler cools.',part:'gauge_glass',chk:s=>s.demand<=0.2,chkL:'Steam demand is 20% or less'},
 {t:'Stop the burner',b:'Press STOP. The fuel valve closes at once and the post-purge clears the furnace.',why:'Post-purge removes unburnt vapour and cools the burner.',caut:'Let the post-purge finish. Do not stop the fan early.',part:'burner',chk:s=>!s.burnerOn,chkL:'Burner stopped',doL:'Stop the burner',doF:s=>SIM.act.burner(s,false)},
 {t:'Shut the main steam stop valve',b:'Close the stop valve once the burner is off and other boilers cover the load.',why:'Isolates the cooling boiler from the steam line.',part:'steam_stop',chk:s=>s.stopTarget===0,chkL:'Stop valve shut',doL:'Shut the stop valve',doF:s=>SIM.act.stop(s,false)},
 {t:'Let it cool naturally',b:'Leave feed on AUTO and allow the boiler to cool slowly. Do not cool it quickly with cold feed or blowdown.',why:'Fast cooling stresses plates and tube ends just as fast heating does.',part:'feed_valves'},
 {t:'Open the air vent',b:'When the pressure has fallen to about 0.5 bar, open the air vent.',why:'Without it, cooling steam condenses and pulls a vacuum.',caut:'A vacuum can distort the shell or draw in water.',part:'air_vent',chk:s=>s.ventOpen,chkL:'Air vent open',doL:'Open the air vent',doF:s=>SIM.act.vent(s,true)},
 {t:'Secure the fuel',b:'Stop the fuel pump and heater and shut the fuel valves. Log the final pressure and level.',why:'Leaves the plant safe and ready for the next watch.',part:'fuel_unit'},
 {t:'Do not drain while hot',b:'Drain or blow down only when the water is cool enough, as the maker states.',why:'Hot water flashing to steam in a drain line can cause injury and damage.',part:'bottom_blowdown'}

{id:'low',n:'Low water',steps:[
 {t:'Recognise it',b:'The low-level alarm sounds, or the glass shows no water. The burner trips on low-low level. To practise, set Feed pump failure in the Simulator.',why:'Early recognition is the only way to avoid damage.',part:'gauge_glass',chk:s=>s.level<SIM.C.LOW||!!s.lockout,chkL:'Low level or a trip is showing'},
 {t:'Confirm the burner is stopped',b:'Check that the fuel valve is closed and the burner has tripped. If not, stop it by hand and shut the manual fuel valve.',why:'Fire under a boiler without enough water overheats the plates.',part:'fuel_valve',chk:s=>!s.fuelValve,chkL:'Fuel valve closed'},
 {t:'Shut the main steam stop valve',b:'Isolate the boiler from the steam line so no more water leaves as steam.',why:'It stops the level falling further.',part:'steam_stop',chk:s=>s.stopTarget===0,chkL:'Stop valve shut',doL:'Shut the stop valve',doF:s=>SIM.act.stop(s,false)},
 {t:'Do not feed a hot boiler blind',b:'If no water shows in the glass, do not pump in cold feed water. If the level is only low and still in sight, restoring feed may be correct. When in doubt, cool first.',why:'Cold water on bare hot plates flashes to steam and can crack them.',caut:'In the simulator the level always stays visible. On a real boiler with an empty glass, do not feed.',part:'feed_valves'},

]}

const QUIZ=[
{q:'Why is the furnace pre-purged before the burner lights?',a:['To warm the refractory','To clear unburnt fuel vapour so it cannot explode at light-off','To test the flame scanner','To cool the fuel nozzle'],c:1,w:'Vapour left in the furnace or uptake can ignite violently. Several air changes remove it first.'},
{q:'Where should the water level normally sit in the gauge glass?',a:['Just visible at the bottom','About the middle','Full to the top','It does not matter while feed is on AUTO'],c:1,w:'Mid-glass leaves a safe margin above the heating surface and below the steam space.'},
{q:'What does the flame scanner do?',a:['Measures furnace temperature','Proves the flame and trips the fuel valve if it is lost','Positions the air damper','Starts the feed pump'],c:1,w:'No flame proved means no fuel. The control closes the fuel valve and locks out.'},
{q:'When do you close the air vent while raising steam?',a:['Before lighting the burner','When steam blows out freely','When the safety valves lift','After the steam stop valve is open'],c:1,w:'Steam alone coming out means the air has gone. Closing earlier traps air. Closing much later wastes water and fuel.'},
{q:'The safety valves on this boiler lift at about…',a:['The normal working pressure','The burner cut-out pressure','The design pressure (8 bar here)','Twice the working pressure'],c:2,w:'They are the last line of defence, set at design pressure, well above the cut-out and trip settings.'},
{q:'Why is the main steam stop valve opened slowly?',a:['To save steam','To avoid water hammer and thermal shock in a cold line','To keep the burner on low fire','To keep the safety valves seated'],c:1,w:'Condensate in a cold line can be driven along the pipe at speed, and sudden heating stresses the pipe.'},
{q:'Why do you blow through the gauge glass?',a:['To heat the glass','To prove the cocks and passages are clear so the level is true','To reduce chloride','To test the safety valve'],c:1,w:'A blocked cock can freeze a false level in the glass.'},
{q:'The burner has tripped on low-low water. What comes first?',a:['Pump in water at once','Find out why before adding water. If no water shows in the glass, do not feed a hot boiler','Reset and relight','Open the bottom blowdown'],c:1,w:'Bare, hot plates can crack if cold water hits them. Cool first and investigate.'},
{q:'What does scum (surface) blowdown remove?',a:['Sludge from the bottom','Oil, foam and light impurities at the water surface','Air from the steam space','Dissolved oxygen'],c:1,w:'The scum valve takes water from the surface at normal level, where floating impurities collect.'},
{q:'High chloride in the boiler water means…',a:['The water is too dilute','Dissolved solids have concentrated, so foaming and carry-over are likely: blow down and re-test','The feed pump runs too often','The level probes are dirty'],c:1,w:'Steaming leaves salts behind, so chloride climbs until you blow down.'},
{q:'Which way do the flue gases travel in this boiler?',a:['Up the furnace and down the tubes','Down the furnace, turn at the bottom, then up the smoke tubes to the uptake','Straight up the centre to the funnel','Round the shell and into the furnace'],c:1,w:'The reversal chamber at the bottom turns the gas through 180° into the tube bank.'},
{q:'Why is the boiler warmed up slowly from cold?',a:['The fuel is hard to ignite','Thick plates and tube ends expand unevenly and can crack or leak if heated fast','The feed pump cannot keep up','To keep the vent open longer'],c:1,w:'Uneven expansion strains the welds and tube ends.'},
{q:'When should the air vent be opened on shut-down?',a:['Before stopping the burner','As the pressure falls to near zero, so no vacuum forms','Never. It stays shut','Only when draining'],c:1,w:'Cooling steam condenses. Without an open vent a vacuum forms in the shell.'}
];

const view3d=(function(){
  const stub={ok:false,focus(){},setView(){},cam(){},pins(){},names(){},tick(){},onPick:null,onView:null};
  let renderer;
  try{
    renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true,alpha:true,powerPreference:'high-performance'});
  }catch(e){
    $('#stage').insertAdjacentHTML('beforeend','<p class="nogl">This device could not start 3D graphics. The parts guide, procedures, simulator and quiz still work.</p>');
    return stub;
  }
  try{
  const T=THREE,stage=$('#stage'),canvas=$('#gl');
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setClearColor(0x000000,0);
  renderer.localClippingEnabled=true;
  const scene=new T.Scene();
  const camera=new T.PerspectiveCamera(38,1,0.1,120);
  const root=new T.Group();scene.add(root);
  const V=(x,y,z)=>new T.Vector3(x,y,z);
  const UP=V(0,1,0);
  const R=1.3,RC=1.37,Y_BOT=0.35,Y_TOP=4.0,DISH=0.4;
  const lvY=p=>2.3+1.4*p/100;
  const PG={},CLIP=[],A={lamps:[],glassW:[],sv:[],plamps:[],ventV:1,blowV:0,scumV:0,ff:0,lcdT:0};

  /* lights: strong ambient + hemisphere so nothing renders black on a phone */
  scene.add(new T.HemisphereLight(0xe6f0f7,0x3a5666,1.0));
  scene.add(new T.AmbientLight(0xffffff,0.38));
  const key=new T.DirectionalLight(0xffffff,1.0);key.position.set(5,9,7);scene.add(key);
  const fill=new T.DirectionalLight(0xbcd6ea,0.6);fill.position.set(-6,4,-3);scene.add(fill);
  const rim=new T.DirectionalLight(0xffe2b8,0.35);rim.position.set(0,5,-8);scene.add(rim);
  const furnaceLight=new T.PointLight(0xff8a30,0,7,1.5);furnaceLight.position.set(0,3.0,0);scene.add(furnaceLight);

  function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.anisotropy=4;return t;}
  const dotTex=canvasTex(64,64,(x,w,h)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.45,'rgba(255,255,255,0.7)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h);});
  const floorTex=canvasTex(1024,1024,(x,w,h)=>{
    const g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    g.addColorStop(0,'rgba(60,112,152,0.6)');g.addColorStop(0.7,'rgba(30,72,102,0.35)');g.addColorStop(1,'rgba(20,50,75,0)');
    x.fillStyle=g;x.fillRect(0,0,w,h);x.lineWidth=2;
    for(let i=0;i<=36;i++){const p=i*w/36;x.strokeStyle=(i%6===0)?'rgba(190,225,245,0.38)':'rgba(190,225,245,0.15)';x.beginPath();x.moveTo(p,0);x.lineTo(p,h);x.stroke();x.beginPath();x.moveTo(0,p);x.lineTo(w,p);x.stroke();}
    x.globalCompositeOperation='destination-in';
    const m=x.createRadialGradient(w/2,h/2,w*0.1,w/2,h/2,w/2);m.addColorStop(0,'rgba(0,0,0,1)');m.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=m;x.fillRect(0,0,w,h);
  });
  const floor=new T.Mesh(new T.CircleGeometry(9,64),new T.MeshBasicMaterial({map:floorTex,transparent:true,depthWrite:false}));
  floor.rotation.x=-Math.PI/2;floor.position.y=0.001;scene.add(floor);
  const blobTex=canvasTex(128,128,(x,w,h)=>{const g=x.createRadialGradient(64,64,10,64,64,64);g.addColorStop(0,'rgba(0,0,0,0.5)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);});
  const blob=new T.Mesh(new T.CircleGeometry(2.7,40),new T.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false}));
  blob.rotation.x=-Math.PI/2;blob.position.y=0.004;scene.add(blob);

  /* ---- builders ---- */
  function M(c,o){o=o||{};
    const m=new T.MeshStandardMaterial({color:c,roughness:o.r!=null?o.r:0.55,metalness:o.m!=null?o.m:0.22,side:o.d?T.DoubleSide:T.FrontSide,transparent:!!o.t,opacity:o.o!=null?o.o:1});
    if(o.e!=null){m.emissive=new T.Color(o.e);m.emissiveIntensity=o.ei!=null?o.ei:1;}
    if(o.t)m.depthWrite=false;
    if(o.clip)CLIP.push(m);
    return m;}
  function G(id){const g=new T.Group();g.userData.part=id;PG[id]=g;root.add(g);return g;}
  function add(g,geo,mat,x,y,z){const m=new T.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);g.add(m);return m;}
  const cyl=(a,b,h,s,open)=>new T.CylinderGeometry(a,b,h,s||24,1,!!open);
  const box=(w,h,d)=>new T.BoxGeometry(w,h,d);
  const sph=(r,s)=>new T.SphereGeometry(r,s||16,Math.max(8,Math.floor((s||16)/2)));
  function unitCyl(r){const g=new T.CylinderGeometry(r,r,1,14);g.translate(0,0.5,0);return g;}
  function cylX(g,r,len,mat,x,y,z){const m=add(g,cyl(r,r,len,20),mat,x,y,z);m.rotation.z=Math.PI/2;return m;}
  function cylZ(g,r,len,mat,x,y,z){const m=add(g,cyl(r,r,len,20),mat,x,y,z);m.rotation.x=Math.PI/2;return m;}
  function seg(g,a,b,r,mat){const d=b.clone().sub(a),len=d.length();if(len<1e-4)return;const m=new T.Mesh(cyl(r,r,len,12),mat);m.position.copy(a).add(b).multiplyScalar(0.5);m.quaternion.setFromUnitVectors(UP,d.normalize());g.add(m);}
  function pipe(g,pts,r,col){const mat=M(col,{m:0.3,r:0.45});for(let i=0;i<pts.length-1;i++)seg(g,pts[i],pts[i+1],r,mat);for(let i=1;i<pts.length-1;i++)add(g,sph(r*1.02,10),mat,pts[i].x,pts[i].y,pts[i].z);}
  function valve(g,x,y,z,o){
    o=o||{};const s=o.s||1,vg=new T.Group();vg.position.set(x,y,z);
    const bm=()=>M(o.body||0x69757e,{m:0.35,r:0.5});
    cylX(vg,0.085*s,0.4*s,bm(),0,0,0);
    add(vg,sph(0.125*s,14),bm());
    add(vg,cyl(0.07*s,0.07*s,0.14*s,12),bm(),0,0.15*s,0);
    [-1,1].forEach(k=>cylX(vg,0.13*s,0.035*s,bm(),k*0.2*s,0,0));
    const stem=new T.Group();stem.position.y=0.2*s;vg.add(stem);
    if(!o.nowheel){
      const hc=o.col||0xc0392b,wm=()=>M(hc,{m:0.1,r:0.55});
      add(stem,cyl(0.014*s,0.014*s,0.3*s,8),M(0xc4ccd2,{m:0.6,r:0.3}),0,0.14*s,0);
      const w=add(stem,new T.TorusGeometry(0.12*s,0.016*s,8,20),wm(),0,0.3*s,0);w.rotation.x=Math.PI/2;
      add(stem,box(0.24*s,0.016*s,0.016*s),wm(),0,0.3*s,0);
      add(stem,box(0.016*s,0.016*s,0.24*s),wm(),0,0.3*s,0);
    }
    if(o.ry!=null)vg.rotation.y=o.ry;
    else if(o.along==='z')vg.rotation.y=Math.PI/2;
    else if(o.along==='y')vg.rotation.z=-Math.PI/2;
    g.add(vg);
    return {set(v){stem.position.y=0.2*s+0.07*s*v;stem.rotation.y=v*Math.PI*6;}};
  }
  function safetyValve(g,x,y,z){
    const sg=new T.Group();sg.position.set(x,y,z);g.add(sg);
    const bm=()=>M(0xb8832b,{m:0.35,r:0.45});
    add(sg,cyl(0.2,0.2,0.05,20),M(0x59666f),0,0.025,0);
    add(sg,cyl(0.1,0.13,0.3,18),bm(),0,0.2,0);
    cylX(sg,0.075,0.34,bm(),-0.17,0.12,0);
    const lift=new T.Group();lift.position.y=0.35;sg.add(lift);
    add(lift,cyl(0.085,0.085,0.5,16),M(0x7c8791,{m:0.4}),0,0.25,0);
    add(lift,cyl(0.11,0.11,0.05,16),bm(),0,0.52,0);
    const lever=add(lift,box(0.55,0.03,0.04),M(0xc0392b),0,0.58,0);
    add(lift,sph(0.035,8),bm(),0,0.58,0);
    return {lift:lift,lever:lever};
  }
  const part=(id,fn)=>{fn(G(id));};
  const shellish=m=>{m.userData.shellish=true;return m;};
  const dyn=m=>{m.userData.dyn=true;return m;};

  const PIPES={
    steam:[V(0.61,4.32,-0.43),V(0.61,5.3,-0.43),V(2.2,5.3,-0.43),V(2.2,3.4,-0.43)],
    fuel:[V(2.75,0.95,-0.1),V(2.75,5.3,-0.1),V(0,5.3,-0.1),V(0,5.3,0)],
    feed:[V(-2.65,0.75,0.35),V(-2.65,2.65,0.35),V(-2.65,2.65,0.92),V(-1.888,2.65,0.92),V(-1.168,2.65,0.57)],
    suction:[V(-3.25,0.45,-0.9),V(-2.3,0.45,-0.9),V(-2.3,0.45,0.35)],
    blow:[V(0.65,1.45,-1.126),V(0.95,1.45,-1.645),V(0.95,0.55,-1.645),V(1.45,0.55,-2.511)],
    scum:[V(-1.256,3.0,-0.336),V(-1.835,3.0,-0.492),V(-1.835,2.2,-0.492),V(-2.2,2.2,-0.6)],
    svA:[V(-0.736,4.42,-0.425),V(-1.1,4.42,-0.425),V(-1.1,6.3,-0.425)],
    svB:[V(-0.488,4.42,-0.696),V(-0.85,4.42,-0.696),V(-0.85,6.3,-0.696)],
    vent:[V(0.044,4.36,-0.498),V(0.044,4.78,-0.498)]
  };
  const prof=(a,b)=>[new T.Vector2(a,0),new T.Vector2(b,0),new T.Vector2(b,1),new T.Vector2(a,1),new T.Vector2(a,0)];
  const plateProf=(a,b)=>[new T.Vector2(a,-0.035),new T.Vector2(b,-0.035),new T.Vector2(b,0.035),new T.Vector2(a,0.035),new T.Vector2(a,-0.035)];

  /* ---- shell ---- */
  part('shell',g=>{
    const lag=0xaebcc6,stl=0x66737d,mid=(Y_TOP+Y_BOT)/2,h=Y_TOP-Y_BOT;
    add(g,cyl(1.26,1.3,0.35,40),M(0x34444f,{m:0.3}),0,0.175,0);

  }
  function endPtr(e){

  /* ---- apply simulation state to the model ---- */
  function applySim(s,dt,tm){
    const lv=s.level/100,ly=lvY(s.level);
    A.water.scale.y=Math.max(0.02,ly-1.43);
    A.steam.position.y=ly;A.steam.scale.y=Math.max(0.02,3.8-ly);
    A.surf.position.y=ly+0.003;
    A.glassW.forEach(w=>{w.scale.y=Math.max(0.001,lv*1.4);});
    A.lamps.forEach(l=>{l.m.material.emissiveIntensity=s.level>=l.lv?1.4:0.05;});
    A.needle.rotation.z=-(-135+clamp(s.P,0,12)/12*270)*Math.PI/180;
    const e=Math.min(1,dt*4);
    A.ventV+=((s.ventOpen?1:0)-A.ventV)*e;A.blowV+=((s.bottomBlow?1:0)-A.blowV)*e;A.scumV+=((s.scumBlow?1:0)-A.scumV)*e;
    A.vStop.set(s.stopValve);A.vVent.set(A.ventV);A.vBlow1.set(A.blowV);A.vBlow2.set(A.blowV);A.vScum.set(A.scumV);
    A.furnMat.emissiveIntensity=clamp((s.Tf-300)/900,0,1)*1.1;
    A.refMat.emissiveIntensity=clamp((s.Tf-300)/900,0,1)*0.55;A.refFl.emissiveIntensity=A.refMat.emissiveIntensity;
    A.tubeMat.emissiveIntensity=clamp((s.Tg-220)/260,0,1)*0.45;
    const tg=s.flame?1:0;A.ff+=(tg-A.ff)*Math.min(1,dt*(tg?6:3));
    A.flame.visible=A.ff>0.03;
    if(A.flame.visible){
      const fl=1+0.08*Math.sin(tm*23)+0.06*Math.sin(tm*37+1),L=(0.9+1.0*s.fire)*A.ff;
      A.flame.scale.set(1,Math.max(0.05,L*fl),1);
      A.flame.children.forEach((c,i)=>{const w=(0.85+0.3*s.fire)*(1+0.07*Math.sin(tm*(19+i*7)+i));c.scale.x=w;c.scale.z=w;c.rotation.y=tm*(1+i);});
    }
    furnaceLight.intensity=A.ff*(1.8+1.5*s.fire)*(1+0.08*Math.sin(tm*21));
    A.lens.material.emissive.setHex(s.flame?0x33ff88:0xff3322);A.lens.material.emissiveIntensity=s.flame?1.4:0.6;
    A.spark.visible=s.spark&&Math.sin(tm*90)>0;
    A.spray.visible=s.fuelValve&&!s.flame;
    A.fanRot.rotation.x+=dt*s.fan*28;A.lever.rotation.z=-s.damper*1.3;
    A.pumpRot.rotation.x+=dt*(s.feedPump?20:0);
    A.fuelRot.rotation.x+=dt*((s.burner!=='off'&&s.burner!=='standby')?16:0);
    A.sv.forEach((v,i)=>{v.lift.position.y=0.35+0.05*s.svLift[i];v.lever.rotation.z=-0.25*s.svLift[i];});
    A.coil.material.emissiveIntensity=s.fuelValve?1.3:0.05;
    A.plamps.forEach(l=>{l.m.material.emissiveIntensity=l.on(s)?1.6:0.06;});
    A.lcdT+=dt;if(A.lcdT>0.3){A.lcdT=0;drawLCD(s);}
    updateGas(s,dt);updateBubbles(s,dt,ly);updateFlows(s,dt);
    updatePuff(puffA,s.svOpen[0]?1:0,dt);updatePuff(puffB,s.svOpen[1]?1:0,dt);
    updatePuff(puffV,s.flows.vent>0.02?1:0,dt);
    updatePuff(smoke,s.flame?0.35+0.4*s.fire:0,dt);
  }

  function resize(){

    else if(id==='vent')SIM.act.vent(sim,val==='1');
    else if(id==='feed')SIM.act.feedMode(sim,val);
    else if(id==='stop')SIM.act.stop(sim,val==='1');
    else if(id==='bblow')SIM.act.bottomBlow(sim,val==='1');
    else if(id==='scum')SIM.act.scum(sim,val==='1');
    else if(id==='speed')sim.speed=+val;
    updateRun();return;
  }
  if(b.dataset.fault){SIM.act.fault(sim,b.dataset.fault,!sim.faults[b.dataset.fault]);updateRun();return;}
  if(b.dataset.preset){SIM.preset(sim,b.dataset.preset);toast(b.dataset.preset==='cold'?'Cold boiler: ready for a start-up':'Boiler steaming at about 6 bar','info');updateRun();return;}
  if(b.id==='resetBtn'){SIM.act.reset(sim);updateRun();}
});
$('#v-run').addEventListener('input',e=>{
  if(e.target.id==='demand'){SIM.act.demand(sim,+e.target.value/100);$('#demandv').textContent=e.target.value+'%';}
});
function updateRun(){
  if(UI.tab!=='run')return;
  const v=$('#v-run');
  $('#needle').setAttribute('transform','rotate('+dgP(clamp(sim.P,0,12)).toFixed(1)+' 80 70)');
  $('#dialv').textContent=sim.P.toFixed(1);
  const ly=122-clamp(sim.level,0,100)*1.14;
  $('#lvptr').setAttribute('transform','translate(0 '+ly.toFixed(1)+')');
  const lv=$('#lvv');lv.textContent=Math.round(sim.level);lv.setAttribute('y',(ly+7).toFixed(1));
  $('#t-f').textContent=Math.round(sim.Tf);$('#t-g').textContent=Math.round(sim.Tg);$('#t-w').textContent=Math.round(sim.Tw);$('#t-c').textContent=Math.round(sim.tds);
  $$('#seq span').forEach(s=>s.classList.toggle('on',s.dataset.s===sim.burner));
  const bs=$('#bstat');bs.textContent=SIM.status(sim);bs.style.color=sim.burner==='lockout'?'var(--bad)':'var(--ink2)';
  const state={burner:sim.burnerOn?'1':'0',vent:sim.ventOpen?'1':'0',feed:sim.feedMode,stop:sim.stopTarget===1?'1':'0',bblow:sim.bottomBlow?'1':'0',scum:sim.scumBlow?'1':'0',speed:String(sim.speed)};
  $$('.seg[data-ctl]',v).forEach(sg=>{$$('button',sg).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===state[sg.dataset.ctl])));});
  $$('[data-fault]',v).forEach(b=>b.setAttribute('aria-pressed',String(!!sim.faults[b.dataset.fault])));
  const dm=$('#demand');if(document.activeElement!==dm){dm.value=Math.round(sim.demand*100);$('#demandv').textContent=Math.round(sim.demand*100)+'%';}
  $('#resetBtn').disabled=!sim.lockout;
  const al=SIM.alarms(sim);
  $('#alist').innerHTML=al.length?al.map(a=>'<li class="'+(a.sev==='bad'?'bad':'')+'">'+a.text+'</li>').join(''):'<li class="none">No alarms</li>';
}

/* quiz */
function startQuiz(){UI.quiz={order:shuffle(QUIZ.map((q,i)=>i)).slice(0,8),i:0,score:0,picked:null,opts:null};renderQuiz();}
function renderQuiz(){
  const v=$('#v-quiz'),Q=UI.quiz;let h='';
  if(!Q){
    h='<h2>Check what you know</h2><p>Eight questions drawn from the parts guide and procedures. You get an explanation after every answer.</p><div class="row"><button class="btn pri" data-q="start">Start quiz</button></div>';
  }else if(Q.i>=Q.order.length){
    const msg=Q.score>=7?'Strong result. Try the fault drills in the Simulator next.':Q.score>=5?'A solid base. Revisit the parts you missed.':'Worth another pass through Parts and Procedures.';
    h='<p class="muted">Quiz complete</p><div class="score">'+Q.score+' / '+Q.order.length+'</div><p>'+msg+'</p><div class="row"><button class="btn pri" data-q="start">Try again</button><button class="btn" data-q="parts">Back to parts</button></div>';
  }else{
    const q=QUIZ[Q.order[Q.i]];
    if(!Q.opts)Q.opts=shuffle(q.a.map((t,k)=>({t:t,ok:k===q.c})));
    h='<div class="stepno">Question '+(Q.i+1)+' of '+Q.order.length+'</div><div class="prog"><i style="width:'+((Q.i+1)/Q.order.length*100)+'%"></i></div><h3 style="font-size:20px;margin-top:6px">'+q.q+'</h3>';
    h+=Q.opts.map((o,k)=>{let c='opt';if(Q.picked!==null){if(o.ok)c+=' right';else if(k===Q.picked)c+=' wrong';}return '<button class="'+c+'" data-k="'+k+'"'+(Q.picked!==null?' disabled':'')+'>'+o.t+'</button>';}).join('');
    if(Q.picked!==null){
      const ok=Q.opts[Q.picked].ok;
      h+='<div class="card"><b>'+(ok?'Correct.':'Not quite.')+'</b> '+q.w+'</div><div class="row"><button class="btn pri" data-q="next">'+(Q.i===Q.order.length-1?'See result':'Next question')+'</button></div>';
    }
  }
  v.innerHTML=h;
}
$('#v-quiz').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const Q=UI.quiz;
  if(b.dataset.q==='start'){startQuiz();$('#v-quiz').scrollTop=0;}
  else if(b.dataset.q==='parts'){UI.quiz=null;setTab('parts');}
  else if(b.dataset.q==='next'){Q.i++;Q.picked=null;Q.opts=null;renderQuiz();$('#v-quiz').scrollTop=0;}
  else if(b.dataset.k!==undefined&&Q&&Q.picked===null){Q.picked=+b.dataset.k;if(Q.opts[Q.picked].ok)Q.score++;renderQuiz();}
});

/* stage controls */
function setViewButtons(m){$$('#viewseg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===m)));}
$$('#viewseg button').forEach(b=>b.addEventListener('click',()=>{view3d.setView(b.dataset.view);setViewButtons(b.dataset.view);}));
view3d.onView=setViewButtons;
$$('#cams button[data-cam]').forEach(b=>b.addEventListener('click',()=>view3d.cam(b.dataset.cam)));
$('#namesBtn').addEventListener('click',e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));view3d.names(on);});
view3d.onPick=id=>{expandIfCollapsed();selectPart(id);};
$('#alarmBanner').addEventListener('click',()=>{expandIfCollapsed();setTab('run');});

function updateHUD(){
  const C=SIM.C,al=SIM.alarms(sim);
  $('#r-p').textContent=sim.P.toFixed(1);$('#r-l').textContent=Math.round(sim.level);$('#r-t').textContent=Math.round(sim.Tg);
  $('#pp').classList.toggle('bad',sim.P>=C.SV_SET[0]);$('#pp').classList.toggle('warn',sim.P>=7.2&&sim.P<C.SV_SET[0]);
  $('#pl').classList.toggle('bad',sim.level<C.LL||sim.level>=C.HH);$('#pl').classList.toggle('warn',(sim.level<C.LOW&&sim.level>=C.LL)||(sim.level>=C.HIGH&&sim.level<C.HH));
  $('#state').textContent=SIM.status(sim);
  const top=al.find(a=>a.sev==='bad')||al[0],bn=$('#alarmBanner');
  if(top){bn.hidden=false;bn.className=top.sev;bn.textContent=top.text+(al.length>1?'  (+'+(al.length-1)+' more)':'');}else bn.hidden=true;
}

/* main loop */
let last=performance.now(),hudT=0,ok3d=true;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  SIM.step(sim,dt);
  while(sim.events.length){const e=sim.events.shift();toast(e.msg,e.sev);}
  if(ok3d){try{view3d.tick(dt,now/1000);}catch(err){ok3d=false;console.error(err);}}
  hudT+=dt;if(hudT>0.15){hudT=0;updateHUD();updateRun();updateStepChk();}
}
buildRun();renderParts();renderSteps();renderQuiz();
setSheet(Math.round((appEl.clientHeight||700)*0.48),false);
setTab('parts');updateHUD();
requestAnimationFrame(frame);
})();
</script>
</body>
