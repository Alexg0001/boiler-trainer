<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marine Trainers</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#245676">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #08141b;
    color: #e8f1f7;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    display: flex; flex-direction: column;
  }
  header { padding: 28px 4px 20px; }
  header h1 { margin: 0; font-size: 26px; font-weight: 700; }
  header p { margin: 6px 0 0; color: #8fa9bb; font-size: 14px; }
  .list { display: flex; flex-direction: column; gap: 14px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: linear-gradient(180deg, #14324a, #0e2636);
    border: 1px solid #245676; border-radius: 16px;
    padding: 20px; min-height: 96px;
  }
  a.card:active { transform: scale(0.99); }
  .title { font-size: 19px; font-weight: 700; color: #ffffff; }
  .sub { margin-top: 6px; font-size: 14px; color: #8fa9bb; }
  .tag { display: inline-block; margin-top: 12px; font-size: 12px; color: #f2c230; letter-spacing: .04em; text-transform: uppercase; }
</style>
</head>
<body>
<header>
  <h1>Marine Trainers</h1>
  <p>Choose a system to study</p>
</header>
<main class="list">
  <a class="card" href="boiler.html">
    <div class="title">Boiler trainer</div>
    <div class="sub">Oil-fired auxiliary boiler: components, water and steam, safety, and procedures.</div>
    <span class="tag">Open</span>
  </a>
  <a class="card" href="compressor.html">
    <div class="title">Air compressor trainer</div>
    <div class="sub">Marine air compressor: detailed components and step-by-step operation.</div>
    <span class="tag">Open</span>
  </a>
</main>
</body>
</html>
