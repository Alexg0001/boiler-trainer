<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oil purifier trainer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#245676">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#e8f1f7; --ink-2:#9fb9c8; --paper:#0f1e28; --paper-2:#17303f; --card:#152b38; --line:#2a4b5e;
  --accent:#f0b429; --accent-ink:#2b1d00;
  --stage-top:#1f4d6b; --stage-bot:#0b1f2b; --bar:rgba(10,30,42,.78);
  --ok:#4cc38a; --bad:#ff7a6b;
  --oil:#b98446; --clean:#e0a526; --water:#3b8fd1; --sludge:#8a7060; --hot:#e0703d; --steam:#9aa7ad;
}
:root{--sw:min(46vw,420px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--stage-top);color:var(--ink);font-size:17px;
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;background:linear-gradient(var(--stage-top),var(--stage-bot))}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

#top{position:absolute;left:0;right:0;top:0;padding:14px 16px 0;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;z-index:6}
#top>*{pointer-events:auto}
.brand{font:700 24px/1.05 'Barlow Condensed',system-ui,sans-serif;letter-spacing:.01em;padding-left:2px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.brand strong{display:block}
.brand small{display:block;font:400 14.5px 'Barlow',sans-serif;color:var(--ink-2);margin-top:3px;letter-spacing:0}
#tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:0 6px;flex:0 0 auto}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:1 0 auto;min-height:48px;padding:10px 12px 11px;border:0;border-bottom:3px solid transparent;background:none;color:var(--ink-2);font:600 18px 'Barlow Condensed',sans-serif;white-space:nowrap;margin-bottom:-1px}
#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

#hud{position:absolute;left:16px;right:16px;top:80px;display:flex;flex-wrap:nowrap;gap:5px;overflow:visible;z-index:5;pointer-events:none}
#hud::-webkit-scrollbar{display:none}
#hud>div{flex:0 0 auto}
#hud[hidden]{display:none}
#hud div{display:flex;align-items:baseline;gap:4px;background:var(--bar);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:9px;padding:6px 7px;white-space:nowrap;flex:0 0 auto}
#hud span{display:inline;font-size:13px;color:var(--ink-2);line-height:1.1}
#hud b{font:700 20px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
#hud small{font-size:13px;color:var(--ink-2);margin-left:0}
#hud #hSt{font-size:17px;line-height:1;display:inline}

#pins{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
.pin{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;padding:0;border-radius:50%;
  border:2px solid var(--paper);background:var(--ink);color:var(--paper);font:600 13px/22px 'Barlow Condensed',sans-serif;text-align:center;pointer-events:auto;will-change:transform}
.pin::after{content:'';position:absolute;inset:-9px}
.pin.on{background:var(--accent);color:var(--accent-ink)}

#viewseg{margin:0;flex:0 0 auto;pointer-events:auto}
#viewseg[hidden]{display:none}
#viewseg button{min-height:34px;padding:4px 10px;font:600 14px 'Barlow',sans-serif}
#cams{position:absolute;right:12px;top:128px;z-index:6;display:flex;flex-direction:column;gap:7px;width:56px}
#cams button{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bar);color:var(--ink);font:600 15px 'Barlow',sans-serif;padding:4px 0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#cams button[aria-pressed="false"]{opacity:.6}
#cams #fab{position:static;width:auto;height:auto;min-height:40px;border-radius:10px;display:grid;place-items:center;padding:0;border:1px solid var(--line);background:var(--bar);color:var(--ink);z-index:7;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#fab svg{width:22px;height:22px}
#veil{position:absolute;inset:0;background:var(--stage-top);opacity:0;pointer-events:none;transition:opacity .35s;z-index:8}
#veil.on{opacity:1;transition:none}

#sheet{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:10;display:flex;flex-direction:column;
  background:var(--paper);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.45);transition:height .28s ease}
#sheet.peek{height:92px}
#sheet.half{height:46%}
#sheet.full{height:86%}
#sheet.drag{transition:none}
#grab{flex:0 0 auto;display:flex;justify-content:center;padding:9px 0 6px;touch-action:none;cursor:grab}
#grab i{width:44px;height:5px;border-radius:3px;background:var(--line)}
#body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 16px 28px;overscroll-behavior:contain}

.h{font:700 30px/1.05 'Barlow Condensed',sans-serif;margin:4px 0 6px}
.lede{color:var(--ink-2);font-size:17px;line-height:1.5;margin:0 0 12px;max-width:62ch}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0}
.seg button{min-height:46px;border:0;border-radius:9px;background:transparent;color:var(--ink-2);font:600 17px 'Barlow Condensed',sans-serif}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;margin:8px 0}
.row .btn{flex:1}
.btn{min-height:50px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font:600 17px 'Barlow Condensed',sans-serif;padding:0 18px}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.35}
.ex{display:block;margin:10px 0 4px;font-size:15px;color:var(--ink-2)}
.ex output{float:right;font-variant-numeric:tabular-nums}
.ex input{width:100%;height:34px;accent-color:var(--accent);margin:2px 0 0}
.card{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;background:var(--card);padding:14px 16px;margin:12px 0}
.card h3{font:700 20px/1.1 'Barlow Condensed',sans-serif;margin:0 0 6px}
.tag{display:inline-block;font:500 13.5px 'Barlow',sans-serif;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.card p{margin:4px 0 8px;font-size:16.5px;line-height:1.5}
.k{font-weight:600;font-size:15px;color:var(--ink-2);margin:8px 0 0}
.grp{font:700 17px 'Barlow Condensed',sans-serif;color:var(--ink-2);margin:16px 0 6px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:6px}
.chip{display:flex;align-items:center;gap:8px;min-height:50px;padding:8px 10px;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;
  background:var(--card);color:var(--ink);font:500 15px/1.2 'Barlow',sans-serif;text-align:left}
.chip b{flex:0 0 24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font:600 13px/24px 'Barlow Condensed',sans-serif;text-align:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] b{background:var(--accent-ink);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 8px;font-size:15px;color:var(--ink-2)}
.legend i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.ticks{display:flex;gap:3px;margin:2px 0 10px}
.ticks button{flex:1;height:22px;padding:0;border:0;background:transparent;position:relative}
.ticks button::before{content:'';position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:var(--line)}
.ticks button.done::before{background:var(--ink)}
.ticks button.cur::before{background:var(--accent)}
.stepno{font:600 15px 'Barlow',sans-serif;color:var(--ink-2)}
.do{margin:8px 0;padding-left:20px}
.do li{margin:6px 0;line-height:1.45;font-size:16.5px}
.watch{border-left:4px solid var(--accent);background:var(--paper-2);border-radius:0 10px 10px 0;padding:9px 13px;margin:10px 0;font-size:16.5px;line-height:1.45}
.why{font-size:15px;color:var(--ink-2);line-height:1.45;margin:8px 0}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:14px}
.opt{display:block;width:100%;min-height:48px;margin:7px 0;padding:10px 12px;text-align:left;border:1px solid var(--line);border-radius:10px;
  background:transparent;color:var(--ink);font:500 16.5px/1.35 'Barlow',sans-serif}
.opt.right{border-color:var(--ok);box-shadow:inset 5px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 5px 0 0 var(--bad)}
.note{font-size:14px;color:var(--ink-2);margin:16px 0 0;line-height:1.4}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:150px;z-index:9;background:var(--ink);color:var(--paper);
  border-radius:10px;padding:8px 14px;font-size:15px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:.94}
@media (orientation:landscape) and (min-width:560px){
  #sheet{left:auto;right:12px;bottom:12px;width:var(--sw);height:calc(100% - 24px)!important;border-radius:18px;border:1px solid var(--line)}
  #grab{position:absolute;left:-15px;top:0;bottom:0;width:30px;padding:0;align-items:center;cursor:ew-resize;z-index:2}
  #grab i{width:5px;height:48px}

  #cams{top:128px;gap:5px;right:calc(var(--sw) + 24px)}
  #cams button{min-height:34px;font-size:14px}
  #hud{top:80px;right:calc(var(--sw) + 24px)}
  #top{right:calc(var(--sw) + 24px)}
  .toast{left:calc((100% - var(--sw) - 24px)/2)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="Interactive 3D model of a marine fuel oil purifier"></canvas>
  <div id="pins"></div>
  <div id="top">
    <div class="brand"><strong>Oil purifier trainer</strong><small>Marine centrifugal separator</small></div>
    <div class="seg viewseg" id="viewseg" role="group" aria-label="View style"><button data-v="cut" aria-pressed="false">Cutaway</button><button data-v="ext" aria-pressed="true">Outside</button></div>
  </div>
  <div id="hud" hidden>
    <div><span>Speed</span><b id="hRpm">0</b><small>rpm</small></div>
    <div><span>Current</span><b id="hAmp">0</b><small>A</small></div>
    <div><span>Oil temp</span><b id="hTemp">45</b><small>&deg;C</small></div>
    <div><span>Status</span><b id="hSt">Stopped</b></div>
  </div>
  <div class="toast" id="toast">Drag to turn &middot; pinch to zoom &middot; tap a part</div>
  <div id="cams" role="group" aria-label="Camera">
    <button data-cam="front">Front</button><button data-cam="right">Right</button><button data-cam="back">Back</button><button data-cam="top">Top</button><button id="namesBtn" aria-pressed="true">Names</button>
    <button id="fab" aria-label="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  </div>
  <div id="veil"></div>
  <section id="sheet" class="half" aria-live="polite">
    <div id="grab" aria-label="Resize panel"><i></i></div>
    
    <div id="tabs" role="tablist">
      <button role="tab" data-mode="plant">System</button>
      <button role="tab" data-mode="purifier">Purifier</button>
      <button role="tab" data-mode="operate">Operate</button>
      <button role="tab" data-mode="faults">Faults</button>
      <button role="tab" data-mode="overhaul">Overhaul</button>
      <button role="tab" data-mode="quiz">Quiz</button>
    </div>
    <div id="body"></div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const damp=(a,b,k,dt)=>a+(b-a)*(1-Math.exp(-k*dt));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const col=h=>new THREE.Color(h).convertSRGBToLinear();
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas=$('#gl'),appEl=$('#app'),sheet=$('#sheet'),bodyEl=$('#body');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});}
catch(e){bodyEl.innerHTML='<h2 class="h">3D is not available</h2><p class="lede">This browser could not start WebGL. Try another browser or device.</p>';throw e;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.NoToneMapping;
renderer.toneMappingExposure=1.0;
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,0.1,400);
const secPlane=new THREE.Plane(new THREE.Vector3(0,0,-1),0);

scene.add(new THREE.HemisphereLight(0xffffff,0x44525c,0.8));
const keyL=new THREE.DirectionalLight(0xffffff,1.5);keyL.position.set(8,16,12);scene.add(keyL);
const rimL=new THREE.DirectionalLight(0xbfd8ff,0.6);rimL.position.set(-10,6,-8);scene.add(rimL);const fillL=new THREE.DirectionalLight(0xffffff,.5);fillL.position.set(0,-6,10);scene.add(fillL);

const C={steel:'#c3ccd1',steelD:'#7d8a92',steelL:'#dbe2e6',blue:'#2f6690',hood:'#cfd9de',brass:'#c9a23c',rubber:'#1d2126',dark:'#2b3238',
  red:'#c8372d',green:'#2f8f5b',yellow:'#e6b422',oil:'#8a5a2b',clean:'#e0a526',water:'#3b8fd1',sludge:'#4b3a30',hot:'#d96b3b',steam:'#cfd6da'};
function M(hex,metal,rough,o){return new THREE.MeshStandardMaterial(Object.assign({color:col(hex),metalness:(metal==null?.6:metal)*.4,roughness:rough==null?.45:rough,side:THREE.DoubleSide,envMapIntensity:.6},o||{}));}

function lathe(pts,mat,seg){return new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg||64),mat);}
function shell(pts,t){
  const n=pts.length,inner=[];
  for(let i=0;i<n;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
    let tx=b[0]-a[0],ty=b[1]-a[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    inner.push([pts[i][0]-ty*t,pts[i][1]+tx*t]);
  }
  return pts.concat(inner.reverse());
}
function cyl(p,rt,rb,h,mat,x,y,z,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||32),mat);m.position.set(x||0,y||0,z||0);p.add(m);return m;}
function hcyl(p,r,len,mat,x,y,z,seg){const m=cyl(p,r,r,len,mat,x,y,z,seg);m.rotation.z=Math.PI/2;return m;}
function zcyl(p,r,len,mat,x,y,z,seg){const m=cyl(p,r,r,len,mat,x,y,z,seg);m.rotation.x=Math.PI/2;return m;}
function bx(p,w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x||0,y||0,z||0);p.add(m);return m;}
function sph(p,r,mat,x,y,z){const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),mat);m.position.set(x||0,y||0,z||0);p.add(m);return m;}
function tor(p,R,r,mat,x,y,z,seg){const m=new THREE.Mesh(new THREE.TorusGeometry(R,r,10,seg||64),mat);m.rotation.x=Math.PI/2;m.position.set(x||0,y||0,z||0);p.add(m);return m;}
// ---------- PURIFIER MODEL ----------
const root=new THREE.Group();scene.add(root);
const mach=new THREE.Group();root.add(mach);
const rot=new THREE.Group();mach.add(rot);
const PARTS={},PLIST=[];
const GLOW=col('#ffb020');
function addPart(d){
  const g=new THREE.Group();d.build(g);
  (d.rot?rot:mach).add(g);
  d.g=g;d.mats=[];d.ex=d.ex||[0,0,0];d.alpha=1;d.aT=1;d.glow=0;d.gT=0;d.dy=0;d.xk=0;d.xT=0;
  g.traverse(o=>{if(o.isMesh){o.userData.pid=d.id;const a=Array.isArray(o.material)?o.material:[o.material];a.forEach(m=>{if(d.mats.indexOf(m)<0)d.mats.push(m);});}});
  d.n=PLIST.length+1;PARTS[d.id]=d;PLIST.push(d);return d;
}
const pipeMat=h=>M(h,.55,.4);

addPart({id:'framehood',name:'Frame hood',grp:'cover',ex:[0,12.5,0],anchor:[-2.6,6.7,0],zoom:16,
  what:'Fixed cover over the whole bowl. It carries the feed inlet and both outlets, and keeps hot oil and noise inside.',
  watch:'Check the hood is clamped down and its seal is sound. A loose hood can spray hot oil.',
  build(g){
    g.add(lathe(shell([[3.1,4.95],[3.1,5.7],[2.95,6.35],[2.55,7.05],[2.0,7.6],[1.5,7.95],[1.2,8.1],[1.2,8.35],[0.02,8.35]],.14),M(C.hood,.35,.5),80));
    tor(g,3.1,.08,M(C.steelD,.7,.4),0,5.05,0,80);
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2;bx(g,.22,.3,.22,M(C.steelD,.8,.4),Math.cos(a)*3.2,5.05,Math.sin(a)*3.2);}
  }});
addPart({id:'inlet',name:'Feed inlet pipe',grp:'cover',ex:[0,15,0],anchor:[0,9.0,0],zoom:9,
  what:'Fixed pipe that carries heated oil down the centre of the bowl and into the distributor.',
  watch:'Feed oil only when the bowl is at full speed and closed. Feeding early gives poor separation and leaks.',
  build(g){
    const m=pipeMat(C.oil);
    cyl(g,.14,.14,5.55,m,0,6.725,0,24);cyl(g,.3,.3,.12,m,0,8.45,0,32);sph(g,.17,m,0,9.5,0);
    zcyl(g,.14,1.4,m,0,9.5,-.7,24);zcyl(g,.3,.1,m,0,9.5,-1.4,32);
  }});
addPart({id:'oil_out',name:'Clean oil outlet',grp:'cover',ex:[1.4,14,0],anchor:[1.8,8.9,0],zoom:9,
  what:'Where purified oil leaves, pushed out by the oil paring disc. It runs on to the daily service tank.',
  watch:'Outlet pressure should stay steady. A sudden rise or drop usually means a blockage or a full sludge space.',
  build(g){
    const m=pipeMat(C.clean);
    cyl(g,.16,.16,.6,m,.7,8.6,0,24);sph(g,.19,m,.7,8.9,0);hcyl(g,.16,2.2,m,1.8,8.9,0,24);hcyl(g,.32,.1,m,2.9,8.9,0,32);
  }});
addPart({id:'water_out',name:'Water outlet',grp:'cover',ex:[-1.4,14,0],anchor:[-1.8,8.55,0],zoom:9,
  what:'Separated water leaves here, pushed out by the water paring disc. It goes to the sludge tank.',
  watch:'Oil coming out here means the water seal has broken. Stop feed, then check the gravity disc and seal water.',
  build(g){
    const m=pipeMat(C.water);
    cyl(g,.16,.16,.25,m,-.7,8.425,0,24);sph(g,.19,m,-.7,8.55,0);hcyl(g,.16,2.2,m,-1.8,8.55,0,24);hcyl(g,.32,.1,m,-2.9,8.55,0,32);
  }});
addPart({id:'paring_oil',name:'Oil paring disc',grp:'cover',ex:[0,9.7,0],anchor:[.45,7.4,0],zoom:7,
  what:'A fixed disc dipped into the spinning oil. It works as a pump (a centripetal pump) and pushes clean oil out under pressure.',
  watch:'Wear lowers outlet pressure. Too much back pressure can push oil to the water side.',

function fireBurst(){
  for(let i=0;i<90;i++){
    const a=Math.random()*Math.PI*2,sp=6+Math.random()*4;
    burst.pos.set([Math.cos(a)*2.2,4.78+Math.random()*.2,Math.sin(a)*2.2],i*3);
    burst.vel.set([Math.cos(a)*sp,1+Math.random()*1.5,Math.sin(a)*sp],i*3);
    burst.life[i]=1.2+Math.random()*.6;
  }

function updBurst(dt){
  let any=false;
  for(let i=0;i<90;i++){
    if(burst.life[i]<=0)continue;any=true;
    const k=i*3;burst.vel[k+1]-=9*dt;
    burst.pos[k]+=burst.vel[k]*dt;burst.pos[k+1]+=burst.vel[k+1]*dt;burst.pos[k+2]+=burst.vel[k+2]*dt;
    const r=Math.hypot(burst.pos[k],burst.pos[k+2]);
    if(r>2.9){const f=2.9/r;burst.pos[k]*=f;burst.pos[k+2]*=f;burst.vel[k]*=.05;burst.vel[k+2]*=.05;}
    if(burst.pos[k+1]<3.25){burst.pos[k+1]=3.25;burst.vel[k+1]=0;burst.life[i]-=dt*3;}
    burst.life[i]-=dt;
    if(burst.life[i]<=0)burst.pos[k+1]=-100;
  }
  if(any)burst.geo.attributes.position.needsUpdate=true;
}

const FLOWS=[];
class Flow{
  constructor(parent,pts,hex,n,speed,size,jit){
    this.pts=pts.map(p=>V3(p[0],p[1],p[2]));this.len=[0];
    for(let i=1;i<this.pts.length;i++)this.len.push(this.len[i-1]+this.pts[i].distanceTo(this.pts[i-1]));
    this.L=this.len[this.len.length-1]||1;this.n=n;this.speed=speed;
    this.o=new Float32Array(n*3);const j=jit||0;for(let i=0;i<n*3;i++)this.o[i]=(Math.random()-.5)*j;
    this.geo=new THREE.BufferGeometry();this.geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
    this.mat=new THREE.PointsMaterial({color:col(hex),size:size,map:dotTex,transparent:true,depthWrite:false,opacity:0,alphaTest:.02});
    this.obj=new THREE.Points(this.geo,this.mat);this.obj.frustumCulled=false;this.obj.visible=false;parent.add(this.obj);
    this.on=0;this.k=0;this.int=false;FLOWS.push(this);
  }
  update(dt,time,tmp){
    this.k=damp(this.k,this.on,6,dt);
    const vis=this.k>.02;this.obj.visible=vis;if(!vis)return;
    this.mat.opacity=this.k*.95;
    const pos=this.geo.attributes.position.array,L=this.L,len=this.len,P=this.pts;
    for(let i=0;i<this.n;i++){
      const s=(((i/this.n)+time*this.speed/L)%1)*L;let a=1;
      while(a<len.length-1&&len[a]<s)a++;
      const t=(s-len[a-1])/((len[a]-len[a-1])||1),p0=P[a-1],p1=P[a];
      pos[i*3]=p0.x+(p1.x-p0.x)*t+this.o[i*3];pos[i*3+1]=p0.y+(p1.y-p0.y)*t+this.o[i*3+1];pos[i*3+2]=p0.z+(p1.z-p0.z)*t+this.o[i*3+2];
    }
    this.geo.attributes.position.needsUpdate=true;
  }
}

function applyStep(i){
  stepI=i;const s=STEPS[i];clearTimers();dis.t=-1;resetFx();sim.slideOpen=0;
  setSceneMode(s.scene);secOn=!!s.sec;exGoal=0;exK=0;
  sim.rpmT=s.rpm;sim.tempT=s.temp;sim.closedT=s.closed;sim.sealT=s.seal||0;decelFast=true;
  if(s.scene==='purifier'&&s.rpm===0)sim.rpm=0;
  if(s.reset)sim.rpm=0;
  if(i<3){sim.temp=45;sim.closed=0;sim.seal=0;}
  valve=s.valve||(i>=7&&i<10?'purifier':'recirc');
  want=new Set(s.flows);
  sludgeMode=s.sludge==='grow'?'grow':'static';
  if(s.sludge==='grow'){if(i===8)sim.sludge=Math.max(sim.sludge,.1);}else if(!s.sludge)sim.sludge=0;
  glowSet.clear();s.hl.forEach(h=>glowSet.add(h));
  selPart=null;selItem=null;
  if(s.view==='plant')plantView();else frameView(s.view[0],s.view[1],s.view[2],s.view[3],s.view[4]);
  if(s.enter)s.enter();
  buildPins();renderOperate();

function replayStep(){
  const s=STEPS[stepI];
  if(stepI===3){sim.rpm=0;sim.rpmT=RPM_MAX;}
  else if(stepI===9){sim.sludge=.85;startDischarge();}
  void s;
}

const tmpW=V3(0,0,0);
function partWorld(d,out){out.set(d.anchor[0]+d.ex[0]*exK,d.anchor[1]+d.ex[1]*exK,d.anchor[2]+d.ex[2]*exK);return root.localToWorld(out);}
function focusAt(pos,dist){
  cam.g.t.copy(pos);cam.g.r=clamp(dist,5,60);userCam=true;
}
function selectPart(id){
  selPart=id;selItem=null;
  PLIST.forEach(p=>{p.aT=(id&&p.id!==id)?.1:1;});
  if(id){const d=PARTS[id];root.updateMatrixWorld(true);partWorld(d,tmpW);focusAt(tmpW,d.zoom*(isPortrait()?1.7:1.25));if(sheet.classList.contains('peek'))setSheet('half');}
  refreshCard();refreshChips();refreshPins();
}
function selectItem(id){
  selItem=id;selPart=null;
  if(id){const d=PIT[id];focusAt(V3(d.anchor[0],d.anchor[1]-.8,d.anchor[2]),d.zoom*(isPortrait()?1.8:1.3));if(sheet.classList.contains('peek'))setSheet('half');}
  refreshCard();refreshChips();refreshPins();
}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function tapAt(x,y){
  if(mode!=='plant'&&mode!=='purifier')return;
  const r=canvas.getBoundingClientRect();
  ndc.set(((x-r.left)/r.width)*2-1,-((y-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(sceneMode==='plant'?[root,plant]:[root],true);
  for(const h of hits){
    const o=h.object;if(o.isPoints||o.isLineSegments)continue;
    if(sceneMode==='purifier'&&secOn&&h.point.z>.02)continue;
    if(o.userData.pid){
      if(sceneMode==='plant'){selectItem('purifier');return;}
      if(PARTS[o.userData.pid].alpha<.35)continue;
      selectPart(selPart===o.userData.pid?null:o.userData.pid);return;
    }
    if(o.userData.iid){selectItem(selItem===o.userData.iid?null:o.userData.iid);return;}
  }
  if(sceneMode==='plant')selectItem(null);else selectPart(null);
}

// ---------- PINS ----------
let pins=[];
function buildPins(){
  pinsEl.innerHTML='';pins=[];
  const show=(mode==='plant'||(mode==='purifier'&&pinsOn));
  if(!show)return;
  const list=sceneMode==='plant'?PILIST:PLIST;
  list.forEach(d=>{
    const el=document.createElement('button');el.className='pin';el.textContent=d.n;el.setAttribute('aria-label',d.name);
    el.addEventListener('click',()=>{sceneMode==='plant'?selectItem(d.id):selectPart(d.id);});
    pinsEl.appendChild(el);pins.push({el,d,plant:sceneMode==='plant'});
  });
  refreshPins();
}
function refreshPins(){pins.forEach(p=>p.el.classList.toggle('on',p.plant?selItem===p.d.id:selPart===p.d.id));}
const pv=V3(0,0,0);
function updPins(){
  if(!pins.length)return;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  for(const p of pins){
    const d=p.d;
    if(p.plant)pv.set(d.anchor[0],d.anchor[1],d.anchor[2]);
    else{pv.set(d.anchor[0]+d.ex[0]*exK,d.anchor[1]+d.ex[1]*exK,d.anchor[2]+d.ex[2]*exK);root.localToWorld(pv);}
    const wz=pv.z;pv.project(camera);
    const vis=pv.z<1&&Math.abs(pv.x)<1.05&&Math.abs(pv.y)<1.05&&(p.plant||(!(secOn&&wz>.05)&&d.alpha>.3));
    p.el.style.display=vis?'':'none';
    if(vis)p.el.style.transform='translate('+((pv.x*.5+.5)*w).toFixed(1)+'px,'+((-pv.y*.5+.5)*h).toFixed(1)+'px)';
  }
}

// ---------- SHEET ----------
function setSheet(st){sheet.classList.remove('peek','half','full','drag');sheet.classList.add(st);sheet.style.height='';}
(function(){
  const grab=$('#grab');let y0=0,h0=0,x0=0,w0=0,drag=false,mv=0,side=false;
  grab.addEventListener('pointerdown',e=>{drag=true;mv=0;y0=e.clientY;h0=sheet.offsetHeight;x0=e.clientX;w0=sheet.offsetWidth;side=sideMode();sheet.classList.add('drag');grab.setPointerCapture(e.pointerId);});
  grab.addEventListener('pointermove',e=>{
    if(!drag)return;
    if(side){
      mv=Math.max(mv,Math.abs(e.clientX-x0));
      const nw=clamp(w0+(x0-e.clientX),240,appEl.clientWidth*.7);
      document.documentElement.style.setProperty('--sw',nw+'px');
      if(!userCam&&viewFn)viewFn();
      return;
    }
    mv=Math.max(mv,Math.abs(e.clientY-y0));sheet.style.height=clamp(h0+(y0-e.clientY),92,appEl.clientHeight*.9)+'px';
  });
  const up=()=>{
    if(!drag)return;drag=false;
    if(side){sheet.classList.remove('drag');return;}
    const H=appEl.clientHeight,h=sheet.offsetHeight;let st;
    if(mv<5){const cur=h0<120?'peek':h0>H*.7?'full':'half';st=cur==='peek'?'half':cur==='half'?'full':'half';}
    else{const c={peek:92,half:H*.46,full:H*.86};st=Object.keys(c).sort((a,b)=>Math.abs(c[a]-h)-Math.abs(c[b]-h))[0];}
    setSheet(st);
  };
  grab.addEventListener('pointerup',up);grab.addEventListener('pointercancel',up);
})();

function setExplode(v){

function setMode(m){
  clearTimers();dis.t=-1;sim.slideOpen=0;mode=m;selPart=null;selItem=null;glowSet.clear();resetFx();

  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===m)));

  else if(m==='purifier'){setSceneMode('purifier');secOn=false;flowOn=false;spinOn=false;exGoal=0;exK=0;applyPurState();purView();renderPurifier();}
  else if(m==='operate'){applyStep(0);return;}
  else if(m==='faults'){setSceneMode('purifier');exGoal=0;exK=0;faultsList();}
  else if(m==='overhaul'){applyOv(0);return;}
  else{setSceneMode('purifier');secOn=false;exGoal=0;exK=0;want=new Set();sim.rpmT=RPM_MAX;sim.closedT=1;sim.sealT=1;sludgeMode='static';sim.sludge=.45;decelFast=true;purView();quizI=0;quizScore=0;quizDone=false;quizPick=-1;renderQuiz();}

bodyEl.addEventListener('click',e=>{

  else if(a==='tg'){
    if(v==='sec'){secOn=!secOn;if(!secOn&&flowOn){}purView();}
    else if(v==='flow'){flowOn=!flowOn;if(flowOn&&!secOn){secOn=true;purView();}if(flowOn&&exGoal>.02){exGoal=0;const r=$('#ex');if(r)r.value=0;setExplode(0);purView();}applyPurState();}
    else if(v==='spin'){spinOn=!spinOn;applyPurState();}

  }
  else if(a==='desludge'){
    if(exGoal>.02){exGoal=0;const r=$('#ex');if(r)r.value=0;setExplode(0);}
    spinOn=true;secOn=true;sim.sludge=.85;sim.rpm=Math.max(sim.rpm,RPM_MAX*.9);applyPurState();sim.sludge=.85;purView();syncTools();startDischarge();

  }
  else if(a==='fault')applyFault(+v);

  else if(a==='ostep')applyOv(+v);
  else if(a==='onext')applyOv(ovI===OV.length-1?0:ovI+1);
  else if(a==='oprev')applyOv(Math.max(0,ovI-1));
  else if(a==='oreplay')reassemble();
  else if(a==='step')applyStep(+v);
  else if(a==='next')applyStep(stepI===STEPS.length-1?0:stepI+1);
  else if(a==='prev')applyStep(Math.max(0,stepI-1));
  else if(a==='replay')replayStep();
  else if(a==='qopt'){quizPick=+v;if(quizPick===QUIZ[quizI].a)quizScore++;renderQuiz();}
  else if(a==='qnext'){quizPick=-1;if(quizI===QUIZ.length-1)quizDone=true;else quizI++;renderQuiz();bodyEl.scrollTop=0;}
  else if(a==='qrestart'){quizI=0;quizScore=0;quizDone=false;quizPick=-1;renderQuiz();}

let ovI=0;
function ovOut(i){const s=new Set();for(let k=0;k<=Math.min(i,9);k++)OV[k].rm.forEach(x=>s.add(x));return s;}
function reassemble(){
  clearTimers();PLIST.forEach(p=>{p.xT=1;});
  REASSEMBLY.forEach((id,k)=>later(300+k*650,()=>{PARTS[id].xT=0;}));
}
function applyOv(i){
  ovI=i;const s=OV[i];clearTimers();dis.t=-1;resetFx();setSceneMode('purifier');
  secOn=false;exGoal=0;exK=0;want=new Set();selPart=null;PLIST.forEach(p=>{p.aT=1;});
  sim.rpmT=i===11?RPM_MAX:0;sim.rpm=i===11?0:0;sim.closedT=(i<8||i===11)?1:0;sim.closed=sim.closedT;sim.sealT=0;sim.seal=0;
  sim.tempT=45;sim.temp=45;decelFast=true;sludgeMode='static';sim.sludge=i<9?.6:0;
  if(i>=10&&i<11)reassemble();
  else if(i===11){PLIST.forEach(p=>{p.xT=0;});}
  else{const out=ovOut(i);PLIST.forEach(p=>{p.xT=out.has(p.id)?1:0;});}
  if(i===9)later(900,()=>{sim.sludge=0;});
  glowSet.clear();s.hl.forEach(h=>glowSet.add(h));

const INT_MAIN=['feedO','br','oil','heavy','water'];
function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camera._w=0;
  if(!userCam&&viewFn)viewFn();

function update(dt){
  updSim(dt);updBurst(dt);
  const ang=sim.rpm/RPM_MAX*6;
  rot.rotation.y+=ang*dt;const sh=sim.shake*.07*(sim.rpm/RPM_MAX);rot.position.set((Math.random()-.5)*sh,0,(Math.random()-.5)*sh);
  const wd=PARTS.worm.g.userData;wd.wheel.rotation.y=rot.rotation.y;wd.worm.rotation.x=rot.rotation.y*3.2;
  exK=damp(exK,exGoal,6,dt);if(Math.abs(exK-exGoal)<.001)exK=exGoal;
  PARTS.slide.dy=-.32*Math.max(1-sim.closed,sim.slideOpen);
  setSludge(sim.sludge);
  pulse=.55+.45*Math.sin(time*4.5);
  const purGlow=selItem==='purifier'||glowSet.has('purifier');
  for(const d of PLIST){
    d.xk=damp(d.xk,d.xT,5,dt);if(Math.abs(d.xk-d.xT)<.002)d.xk=d.xT;const ek=Math.max(exK,d.xk);d.g.position.set(d.ex[0]*ek,d.ex[1]*ek+d.dy,d.ex[2]*ek);
    d.alpha=damp(d.alpha,d.aT,10,dt);d.gT=(selPart===d.id||glowSet.has(d.id)||purGlow)?1:0;d.glow=damp(d.glow,d.gT,10,dt);
    const tr=d.alpha<.995,dw=d.alpha>.6;
    for(const m of d.mats){
      if(m.transparent!==tr){m.transparent=tr;m.needsUpdate=true;}
      m.opacity=tr?d.alpha:1;m.depthWrite=dw;
      m.emissive.copy(GLOW);m.emissiveIntensity=d.glow*(.2+.3*pulse);
    }
  }
  for(const d of PILIST){
    d.gT=(selItem===d.id||glowSet.has(d.id))?1:0;d.glow=damp(d.glow,d.gT,10,dt);
    for(const m of d.mats){m.emissive.copy(GLOW);m.emissiveIntensity=d.glow*(.15+.25*pulse);}
  }
  PIT.threeway.g.userData.lever.rotation.y=damp(PIT.threeway.g.userData.lever.rotation.y,valve==='purifier'?Math.PI/2:0,6,dt);
  const busy=dischargeBusy(),dt0=dis.t;
  for(const name in G){
    let on=want.has(name)?1:0;const f0=G[name][0];
    if(f0.int){
      if(exK>.03)on=0;
      if(busy&&INT_MAIN.indexOf(name)>=0)on=0;
      if(name==='feedW'&&dt0>.2&&dt0<.9)on=1;
      if(name==='sOut')on=(want.has('sOut')||(dt0>1.0&&dt0<2.8))?1:0;
    }
    if(sceneMode==='plant'&&f0.int&&name==='sOut')on=0;
    G[name].forEach(f=>{f.on=on;});
  }
  renderer.clippingPlanes=(sceneMode==='purifier'&&secOn)?[secPlane]:[];
  if(mode==='quiz'&&!userCam)cam.g.th+=dt*.25;
  for(const f of FLOWS)f.update(dt,time);
  updCam(dt);
  hudT+=dt;
  if((mode==='operate'||mode==='faults')&&hudT>.1){
    hudT=0;hRpm.textContent=Math.round(sim.rpm/10)*10;hAmp.textContent=amps();hTemp.textContent=Math.round(sim.temp);hSt.textContent=statusText();
  }
}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=reduceMotion?dt*.5:dt;
  update(dt);renderer.render(scene,camera);updPins();
}
resize();
setMode('plant');
cam.th=cam.g.th;cam.ph=cam.g.ph;cam.r=cam.g.r;cam.t.copy(cam.g.t);
requestAnimationFrame(frame);
(function(){const t=$('#toast');setTimeout(()=>t.classList.add('on'),600);setTimeout(()=>t.classList.remove('on'),4200);})();
