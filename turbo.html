<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turbocharger Trainer</title>
<meta name="theme-color" content="#1f4f6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage-a:#26506d; --stage-b:#0a1f2e;
  --bg:#e7edf0; --panel:#f3f6f7; --card:#ffffff; --ink:#10222d; --ink2:#4d616d; --line:#cbd6dc; --chip:#e3eaee;
  --accent:#f2c230; --accent-ink:#1b1708;
  --ok:#17804f; --warn:#a96a00; --bad:#c32f2f; --info:#1f6fa8;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08141b; --panel:#112430; --card:#17303f; --ink:#e8f0f4; --ink2:#a0b4c0; --line:#28475a; --chip:#1e3a4b;
    --ok:#4fd197; --warn:#f0b445; --bad:#ff7070; --info:#6cb8ee;
  }
}
:root[data-theme="dark"]{
  --bg:#08141b; --panel:#112430; --card:#17303f; --ink:#e8f0f4; --ink2:#a0b4c0; --line:#28475a; --chip:#1e3a4b;
  --ok:#4fd197; --warn:#f0b445; --bad:#ff7070; --info:#6cb8ee;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--stage-a) 50%,var(--panel) 50%)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 0;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--stage-a),var(--stage-b))}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.nogl{position:absolute;inset:auto 16px 16px;margin:0;padding:12px 14px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px}

#top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 10px 0;pointer-events:none;color:#eaf3f8}
#top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.05;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.brand strong{font:700 24px/1 var(--font-disp);letter-spacing:.01em}
.brand span{font-size:14.5px;opacity:.82;margin-top:3px}
.seg{display:inline-flex;background:rgba(8,26,38,.62);border:1px solid rgba(190,225,245,.22);border-radius:9px;padding:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;color:inherit;padding:6px 10px;border-radius:7px;font-size:14px;font-weight:500;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#top .seg{color:#dcecf5}
#readout{position:absolute;left:10px;right:64px;top:58px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.pill{display:flex;align-items:baseline;gap:5px;background:rgba(8,26,38,.66);border:1px solid rgba(190,225,245,.2);color:#eaf3f8;border-radius:8px;padding:3px 9px 4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill i{font-style:normal;font-size:14px;opacity:.8}
.pill b{font:600 22px/1 var(--font-disp);font-variant-numeric:tabular-nums}
.pill u{text-decoration:none;font-size:14px;opacity:.8}
.pill.warn{border-color:#f0b445;background:rgba(120,78,0,.7)}
.pill.bad{border-color:#ff7070;background:rgba(130,20,20,.75)}
#state{flex-basis:100%;font-size:15.5px;color:#dff0f8;text-shadow:0 1px 6px rgba(0,0,0,.6);padding-left:2px}
#cams{position:absolute;right:10px;top:58px;display:flex;flex-direction:column;gap:6px}
#cams button{width:46px;min-height:34px;border:1px solid rgba(190,225,245,.22);background:rgba(8,26,38,.62);color:#dcecf5;border-radius:8px;font-size:13px;padding:3px 0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#cams button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#alarmBanner{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;max-width:calc(100% - 24px);border:0;border-radius:9px;padding:8px 14px;font-weight:600;font-size:15px;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#alarmBanner.warn{background:#9a6200}
#alarmBanner.bad{background:#b52a2a}
#toast{position:absolute;left:50%;transform:translateX(-50%) translateY(6px);bottom:56px;max-width:calc(100% - 24px);background:rgba(8,26,38,.9);color:#eaf3f8;border:1px solid rgba(190,225,245,.25);border-left:4px solid var(--info);border-radius:8px;padding:8px 12px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:left}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.ok{border-left-color:#4fd197}#toast.warn{border-left-color:#f0b445}#toast.bad{border-left-color:#ff7070}

#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#pins.hide{display:none}
.pin{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border:0;background:none;pointer-events:auto;display:grid;place-items:center;will-change:transform,opacity}
.pin .dot{width:13px;height:13px;border-radius:50%;background:var(--pc,#fff);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.4)}
.pin .lab{position:absolute;left:22px;top:50%;transform:translateY(-50%);white-space:nowrap;background:rgba(8,26,38,.9);color:#fff;font-size:13.5px;padding:2px 8px;border-radius:5px;display:none;pointer-events:none}
body.names .pin .lab,.pin.on .lab{display:block}
.pin.on{z-index:3}
.pin.on .dot{transform:scale(1.45);background:var(--accent);box-shadow:0 0 0 3px rgba(242,194,48,.35),0 2px 8px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){.pin.on .dot{animation:ping 1.8s ease-out infinite}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,194,48,.7)}100%{box-shadow:0 0 0 14px rgba(242,194,48,0)}}

#panel{flex:0 0 auto;height:48%;display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);position:relative;z-index:5;min-height:0}
#panel.snap{transition:height .22s ease}
#grab{flex:0 0 22px;display:grid;place-items:center;touch-action:none;cursor:ns-resize}
#grab i{width:42px;height:5px;border-radius:3px;background:var(--line)}
#tabs{flex:0 0 auto;display:flex;border-bottom:1px solid var(--line);padding:0 6px}
#tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font:600 18px/1.1 var(--font-disp);color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px}
#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#body{flex:1 1 0;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 22px;-webkit-overflow-scrolling:touch}
.view[hidden]{display:none}
h2{font:700 30px/1.05 var(--font-disp);margin:2px 0 4px}
h3{font:600 19px/1.2 var(--font-body);margin:16px 0 4px}
p{margin:0 0 8px}
.muted{color:var(--ink2)}
.small{font-size:15.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -14px 6px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:15px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:15px;color:var(--ink2);margin:2px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend s{width:18px;height:6px;border-radius:3px;display:inline-block}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.prow{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gc,#999);border-radius:8px;min-height:48px}
.prow b{font-weight:600;flex:1}
.prow small{color:var(--ink2);font-size:15px}
.prow:active{background:var(--chip)}
.back{border:0;background:none;color:var(--info);padding:4px 0;font-weight:600;font-size:16.5px;min-height:36px}
.gtag{display:inline-block;border-radius:999px;padding:3px 11px;font-size:15px;background:var(--chip);border-left:5px solid var(--gc,#999);margin-bottom:6px}
.facts{margin:6px 0 0;padding-left:20px}
.facts li{margin:3px 0}
.watch{margin-top:12px;padding:10px 12px;border-radius:8px;background:rgba(242,194,48,.18);border-left:5px solid var(--accent)}
.watch b{display:block;margin-bottom:2px}
.pnav{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px;font-weight:600;min-height:46px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{flex:0 0 auto;padding:7px 12px;min-height:40px;font-size:16.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

.procs{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 10px;padding:0 14px 4px;scrollbar-width:none}
.procs::-webkit-scrollbar{display:none}
.prog{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:2px 0 8px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stepno{font:600 16.5px var(--font-body);color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.chk{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--chip);font-size:16.5px}
.chk .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink2);flex:0 0 auto;display:grid;place-items:center;font-size:13px;line-height:1}
.chk.ok .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.ok .tick::after{content:"✓"}
.caution{margin-top:10px;padding:10px 13px;border-radius:8px;background:rgba(195,47,47,.12);border-left:5px solid var(--bad);font-size:16.5px}

.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.gbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gbox svg{width:100%;height:auto;max-height:170px}
.gbox .cap{font-size:15px;color:var(--ink2);margin-top:2px;text-align:center}
.temps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.temps div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
.temps b{display:block;font:600 22px/1.1 var(--font-disp);font-variant-numeric:tabular-nums}
.temps span{font-size:14px;color:var(--ink2)}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ctl label,.ctl>span{font-weight:500;flex:1}
.ctl .seg{background:var(--chip);border-color:var(--line);backdrop-filter:none}
.ctl .seg button{color:var(--ink);min-height:38px;padding:6px 12px}
.ctl .seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.ctl input[type=range]{flex:0 0 150px;accent-color:#c99a00;height:32px}
.ctl output{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.alist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.alist li{padding:8px 11px;border-radius:7px;font-size:16.5px;border-left:5px solid var(--warn);background:rgba(240,180,69,.16)}
.alist li.bad{border-left-color:var(--bad);background:rgba(195,47,47,.14)}
.alist li.none{border-left-color:var(--ok);background:rgba(23,128,79,.12)}
.foul{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;font-size:15.5px;margin:4px 0}
.foul i{display:block;height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.foul i b{display:block;height:100%;background:var(--warn);width:0}
.foul output{text-align:right;font-variant-numeric:tabular-nums}

.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);min-height:48px}
.opt.right{border-color:var(--ok);background:rgba(23,128,79,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(195,47,47,.13)}
.opt:disabled{cursor:default}
.score{font:700 54px/1 var(--font-disp);margin:6px 0}

@media (min-width:900px) and (min-aspect-ratio:1/1){
  #app{flex-direction:row}
  #panel{width:440px;height:100%!important;border-radius:0;order:2;box-shadow:-6px 0 24px rgba(0,0,0,.22)}
  #grab{display:none}
  #tabs{padding-top:8px}
  #alarmBanner{bottom:16px}
  #toast{bottom:64px}
}
@media (max-width:420px){.brand strong{font-size:21px}.seg button{padding:6px 8px;font-size:13.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="gl" aria-label="Interactive 3D model of a marine exhaust-gas turbocharger. Drag to rotate, pinch or scroll to zoom, tap a part to learn about it." tabindex="0"></canvas>
    <div id="pins"></div>
    <header id="top">
      <div class="brand"><strong>Turbocharger trainer</strong><span>Exhaust-gas turbocharger</span></div>
      <div class="seg" id="viewseg" role="group" aria-label="View style">
        <button data-view="cut" aria-pressed="true">Cutaway</button>
        <button data-view="xray" aria-pressed="false">X-ray</button>
        <button data-view="ext" aria-pressed="false">Outside</button>
      </div>
    </header>
    <div id="readout" aria-live="off">
      <div class="pill" id="pp"><i>Speed</i><b id="r-n">0.0</b><u>krpm</u></div>
      <div class="pill" id="pb"><i>Boost</i><b id="r-b">0.0</b><u>bar</u></div>
      <div class="pill" id="pt"><i>Gas in</i><b id="r-t">30</b><u>°C</u></div>
      <div id="state"></div>
    </div>
    <div id="cams" role="group" aria-label="Camera">
      <button data-cam="front">Front</button>
      <button data-cam="left">Air</button>
      <button data-cam="right">Gas</button>
      <button data-cam="back">Back</button>
      <button data-cam="top">Top</button>
      <button id="namesBtn" aria-pressed="false">Names</button>
    </div>
    <button id="alarmBanner" hidden></button>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <section id="panel" aria-label="Learning panel">
    <div id="grab" role="button" aria-label="Resize panel" tabindex="0"><i></i></div>
    <nav id="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="parts" aria-selected="true">Parts</button>
      <button role="tab" data-tab="steps" aria-selected="false">Procedures</button>
      <button role="tab" data-tab="run" aria-selected="false">Simulator</button>
      <button role="tab" data-tab="quiz" aria-selected="false">Quiz</button>
    </nav>
    <div id="body">
      <section class="view" id="v-parts" role="tabpanel"></section>
      <section class="view" id="v-steps" role="tabpanel" hidden></section>
      <section class="view" id="v-run" role="tabpanel" hidden></section>
      <section class="view" id="v-quiz" role="tabpanel" hidden></section>
    </div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=(s,e)=>(e||document).querySelector(s);
const $$=(s,e)=>Array.from((e||document).querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/*SIM-START*/
const SIM=(function(){
  const NMAX=13000;
  const C={NMAX:NMAX,OVS_W:1.05,OVS_B:1.10,EGT_W:520,EGT_B:560,LUBE_W:1.4,LUBE_B:0.8,TB_W:110,TB_B:130,TB_SEIZE:150,TAIR_W:50,DPF_W:30,DPF_B:45};
  const cl=(v,a,b)=>v<a?a:v>b?b:v;
  function surgeFlow(PR,fc,ff){return (0.14+0.12*(PR-1))*(1+0.55*fc+0.12*ff);}
  function runN(L){return 0.18+0.82*Math.pow(Math.max(L,0.05),0.75);}
  function create(){
    return {speed:3,t:0,engineOn:false,loadSet:0.5,load:0,limiter:true,accrue:false,
      N:0,flow:0.02,PR:1,Tin:30,Tout:30,Tc2:30,Tair:32,Tb:35,lubeP:0,
      ft:0,fc:0,fa:0,ff:0,wash:null,seized:false,lubeFail:false,
      surging:false,surgeAcc:0,surgeMargin:99,surgeCount:0,ovs:false,dpF:0,dpC:0,events:[]};
  }
  function ev(s,msg,sev){s.events.push({msg:msg,sev:sev||'info'});if(s.events.length>30)s.events.shift();}
  function sub(s,dt){
    s.t+=dt;
    const lt=s.engineOn?cl(s.loadSet,0.05,1.1):0;
    const rate=s.engineOn?(s.limiter?0.04:0.6):0.8;
    s.load+=cl(lt-s.load,-rate*dt,rate*dt);
    if(s.accrue&&s.engineOn){
      const k=dt*(0.3+s.load);
      s.ft=cl(s.ft+0.0010*k,0,1);s.fc=cl(s.fc+0.0005*k,0,1);s.ff=cl(s.ff+0.0003*k,0,1);s.fa=cl(s.fa+0.0004*k,0,1);
    }
    if(s.wash){
      const w=s.wash;w.t+=dt;const k=dt/w.dur;
      if(!s.engineOn){s.wash=null;ev(s,'Wash stopped: engine is not running','warn');}
      else{
        if(w.type==='turbine'){s.ft=Math.max(0,s.ft-0.55*k*((s.load>=0.4&&s.load<=0.8)?1:0.2));}
        else{s.fc=Math.max(0,s.fc-0.55*k*(s.load>=0.6?1:0.2));}
        if(w.t>=w.dur){ev(s,(w.type==='turbine'?'Turbine':'Compressor')+' wash complete','ok');s.wash=null;}
      }
    }
    const eng=s.engineOn&&!s.seized;
    let Nt=eng?NMAX*runN(s.load):0;
    Nt*=(1-0.12*s.ft-0.06*s.fc-0.03*s.ff-0.04*s.fa);
    if(s.seized)Nt=0;
    const tau=s.seized?1.5:(s.engineOn?6:16);
    s.N+=(Nt-s.N)*(1-Math.exp(-dt/tau));
    if(s.N<5&&Nt===0)s.N=0;
    const nr=s.N/NMAX;
    let ftgt=s.engineOn?0.15+0.85*s.load:0.02;
    ftgt*=(1-0.10*s.fa-0.10*s.ff-0.06*s.ft);
    if(s.seized&&s.engineOn)ftgt*=0.35;
    s.flow+=(ftgt-s.flow)*(1-Math.exp(-dt/0.8));
    let PR=1+2.85*nr*nr*(1-0.18*s.fc)*(1-0.03*s.ff);
    if(s.seized&&s.engineOn)PR=1+0.06+0.04*s.load;
    const fs=surgeFlow(PR,s.fc,s.ff);
    s.surgeMargin=(s.flow/Math.max(fs,0.05)-1)*100;
    if(s.engineOn&&nr>0.2&&!s.seized){
      if(!s.surging&&s.surgeMargin<0){s.surging=true;s.surgeCount++;ev(s,'COMPRESSOR SURGE: flow too low for the pressure','bad');}
      else if(s.surging&&s.surgeMargin>8){s.surging=false;ev(s,'Surge cleared','ok');}
    }else if(s.surging){s.surging=false;}
    if(s.surging){
      PR*=1+0.07*Math.sin(s.t*13)+0.03*Math.sin(s.t*29);
      s.surgeAcc+=dt;
      if(s.surgeAcc>40){s.surgeAcc=0;s.fc=Math.max(s.fc,0.55);ev(s,'Repeated surge has damaged the compressor: efficiency lost','bad');}
    }else s.surgeAcc=Math.max(0,s.surgeAcc-dt*0.2);
    s.PR=Math.max(1,PR);
    // lube oil and bearings
    const lpT=s.lubeFail?0.15:(s.engineOn?2.1:(s.N>400?0.5:0));
    s.lubeP+=(lpT-s.lubeP)*(1-Math.exp(-dt/1.2));
    let tbT=35+10*(s.engineOn?1:0)+30*nr*nr+(s.surging?8:0);
    if(s.lubeP<1.0&&s.N>800)tbT+=(1-s.lubeP)*(260*nr);
    s.Tb+=(tbT-s.Tb)*(1-Math.exp(-dt/6));
    if(s.Tb>=C.TB_SEIZE&&!s.seized){s.seized=true;ev(s,'BEARING SEIZURE: rotor locked','bad');}
    // temperatures
    let tin=28,tout=28;
    if(s.engineOn){
      tin=230+260*s.load+100*s.ft+60*s.fa+40*s.ff+(s.seized?150:0)+(s.surging?15:0);
      tout=tin-((70+110*nr*nr)*(1-0.5*s.ft));
      if(s.seized)tout=tin-15;
    }
    s.Tin+=(tin-s.Tin)*(1-Math.exp(-dt/10));
    s.Tout+=(tout-s.Tout)*(1-Math.exp(-dt/10));
    const eta=0.80-0.15*s.fc;
    const tc2=303*(1+(Math.pow(s.PR,0.2857)-1)/eta)-273;
    s.Tc2+=(tc2-s.Tc2)*(1-Math.exp(-dt/5));
    const tair=(s.engineOn?36+22*s.fa+8*s.load:32);
    s.Tair+=(tair-s.Tair)*(1-Math.exp(-dt/12));
    s.dpF=(8+80*s.ff)*(0.25+0.75*s.flow);
    s.dpC=(12+55*s.fa)*(0.25+0.75*s.flow);
    if(nr>=C.OVS_B&&!s.ovs){s.ovs=true;ev(s,'OVERSPEED: reduce engine load','bad');}
    else if(nr<C.OVS_W&&s.ovs)s.ovs=false;
  }
  function step(s,dtReal){
    let dt=Math.min(dtReal,0.1)*s.speed;
    while(dt>1e-6){const h=Math.min(dt,0.1);sub(s,h);dt-=h;}
  }
  function alarms(s){
    const a=[],nr=s.N/NMAX;
    if(s.seized)a.push({text:'Turbocharger seized: rotor locked',sev:'bad'});
    if(s.surging)a.push({text:'Compressor surge',sev:'bad'});
    if(nr>=C.OVS_B)a.push({text:'Rotor overspeed',sev:'bad'});
    else if(nr>=C.OVS_W)a.push({text:'High rotor speed',sev:'warn'});
    if(s.engineOn||s.N>400){
      if(s.lubeP<C.LUBE_B)a.push({text:'Lube oil pressure low-low',sev:'bad'});
      else if(s.lubeP<C.LUBE_W)a.push({text:'Lube oil pressure low',sev:'warn'});
    }
    if(s.Tb>=C.TB_B)a.push({text:'Bearing temperature very high',sev:'bad'});
    else if(s.Tb>=C.TB_W)a.push({text:'Bearing temperature high',sev:'warn'});
    if(s.Tin>=C.EGT_B)a.push({text:'Gas inlet temperature very high',sev:'bad'});
    else if(s.Tin>=C.EGT_W)a.push({text:'Gas inlet temperature high',sev:'warn'});
    if(s.Tair>=C.TAIR_W)a.push({text:'Scavenge air temperature high',sev:'warn'});
    if(s.dpF>=C.DPF_B)a.push({text:'Air filter blocked',sev:'bad'});
    else if(s.dpF>=C.DPF_W)a.push({text:'Air filter dirty',sev:'warn'});
    return a;
  }
  function status(s){
    if(s.seized)return 'SEIZED: rotor locked';
    if(!s.engineOn)return s.N>50?'Engine stopped: rotor running down':'Stopped';
    if(s.surging)return 'SURGE: compressor unstable';
    if(s.wash)return 'Water washing the '+s.wash.type;
    return 'Running at '+Math.round(s.load*100)+'% load';
  }
  const act={
    engine(s,on){
      if(on&&s.seized){ev(s,'Cannot run: turbocharger seized. Overhaul the rotor first','warn');return;}
      s.engineOn=on;
      if(on&&s.lubeFail)ev(s,'Starting with no lube oil pressure','bad');
    },
    load(s,v){s.loadSet=cl(v,0.05,1.1);},
    limiter(s,on){s.limiter=on;},
    accrue(s,on){s.accrue=on;},
    lubeFail(s,on){s.lubeFail=on;ev(s,on?'Fault set: lube oil supply failure':'Lube oil supply restored',on?'warn':'ok');},
    foul(s,k,amt){s[k]=cl(s[k]+amt,0,1);},
    wash(s,type){
      if(!s.engineOn){ev(s,'Water wash needs the engine running','warn');return;}
      if(s.wash){ev(s,'A wash is already in progress','warn');return;}
      if(type==='turbine'&&(s.load<0.4||s.load>0.8))ev(s,'Turbine wash works best at about 40 to 80% load','warn');
      if(type==='compressor'&&s.load<0.6)ev(s,'Compressor wash works best at 60% load or more','warn');
      s.wash={type:type,t:0,dur:14};ev(s,'Washing the '+type+'...','info');
    },
    cleanCooler(s){s.fa=0;ev(s,'Air cooler cleaned','ok');},
    changeFilter(s){s.ff=0;ev(s,'Air filter element renewed','ok');},
    overhaul(s){
      if(s.engineOn||s.N>50){ev(s,'Stop the engine and let the rotor stop first','warn');return;}
      s.seized=false;s.ft=0;s.fc=0;s.surgeAcc=0;s.lubeFail=false;s.Tb=35;ev(s,'Rotor overhauled and cleaned','ok');
    }
  };
  function preset(s,name){
    const sp=s.speed;Object.assign(s,create(),{speed:sp});
    if(name==='cold')return;
    const L=name==='full'?1.0:0.75;
    s.engineOn=true;s.loadSet=L;s.load=L;s.N=NMAX*runN(L);s.lubeP=2.1;s.flow=0.15+0.85*L;
    s.Tin=250;s.Tout=200;s.Tb=80;s.Tair=45;s.Tc2=150;s.PR=1+2.85*Math.pow(s.N/NMAX,2);
    if(name==='degraded'){s.ft=0.45;s.fc=0.35;s.fa=0.4;s.ff=0.35;}
    for(let i=0;i<240;i++)sub(s,0.5);
    s.events.length=0;s.surgeCount=0;s.surgeAcc=0;
  }
  return {create,step,alarms,status,act,preset,surgeFlow,runN,C};
})();
/*SIM-END*/

const QUIZ=[
{q:'What drives the turbine of an exhaust-gas turbocharger?',a:['An electric motor','The energy in the engine exhaust gas','A belt from the crankshaft','Steam from the boiler'],c:1,w:'The turbocharger has no mechanical drive. Exhaust energy spins the turbine, which drives the compressor on the same shaft.'},
{q:'Why is the air cooled after the compressor?',a:['To protect the compressor','To make the air denser so more oxygen enters each cylinder','To lower the boost pressure','To dry the filter'],c:1,w:'Cooler air is denser. More air in the cylinder means more fuel can burn and the engine makes more power.'},
{q:'What does the diffuser do?',a:['Cools the air','Turns the fast air from the wheel into pressure','Filters the air','Measures speed'],c:1,w:'The vanes slow the air down. The lost speed energy becomes pressure.'},
{q:'What is compressor surge?',a:['A sudden rise in lube oil pressure','Unstable, pulsing flow when airflow is too low for the pressure','Water in the exhaust','An overspeed of the turbine'],c:1,w:'When the flow falls too far below the surge line, the air flow reverses in pulses with loud bangs and swinging boost.'},
{q:'Which of these makes surge more likely?',a:['A clean air filter','A fouled air cooler or blocked filter, or a fast drop in load','Lower sea water temperature','A new nozzle ring'],c:1,w:'Anything that cuts airflow, or a fast load drop while the rotor is still fast, moves the working point toward the surge line.'},
{q:'High gas inlet temperature at the same engine load most likely means…',a:['The turbine is fouled or combustion is poor','The air filter is too clean','The lube oil is too cold','Boost is too high'],c:0,w:'A dirty turbine raises back pressure and exhaust temperature. The same happens with a dirty air path.'},
{q:'What must be running before and while the rotor turns?',a:['The wash water','The lube oil supply','The charge air cooler water only','The sealing air only'],c:1,w:'The bearings run on an oil film. Without it they overheat in seconds.'},
{q:'The lube oil supply fails with the engine at load. What first?',a:['Wait and watch','Reduce load at once and stop the engine if pressure does not return','Raise the load to cool the bearings','Start the wash'],c:1,w:'Less speed means less bearing heat. A seized rotor can cost the turbocharger.'},
{q:'At what load is a turbine water wash normally done?',a:['Full load','Reduced load, around 40 to 80%','Engine stopped','Overload'],c:1,w:'At reduced load the gas is hot enough to evaporate the water but not so hot as to cause thermal shock.'},
{q:'Why is the compressor wash done at high load?',a:['To save water','The high rotor speed helps the droplets clean the blades','The air is cooler','The engine is quieter'],c:1,w:'Speed helps the water droplets clean the blades and carry deposits away.'},
{q:'What does the labyrinth seal sealing air do?',a:['Cools the shaft','Keeps oil in and hot gas out of the bearing housing','Drives the rotor','Cleans the blades'],c:1,w:'Clean air flows toward the bearing housing through the seal so gas and oil cannot escape.'},
{q:'The gas inlet casing sits on sliding supports because…',a:['It is heavy','It needs to expand with heat without loading the pipes or bearings','It is easier to remove','It prevents oil leaks'],c:1,w:'Hot casings grow by several millimetres. Sliding or flexible supports let them move.'},

{q:'Why must the lube oil keep flowing during rotor run-down?',a:['To cool the compressor','The rotor is still turning and hot','To clean the filter','To keep the pressure alarm quiet'],c:1,w:'The rotor can spin for minutes after the engine stops. It needs oil until it has stopped.'}
];

const view3d=(function(){
  const stub={ok:false,focus(){},setView(){},cam(){},pins(){},names(){},tick(){},onPick:null,onView:null};
  let renderer;
  try{
    renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true,alpha:true,powerPreference:'high-performance'});
  }catch(e){
    $('#stage').insertAdjacentHTML('beforeend','<p class="nogl">This device could not start 3D graphics. The parts guide, procedures, simulator and quiz still work.</p>');
    return stub;
  }
  try{
  const T=THREE,stage=$('#stage'),canvas=$('#gl');
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setClearColor(0x000000,0);
  renderer.localClippingEnabled=true;
  const scene=new T.Scene();
  const camera=new T.PerspectiveCamera(38,1,0.1,160);
  const root=new T.Group();scene.add(root);
  const V=(x,y,z)=>new T.Vector3(x,y,z);
  const UP=V(0,1,0);
  const Y0=2.0;
  const PG={},CLIP=[],A={rotGroups:[],ang:0,plamps:[],ff:0,lcdT:0,shake:0};

  scene.add(new T.HemisphereLight(0xe6f0f7,0x3a5666,1.0));
  scene.add(new T.AmbientLight(0xffffff,0.4));
  const key=new T.DirectionalLight(0xffffff,1.0);key.position.set(6,10,8);scene.add(key);
  const fill=new T.DirectionalLight(0xbcd6ea,0.6);fill.position.set(-7,4,-3);scene.add(fill);
  const rim=new T.DirectionalLight(0xffe2b8,0.35);rim.position.set(0,5,-9);scene.add(rim);

  function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.anisotropy=4;return t;}
  const dotTex=canvasTex(64,64,(x,w,h)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.45,'rgba(255,255,255,0.7)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h);});
  const floorTex=canvasTex(1024,1024,(x,w,h)=>{
    const g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    g.addColorStop(0,'rgba(60,112,152,0.55)');g.addColorStop(0.7,'rgba(30,72,102,0.3)');g.addColorStop(1,'rgba(20,50,75,0)');
    x.fillStyle=g;x.fillRect(0,0,w,h);x.lineWidth=2;
    for(let i=0;i<=44;i++){const p=i*w/44;x.strokeStyle=(i%4===0)?'rgba(190,225,245,0.34)':'rgba(190,225,245,0.13)';x.beginPath();x.moveTo(p,0);x.lineTo(p,h);x.stroke();x.beginPath();x.moveTo(0,p);x.lineTo(w,p);x.stroke();}
    x.globalCompositeOperation='destination-in';
    const m=x.createRadialGradient(w/2,h/2,w*0.1,w/2,h/2,w/2);m.addColorStop(0,'rgba(0,0,0,1)');m.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=m;x.fillRect(0,0,w,h);
  });
  const floor=new T.Mesh(new T.CircleGeometry(12,64),new T.MeshBasicMaterial({map:floorTex,transparent:true,depthWrite:false}));
  floor.rotation.x=-Math.PI/2;floor.position.y=0.001;scene.add(floor);

  /* ---- helpers ---- */
  function M(c,o){o=o||{};
    const m=new T.MeshStandardMaterial({color:c,roughness:o.r!=null?o.r:0.5,metalness:o.m!=null?o.m:0.3,side:o.d?T.DoubleSide:T.FrontSide,transparent:!!o.t,opacity:o.o!=null?o.o:1});
    if(o.e!=null){m.emissive=new T.Color(o.e);m.emissiveIntensity=o.ei!=null?o.ei:1;}
    if(o.t)m.depthWrite=false;
    if(o.clip)CLIP.push(m);
    return m;}
  function G(id){const g=new T.Group();g.userData.part=id;PG[id]=g;root.add(g);return g;}
  function ax(g){const a=new T.Group();a.position.y=Y0;g.add(a);return a;}
  function add(g,geo,mat,x,y,z){const m=new T.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);g.add(m);return m;}
  const cyl=(a,b,h,s,open)=>new T.CylinderGeometry(a,b,h,s||24,1,!!open);
  const box=(w,h,d)=>new T.BoxGeometry(w,h,d);
  const sph=(r,s)=>new T.SphereGeometry(r,s||16,Math.max(8,Math.floor((s||16)/2)));
  function cylX(g,r,len,mat,x,y,z){const m=add(g,cyl(r,r,len,24),mat,x,y,z);m.rotation.z=Math.PI/2;return m;}
  function seg(g,a,b,r,mat){const d=b.clone().sub(a),len=d.length();if(len<1e-4)return;const m=new T.Mesh(cyl(r,r,len,14),mat);m.position.copy(a).add(b).multiplyScalar(0.5);m.quaternion.setFromUnitVectors(UP,d.normalize());g.add(m);}
  function pipe(g,pts,r,col,o){const mat=M(col,Object.assign({m:0.3,r:0.45},o||{}));for(let i=0;i<pts.length-1;i++)seg(g,pts[i],pts[i+1],r,mat);for(let i=1;i<pts.length-1;i++)add(g,sph(r*1.02,12),mat,pts[i].x,pts[i].y,pts[i].z);return mat;}
  function latheX(pts,seg){const g=new T.LatheGeometry(pts.map(p=>new T.Vector2(p[0],p[1])),seg||48);g.rotateZ(-Math.PI/2);return g;}
  function shellX(outer,inner,seg){const pts=outer.concat(inner.slice().reverse());pts.push(outer[0]);return latheX(pts,seg);}
  function ringX(g,r0,r1,x0,x1,mat,seg){return add(g,latheX([[r0,x0],[r1,x0],[r1,x1],[r0,x1],[r0,x0]],seg||40),mat);}
  function ribbon(fn,nt,nu){
    const pos=[],idx=[];
    for(let i=0;i<=nt;i++)for(let j=0;j<=nu;j++){const p=fn(i/nt,j/nu);pos.push(p[0],p[1],p[2]);}
    for(let i=0;i<nt;i++)for(let j=0;j<nu;j++){const a=i*(nu+1)+j,b=a+1,c=a+nu+1,d=c+1;idx.push(a,b,c,b,d,c);}
    const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;
  }
  const _m=new T.Matrix4(),_a=new T.Matrix4(),_b=new T.Matrix4();
  function inst(geo,mat,n,x,rm,beta,gamma){
    const im=new T.InstancedMesh(geo,mat,n);
    for(let i=0;i<n;i++){
      _m.makeRotationX(i/n*Math.PI*2);_a.makeTranslation(x,rm,0);_m.multiply(_a);
      if(beta){_b.makeRotationY(beta);_m.multiply(_b);}
      if(gamma){_b.makeRotationX(gamma);_m.multiply(_b);}
      im.setMatrixAt(i,_m);
    }
    im.instanceMatrix.needsUpdate=true;im.frustumCulled=false;return im;
  }
  function valve(g,x,y,z,o){
    o=o||{};const s=o.s||1,vg=new T.Group();vg.position.set(x,y,z);
    const bm=()=>M(o.body||0x69757e,{m:0.35,r:0.5});
    cylX(vg,0.085*s,0.4*s,bm(),0,0,0);
    add(vg,sph(0.125*s,14),bm());
    add(vg,cyl(0.07*s,0.07*s,0.14*s,12),bm(),0,0.15*s,0);
    [-1,1].forEach(k=>cylX(vg,0.13*s,0.035*s,bm(),k*0.2*s,0,0));
    const stem=new T.Group();stem.position.y=0.2*s;vg.add(stem);
    const wm=M(o.col||0xc0392b,{m:0.1,r:0.55});
    add(stem,cyl(0.014*s,0.014*s,0.3*s,8),M(0xc4ccd2,{m:0.6,r:0.3}),0,0.14*s,0);
    const w=add(stem,new T.TorusGeometry(0.12*s,0.016*s,8,20),wm,0,0.3*s,0);w.rotation.x=Math.PI/2;
    if(o.along==='z')vg.rotation.y=Math.PI/2;
    g.add(vg);return vg;
  }
  const part=(id,fn)=>{fn(G(id));};
  const shellish=m=>{m.userData.shellish=true;return m;};
  const dyn=m=>{m.userData.dyn=true;return m;};

  /* ---- pipe routes ---- */
  const PIPES={
    airOut:[V(-1.83,3.6,0),V(-1.83,4.4,0),V(-1.83,4.4,-3.0),V(-1.83,2.95,-3.0)],
    scavOut:[V(-0.4,2.1,-3.0),V(0.5,2.1,-3.0),V(0.5,1.2,-3.0)],
    gasIn:[V(1.4,2.4,-3.0),V(1.4,4.1,-3.0),V(1.4,4.1,0),V(1.4,3.2,0)],
    gasOut:[V(3.95,Y0,0),V(4.6,Y0,0),V(4.6,5.7,0)],
    oilIn:[V(0.9,0.8,-3.3),V(0.9,0.8,-1.2),V(-0.3,0.8,-1.2),V(-0.3,3.2,-1.2),V(-0.3,3.2,0),V(-0.3,2.55,0)],
    oilOut:[V(-0.3,1.45,0),V(-0.3,0.35,0),V(-0.3,0.35,-1.5),V(0.9,0.35,-1.5),V(0.9,0.35,-3.3)],
    washC:[V(0.2,0.95,1.4),V(0.2,3.7,1.4),V(-3.0,3.7,1.4),V(-3.0,3.7,0),V(-3.0,2.8,0)],
    washT:[V(0.2,3.7,1.4),V(0.85,3.7,1.4),V(0.85,3.7,0),V(0.85,3.3,0)]
  };
  const CL={sil:0x2e6f93,cmp:0x8fb3c9,hous:0x4b7391,lag:0xc4ced4,cast:0x6a7780,steel:0x59666f,alu:0xcdd6dc,oil:0xc8892b,blue:0x3a9bdc};

  /* ---- compressor wheel geometry ---- */
  const SC=1.15,XC=-1.9;
  const sS=t=>1-(1-t)*(1-t);
  const hubR=t=>0.16+0.62*Math.pow(t,1.7),hubX=t=>-0.5+0.62*sS(t);
  const shrR=t=>0.5+0.28*Math.pow(t,1.2),shrX=t=>-0.5+0.62*sS(t)-0.12*t*t;
  const bth=t=>-1.0*Math.pow(t,1.4);
  function cBlade(t0){
    return ribbon((t,u)=>{
      const tt=t0+(1-t0)*t,hx=hubX(tt),hr=hubR(tt),sx=shrX(tt),sr=shrR(tt);
      const x=hx+(sx-hx)*u,r=hr+(sr-hr)*u,a=bth(tt);
      return [x,r*Math.cos(a),r*Math.sin(a)];
    },26,5);
  }

  /* ---- AIR FILTER ---- */
  part('air_filter',g=>{
    const a=ax(g);
    add(a,shellX([[0.98,-5.1],[0.98,-3.95]],[[0.9,-5.1],[0.9,-3.95]]),M(CL.sil,{d:1,clip:1,m:0.3}));
    ringX(a,0.3,0.98,-5.16,-5.08,M(0x24566f,{d:1,clip:1}));
    ringX(a,0.25,0.98,-4.02,-3.94,M(0x24566f,{d:1,clip:1}));
    const pl=inst(box(0.85,0.34,0.02),M(0xe9e4d2,{r:0.9,m:0,d:1,clip:1}),46,-4.52,0.62);a.add(pl);

    for(let i=0;i<4;i++)ringX(a,0.28,0.9,-4.2-i*0.0+0,-4.17,M(0x2a3b46,{d:1,clip:1}));
    const mg=new T.Group();mg.position.set(-4.5,0.98,0);a.add(mg);
    add(mg,cyl(0.14,0.14,0.08,22),M(0x2a343b),0,0.04,0).rotation.x=Math.PI/2;
    add(mg,new T.CircleGeometry(0.12,24),M(0xf6f7f4,{d:1}),0,0.04,0.05).rotation.y=0;
  });
  /* ---- COMPRESSOR INLET ---- */
  part('comp_inlet',g=>{
    const a=ax(g);
    const out=[[0.98,-3.95],[0.9,-3.4],[0.78,-2.95],[0.7,-2.5]],inn=out.map(p=>[p[0]-0.07,p[1]]);
    add(a,shellX(out,inn),M(CL.cmp,{d:1,clip:1,m:0.35}));
    const shr=[];for(let i=0;i<=16;i++){const t=i/16;shr.push([SC*shrR(t)+0.03,XC+SC*shrX(t)-0.03]);}
    shr.push([1.32,XC+SC*shrX(1)-0.03]);
    const shr2=shr.map(p=>[p[0]+0.07,p[1]-0.07]);
    add(a,shellX(shr2,shr),M(CL.cmp,{d:1,clip:1,m:0.35}));
    [-3.9,-2.55].forEach(x=>ringX(a,0.62,x<-3?1.05:0.82,x,x+0.1,M(0x54707f,{d:1,clip:1})));
    add(g,cyl(0.05,0.05,0.18,10),M(CL.steel),-3.0,Y0+0.8,0);
  });
  /* ---- COMPRESSOR WHEEL ---- */
  part('comp_wheel',g=>{
    const a=ax(g);A.rotGroups.push(a);
    const wg=new T.Group();wg.position.x=XC;wg.scale.set(SC,SC,SC);a.add(wg);
    const hp=[[0,-0.62],[0.09,-0.58],[0.16,-0.5]];

  flow(cat(PIPES.airOut.slice(),[V(-1.83,2.3,-3.0),V(-0.4,2.1,-3.0)]),0xd7ecff,18,2.4,(s,tm)=>af(s)*surgeDir(s,tm));

  flow(cat([V(3.4,2.4,-3.0)],PIPES.gasIn.slice()),0xff9a40,22,2.4,s=>(s.engineOn&&!s.seized)?clamp(0.3+s.load,0,1.3):(s.engineOn?0.3:0));
  flow([V(1.4,3.2,0),V(1.5,2.82,0),V(2.1,2.8,0),V(2.4,2.75,0),V(2.9,2.6,0),V(3.5,2.3,0),V(3.95,2.0,0)],0xffb060,12,2.2,s=>(s.engineOn)?clamp(0.3+s.load,0,1.3):0,0.17);
  flow(PIPES.gasOut.slice(),0xc9c2b8,14,2.4,s=>(s.engineOn)?clamp(0.3+s.load,0,1.3):0);
  flow(PIPES.oilIn.slice(),0xffcf70,14,1.6,s=>s.lubeP>0.3?clamp(s.lubeP/2,0.3,1.2):0,0.16);
  flow(PIPES.oilOut.slice(),0xffcf70,12,1.4,s=>s.lubeP>0.3?clamp(s.lubeP/2,0.3,1.2):0,0.16);
  flow(PIPES.washC.slice(),0x6fd0ff,10,1.8,s=>(s.wash&&s.wash.type==='compressor')?1:0);
  flow(PIPES.washT.slice(),0x6fd0ff,8,1.8,s=>(s.wash&&s.wash.type==='turbine')?1:0);
  function updateFlows(s,dt,tm){
    FL.forEach(f=>{
      const a=f.act(s,tm);f.sys.p.visible=a!==0;if(!a)return;
      f.ph=((f.ph+dt*f.sp*a/Math.max(f.total,0.5))%1+1)%1;

        const u=((i/f.sys.n+f.ph)%1)*f.total;let j=1;while(j<f.L.length-1&&u>f.L[j])j++;
        const t=(u-f.L[j-1])/Math.max(1e-6,f.L[j]-f.L[j-1]),a0=f.pts[j-1],b0=f.pts[j];
        f.sys.pos[i*3]=a0.x+(b0.x-a0.x)*t;f.sys.pos[i*3+1]=a0.y+(b0.y-a0.y)*t;f.sys.pos[i*3+2]=a0.z+(b0.z-a0.z)*t;
      }
      f.sys.geo.attributes.position.needsUpdate=true;
    });
  }

  /* ---- finalise meshes ---- */
  const ALLM=[],PICK=[],CLIPSET=new Set(CLIP);
  function partOf(o){while(o){if(o.isGroup&&o.userData&&o.userData.part)return o.userData.part;o=o.parent;}return null;}
  root.traverse(o=>{
    if(!o.isMesh)return;const id=partOf(o);if(!id)return;
    const mat=o.material;o.userData.part=id;
    o.userData.clipped=CLIPSET.has(mat);
    o.userData.base={opacity:mat.opacity,transparent:mat.transparent,depthWrite:mat.depthWrite,emissive:mat.emissive?mat.emissive.clone():null,ei:mat.emissiveIntensity};
    ALLM.push(o);PICK.push(o);
  });

  /* ---- view modes ---- */
  const planes=[new T.Plane(V(0,0,-1),0)];
  let viewMode='cut',focusId=null,FOCUSM=[];
  const ACC=new T.Color(0xf2c230);
  function refreshMaterials(){
    const xr=viewMode==='xray';
    for(const m of ALLM){
      const b=m.userData.base,mat=m.material;let op=b.opacity,tr=b.transparent,dw=b.depthWrite;
      if(xr&&(m.userData.clipped||m.userData.shellish)){op=Math.min(op,0.16);tr=true;dw=false;}
      if(focusId&&m.userData.part!==focusId){op*=0.18;tr=true;dw=false;}
      if(mat.opacity!==op||mat.transparent!==tr){mat.opacity=op;mat.transparent=tr;mat.depthWrite=dw;mat.needsUpdate=true;}
    }
  }
  function rebuildFocus(){
    FOCUSM.forEach(m=>{const b=m.userData.base;m.material.emissive.copy(b.emissive);m.material.emissiveIntensity=b.ei;});
    FOCUSM=focusId?ALLM.filter(m=>m.userData.part===focusId&&m.userData.base.emissive&&!m.userData.dyn):[];
  }
  function setView(mode){
    viewMode=mode;const on=mode==='cut';
    CLIP.forEach(m=>{m.clippingPlanes=on?planes:null;m.needsUpdate=true;});
    refreshMaterials();
  }

  /* ---- camera ---- */
  const CT=[0.0,2.4,-1.4];
  const cam={tx:CT[0],ty:CT[1],tz:CT[2],r:20,az:28*Math.PI/180,el:16*Math.PI/180},goal=Object.assign({},cam);
  let W=2,H=2,sway=true;const swayBase=cam.az;
  function homeR(){const t=Math.tan(camera.fov*Math.PI/360),asp=W/H;return clamp(Math.max(4.6/t,5.7/(t*asp)),12,42);}
  function fly(t,r,azDeg,elDeg){
    goal.tx=t[0];goal.ty=t[1];goal.tz=t[2];goal.r=clamp(r,3,44);
    let d=azDeg*Math.PI/180-cam.az;d=Math.atan2(Math.sin(d),Math.cos(d));goal.az=cam.az+d;goal.el=clamp(elDeg*Math.PI/180,-0.05,1.45);
  }
  function camPreset(name){
    sway=false;
    const m={front:[0,12],right:[90,12],left:[-90,12],back:[180,12],top:[0,80],home:[28,16]}[name]||[28,16];
    fly(CT,homeR(),m[0],m[1]);
  }
  function focus(id){
    focusId=id||null;sway=false;
    if(id){
      const p=PBY[id];
      if(p.internal&&viewMode==='ext'){setView('cut');if(api.onView)api.onView('cut');}
      const k=Math.max(1,0.9/(W/H));
      fly(p.cam.t,p.cam.r*k,p.cam.az,p.cam.el);
    }
    refreshMaterials();rebuildFocus();
  }
  function updateCamera(dt){
    const k=reduce?1:1-Math.exp(-dt*7);
    cam.tx+=(goal.tx-cam.tx)*k;cam.ty+=(goal.ty-cam.ty)*k;cam.tz+=(goal.tz-cam.tz)*k;cam.r+=(goal.r-cam.r)*k;cam.el+=(goal.el-cam.el)*k;cam.az+=(goal.az-cam.az)*k;
    const ce=Math.cos(cam.el);
    camera.position.set(cam.tx+cam.r*Math.sin(cam.az)*ce,cam.ty+cam.r*Math.sin(cam.el),cam.tz+cam.r*Math.cos(cam.az)*ce);
    camera.lookAt(cam.tx,cam.ty,cam.tz);camera.updateMatrixWorld();
  }
  const _r=new T.Vector3(),_u=new T.Vector3(),_z=new T.Vector3();
  function pan(dx,dy){
    camera.matrixWorld.extractBasis(_r,_u,_z);const s=cam.r*0.0017;
    goal.tx=clamp(goal.tx+(-_r.x*dx+_u.x*dy)*s,-8,8);goal.ty=clamp(goal.ty+(-_r.y*dx+_u.y*dy)*s,0,8);goal.tz=clamp(goal.tz+(-_r.z*dx+_u.z*dy)*s,-8,5);
  }
  const ptrs=new Map();let down=null,pinchD=0,pinchMid=null;
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('pointerdown',e=>{
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1)down={x:e.clientX,y:e.clientY,t:performance.now(),m:0};
    else{down=null;const v=Array.from(ptrs.values());pinchD=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);pinchMid={x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2};}
    sway=false;
  });
  canvas.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);if(!p)return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size===1){
      if(down)down.m+=Math.abs(dx)+Math.abs(dy);
      if((e.buttons&2)||e.shiftKey)pan(dx,dy);
      else{goal.az-=dx*0.0065;goal.el=clamp(goal.el+dy*0.0055,-0.05,1.45);}
    }else if(ptrs.size===2){
      const v=Array.from(ptrs.values()),d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),mid={x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2};
      if(pinchD>0&&d>0)goal.r=clamp(goal.r*pinchD/d,3,44);
      if(pinchMid)pan(mid.x-pinchMid.x,mid.y-pinchMid.y);

    }
  });
  const ray=new T.Raycaster(),ndc=new T.Vector2();
  function pick(cx,cy){
    const rc=canvas.getBoundingClientRect();

    const hits=ray.intersectObjects(PICK,false);
    for(const h of hits){
      const o=h.object;if(!o.visible)continue;
      if(viewMode==='cut'&&o.userData.clipped&&h.point.z>0.001)continue;

  }
  function endPtr(e){

    if(was&&e.type==='pointerup'&&was.m<8&&performance.now()-was.t<600){const id=pick(e.clientX,e.clientY);if(id&&api.onPick)api.onPick(id);}

  }
  canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
  canvas.addEventListener('wheel',e=>{e.preventDefault();sway=false;goal.r=clamp(goal.r*Math.exp(e.deltaY*0.0012),3,44);},{passive:false});
  canvas.addEventListener('keydown',e=>{

    else if(k==='ArrowUp')goal.el=clamp(goal.el+0.08,-0.05,1.45);else if(k==='ArrowDown')goal.el=clamp(goal.el-0.08,-0.05,1.45);
    else if(k==='+'||k==='=')goal.r=clamp(goal.r*0.9,3,44);else if(k==='-')goal.r=clamp(goal.r*1.1,3,44);else return;
    e.preventDefault();
  });

  /* ---- pins ---- */
  const pinsEl=$('#pins'),pinEls={};let pinMode='all',pinId=null;
  PARTS.forEach(p=>{
    const b=document.createElement('button');b.type='button';b.className='pin';b.style.setProperty('--pc',GROUPS[p.g].c);b.setAttribute('aria-label',p.n);
    b.innerHTML='<span class="dot"></span><span class="lab"></span>';b.lastChild.textContent=p.n;
    b.addEventListener('click',e=>{e.stopPropagation();if(api.onPick)api.onPick(p.id);});

  const _v=new T.Vector3();

      const el=pinEls[p.id];

      _v.set(p.pin[0],p.pin[1],p.pin[2]).project(camera);

      el.classList.toggle('on',p.id===focusId||(pinMode==='one'&&p.id===pinId));
    });
  }

  /* ---- apply simulation state ---- */
  function applySim(s,dt,tm){
    const nr=s.N/SIM.C.NMAX;
    A.ang+=dt*nr*30;

  function resize(){

    names(on){document.body.classList.toggle('names',!!on);},
    pins(mode,id){pinMode=mode;pinId=id||null;pinsEl.classList.toggle('hide',mode==='none');},
    tick(dt,tm){

  }catch(err){

/* ---------------- UI ---------------- */
const UI={tab:'parts',filter:'all',sel:null,proc:'start',step:0,quiz:null};
const appEl=$('#app'),panel=$('#panel');
const toastEl=$('#toast');let toastT=0;
function toast(msg,sev){toastEl.textContent=msg;toastEl.className='show '+(sev||'info');clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.className='';},3600);}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};

const mqDesk=window.matchMedia('(min-width:900px) and (min-aspect-ratio:1/1)');
let stops=[84,300,500];
function calcStops(){const H=appEl.clientHeight||700;stops=[84,Math.round(H*0.48),Math.round(H*0.84)];}
function sheetH(){return panel.getBoundingClientRect().height;}
function setSheet(h,anim){
  if(mqDesk.matches){panel.style.height='';return;}
  calcStops();h=clamp(h,stops[0],stops[2]);
  panel.classList.toggle('snap',!!anim);panel.style.height=h+'px';
}
function expandIfCollapsed(){if(!mqDesk.matches&&sheetH()<150)setSheet(stops[1],true);}
const grab=$('#grab');let drag=null;
grab.addEventListener('pointerdown',e=>{if(mqDesk.matches)return;try{grab.setPointerCapture(e.pointerId);}catch(_){}drag={y:e.clientY,h:sheetH(),m:0};panel.classList.remove('snap');});
grab.addEventListener('pointermove',e=>{if(!drag)return;const dy=drag.y-e.clientY;drag.m=Math.max(drag.m,Math.abs(dy));setSheet(drag.h+dy,false);});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;calcStops();const h=sheetH();
  if(d.m<6){setSheet(h<150?stops[1]:stops[0],true);}
  else{let best=stops[0];stops.forEach(s=>{if(Math.abs(s-h)<Math.abs(best-h))best=s;});setSheet(best,true);}
}
grab.addEventListener('pointerup',endDrag);grab.addEventListener('pointercancel',endDrag);
grab.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setSheet(sheetH()<150?stops[1]:stops[0],true);}});
window.addEventListener('resize',()=>{if(mqDesk.matches)panel.style.height='';else setSheet(sheetH(),false);});

function setTab(t){
  UI.tab=t;
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  ['parts','steps','run','quiz'].forEach(k=>{$('#v-'+k).hidden=(k!==t);});
  if(t==='parts'){renderParts();view3d.pins('all');view3d.focus(UI.sel);}
  else if(t==='steps'){renderSteps();applyStepFocus();}
  else if(t==='run'){view3d.pins('none');view3d.focus(null);view3d.cam('home');updateRun();}
  else{view3d.pins('none');view3d.focus(null);}
}
$$('#tabs button').forEach(b=>b.addEventListener('click',()=>{expandIfCollapsed();setTab(b.dataset.tab);}));

/* progress saved on this device for the menu bars */
const MT_PROG={
  id:'turbocharger',
  total:PARTS.length+QUIZ.length,
  mark(item){
    try{
      const doneAll=JSON.parse(localStorage.getItem('marineTrainers.done')||'{}')||{};
      const mine=new Set(doneAll[this.id]||[]);
      if(mine.has(item))return;
      mine.add(item);doneAll[this.id]=[...mine];
      localStorage.setItem('marineTrainers.done',JSON.stringify(doneAll));
      const prog=JSON.parse(localStorage.getItem('marineTrainers.progress')||'{}')||{};
      prog[this.id]=Math.min(100,Math.round(mine.size/this.total*100));
      localStorage.setItem('marineTrainers.progress',JSON.stringify(prog));
    }catch(e){}
  }
};
function selectPart(id){
  if(id)MT_PROG.mark('part:'+id);
  UI.sel=id;
  if(UI.tab!=='parts')setTab('parts');
  else{renderParts();view3d.focus(id);}
  const v=$('#v-parts');v.scrollTop=0;
}
function renderParts(){
  const v=$('#v-parts');
  if(UI.sel){renderDetail(v);return;}
  const chips=[['all','All']].concat(Object.keys(GROUPS).map(k=>[k,GROUPS[k].n]));
  let h='<div class="chips" role="group" aria-label="Filter parts">'+chips.map(c=>'<button class="chip" data-f="'+c[0]+'" aria-pressed="'+(UI.filter===c[0])+'">'+c[1]+'</button>').join('')+'</div>';
  h+='<p class="muted small">Tap a part in the 3D model or pick one below. Drag to rotate and pinch to zoom.</p>';
  h+='<div class="legend" aria-label="Flow colours in the model">'+[['#a8d8ff','Air'],['#ff9a40','Exhaust gas'],['#ffcf70','Lube oil'],['#6fd0ff','Wash water']].map(x=>'<span><s style="background:'+x[0]+';box-shadow:0 0 0 1px var(--line)"></s>'+x[1]+'</span>').join('')+'</div>';
  h+='<ul class="plist">'+PARTS.filter(p=>UI.filter==='all'||p.g===UI.filter).map(p=>'<li><button class="prow" data-id="'+p.id+'" style="--gc:'+GROUPS[p.g].c+'"><b>'+p.n+'</b><small>'+GROUPS[p.g].n+'</small></button></li>').join('')+'</ul>';
  v.innerHTML=h;
}
function renderDetail(v){
  const p=PBY[UI.sel],g=GROUPS[p.g];
  let list=PARTS.filter(x=>UI.filter==='all'||x.g===UI.filter);
  let i=list.findIndex(x=>x.id===p.id);if(i<0){list=PARTS;i=list.findIndex(x=>x.id===p.id);}
  const prev=list[(i-1+list.length)%list.length],next=list[(i+1)%list.length];
  let h='<button class="back" data-act="back">&larr; All parts</button>';
  h+='<span class="gtag" style="--gc:'+g.c+'">'+g.n+'</span><h2>'+p.n+'</h2>';
  h+='<h3>What it does</h3><p>'+p.what+'</p><h3>How it works</h3><p>'+p.how+'</p>';
  h+='<h3>Key points</h3><ul class="facts">'+p.facts.map(f=>'<li>'+f+'</li>').join('')+'</ul>';
  h+='<div class="watch"><b>Watch for</b>'+p.watch+'</div>';
  h+='<div class="pnav"><button class="btn" data-id="'+prev.id+'">&larr; '+prev.n+'</button><button class="btn" data-id="'+next.id+'">'+next.n+' &rarr;</button></div>';
  v.innerHTML=h;
}
$('#v-parts').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.f){UI.filter=b.dataset.f;renderParts();}
  else if(b.dataset.id){selectPart(b.dataset.id);}
  else if(b.dataset.act==='back'){UI.sel=null;renderParts();view3d.focus(null);view3d.cam('home');$('#v-parts').scrollTop=0;}
});

/* procedures */
const curProc=()=>PROCS.find(p=>p.id===UI.proc);
function applyStepFocus(){
  const st=curProc().steps[UI.step];
  view3d.pins('one',st.part);view3d.focus(st.part);
}
function renderSteps(){
  const v=$('#v-steps'),pr=curProc(),st=pr.steps[UI.step],last=UI.step===pr.steps.length-1;
  let h='<div class="procs" role="group" aria-label="Procedure">'+PROCS.map(p=>'<button class="chip" data-p="'+p.id+'" aria-pressed="'+(p.id===UI.proc)+'">'+p.n+'</button>').join('')+'</div>';
  h+='<div class="stepno">Step '+(UI.step+1)+' of '+pr.steps.length+'</div><div class="prog"><i style="width:'+((UI.step+1)/pr.steps.length*100)+'%"></i></div>';
  h+='<h2>'+st.t+'</h2><p>'+st.b+'</p><p class="muted"><b>Why:</b> '+st.why+'</p>';
  if(st.caut)h+='<div class="caution"><b>Caution. </b>'+st.caut+'</div>';
  if(st.chk)h+='<div class="chk" id="chk"><span class="tick"></span><span>'+st.chkL+'</span></div>';
  h+='<div class="row">'+(st.doF?'<button class="btn pri" data-a="do">'+st.doL+'</button>':'')+'<button class="btn sm" data-a="show">Show in 3D</button></div>';
  h+='<div class="pnav"><button class="btn" data-a="prev"'+(UI.step===0?' disabled':'')+'>Back</button><button class="btn pri" data-a="next">'+(last?'Done':'Next')+'</button></div>';
  h+='<p class="muted small" style="margin-top:14px">Typical values for training. Always follow the maker manual and your ship procedures.</p>';
  v.innerHTML=h;v.scrollTop=0;
}
function updateStepChk(){
  if(UI.tab!=='steps')return;
  const st=curProc().steps[UI.step],el=$('#chk');
  if(st.chk&&el)el.classList.toggle('ok',!!st.chk(sim));
}
$('#v-steps').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const pr=curProc(),st=pr.steps[UI.step];
  if(b.dataset.p){UI.proc=b.dataset.p;UI.step=0;renderSteps();applyStepFocus();}
  else if(b.dataset.a==='next'){if(UI.step<pr.steps.length-1)UI.step++;else{UI.step=0;toast('Procedure complete. Try it in the Simulator.','ok');}renderSteps();applyStepFocus();}
  else if(b.dataset.a==='prev'){if(UI.step>0)UI.step--;renderSteps();applyStepFocus();}
  else if(b.dataset.a==='show'){applyStepFocus();}
  else if(b.dataset.a==='do'&&st.doF){st.doF(sim);updateStepChk();}
});

/* simulator */
function polar(cx,cy,r,deg){const a=deg*Math.PI/180;return [cx+Math.sin(a)*r,cy-Math.cos(a)*r];}
function arcPath(cx,cy,r,d0,d1,col,w){
  const p0=polar(cx,cy,r,d0),p1=polar(cx,cy,r,d1);
  return '<path d="M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+r+' '+r+' 0 '+((d1-d0)>180?1:0)+' 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="'+w+'"/>';
}
function dialSVG(id,max,step,bands,label){
  const dg=v=>-135+v/max*270;
  let s='<svg viewBox="0 0 160 124" role="img" aria-label="'+label+'" style="color:var(--ink);font-family:var(--font-disp)">';
  bands.forEach(b=>{s+=arcPath(80,70,54,dg(b[0]),dg(b[1]),b[2],9);});
  for(let v=0;v<=max+1e-6;v+=step){const a=polar(80,70,44,dg(v));s+='<text x="'+a[0].toFixed(1)+'" y="'+(a[1]+3.5).toFixed(1)+'" text-anchor="middle" font-size="11" fill="currentColor">'+v+'</text>';}
  s+='<g id="nd-'+id+'"><line x1="80" y1="70" x2="80" y2="22" stroke="#d62020" stroke-width="3" stroke-linecap="round"/></g><circle cx="80" cy="70" r="5" fill="currentColor"/>';
  s+='<text id="dv-'+id+'" x="80" y="108" text-anchor="middle" font-size="26" font-weight="600" fill="currentColor">0.0</text></svg>';
  return s;
}
const MX0=34,MX1=290,MY0=172,MY1=14;
const mfx=f=>MX0+f/1.2*(MX1-MX0),mfy=p=>MY0-(p-1)/3.2*(MY0-MY1);
function surgePath(fc,ff){let d='';for(let p=1;p<=4.1;p+=0.15){d+=(d?'L':'M')+mfx(SIM.surgeFlow(p,fc,ff)).toFixed(1)+' '+mfy(p).toFixed(1);}return d;}
function mapSVG(){
  let s='<svg viewBox="0 0 300 200" role="img" aria-label="Compressor map: pressure ratio against air flow" style="color:var(--ink);font-family:var(--font-disp)">';
  s+='<rect x="'+MX0+'" y="'+MY1+'" width="'+(MX1-MX0)+'" height="'+(MY0-MY1)+'" fill="none" stroke="currentColor" stroke-opacity=".4"/>';
  [0.4,0.6,0.8,1.0].forEach(nr=>{
    const pk=1+2.85*nr*nr,f0=SIM.surgeFlow(pk,0,0),f1=0.35+0.75*nr;let d='';
    for(let u=0;u<=1.001;u+=0.1){const f=f0+(f1-f0)*u,p=1+(pk-1)*(1-0.45*u*u);d+=(d?'L':'M')+mfx(f).toFixed(1)+' '+mfy(p).toFixed(1);}
    s+='<path d="'+d+'" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="1.2"/>';
    s+='<text x="'+(mfx(f1)+3).toFixed(1)+'" y="'+(mfy(1+(pk-1)*0.55)+3).toFixed(1)+'" font-size="9" fill="currentColor" fill-opacity=".6">'+Math.round(nr*100)+'%</text>';
  });
  s+='<path d="'+surgePath(0,0)+'" fill="none" stroke="#d83a3a" stroke-width="2"/>';
  s+='<path id="mSurge" d="'+surgePath(0,0)+'" fill="none" stroke="#d83a3a" stroke-width="2" stroke-dasharray="4 3"/>';
  let rl='';for(let L=0.05;L<=1.101;L+=0.05){const nr=SIM.runN(L);rl+=(rl?'L':'M')+mfx(0.15+0.85*L).toFixed(1)+' '+mfy(1+2.85*nr*nr).toFixed(1);}
  s+='<path d="'+rl+'" fill="none" stroke="#2fae6a" stroke-width="2"/>';
  s+='<circle id="mPt" cx="'+mfx(0.02)+'" cy="'+mfy(1)+'" r="6" fill="#f2c230" stroke="#10222d" stroke-width="1.5"/>';
  s+='<text x="'+((MX0+MX1)/2)+'" y="195" text-anchor="middle" font-size="12" fill="currentColor">Air flow</text>';
  s+='<text x="10" y="'+((MY0+MY1)/2)+'" text-anchor="middle" font-size="12" fill="currentColor" transform="rotate(-90 10 '+((MY0+MY1)/2)+')">Pressure ratio</text>';
  s+='<text x="'+(MX0+4)+'" y="'+(MY1+12)+'" font-size="11" fill="#d83a3a">Surge line (solid clean, dashed now)</text>';
  s+='<text x="'+(MX0+4)+'" y="'+(MY1+25)+'" font-size="11" fill="#2fae6a">Engine working line</text>';
  return s+'</svg>';
}
const seg=(label,id,opts)=>'<div class="ctl"><span>'+label+'</span><div class="seg" data-ctl="'+id+'" role="group" aria-label="'+label+'">'+opts.map(o=>'<button data-v="'+o[0]+'" aria-pressed="false">'+o[1]+'</button>').join('')+'</div></div>';
const FOUL=[['ft','Turbine'],['fc','Compressor'],['fa','Air cooler'],['ff','Air filter']];
function buildRun(){
  const v=$('#v-run');
  let h='<p id="bstat" class="small" style="margin:0 0 10px"></p>';
  h+='<div class="gauges"><div class="gbox">'+dialSVG('n',16,2,[[0,13.65,'#8fa5b2'],[13.65,14.3,'#e0a020'],[14.3,16,'#d83a3a']],'Rotor speed')+'<div class="cap">Rotor speed, krpm</div></div>';
  h+='<div class="gbox">'+dialSVG('b',4,1,[[0,3.2,'#8fa5b2'],[3.2,3.6,'#e0a020'],[3.6,4,'#d83a3a']],'Boost pressure')+'<div class="cap">Boost pressure, bar</div></div></div>';
  h+='<div class="gbox" style="margin-top:10px">'+mapSVG()+'<div class="cap" id="mcap">Compressor map: keep the yellow dot away from the red surge line</div></div>';
  h+='<div class="temps"><div><b id="t-in">30</b><span>Gas in °C</span></div><div><b id="t-out">30</b><span>Gas out °C</span></div><div><b id="t-air">32</b><span>Air out °C</span></div><div><b id="t-b">35</b><span>Bearing °C</span></div></div>';
  h+='<div class="temps"><div><b id="t-lp">0.0</b><span>Lube bar</span></div><div><b id="t-df">8</b><span>Filter mbar</span></div><div><b id="t-dc">12</b><span>Cooler mbar</span></div><div><b id="t-sm">99</b><span>Surge margin %</span></div></div>';
  h+=seg('Engine','engine',[['1','Run'],['0','Stop']]);
  h+='<div class="ctl"><label for="load">Engine load</label><input type="range" id="load" min="5" max="110" step="5" value="50"><output id="loadv">50%</output></div>';
  h+=seg('Load ramp limiter','lim',[['1','On'],['0','Off']]);
  h+=seg('Fouling builds up','accr',[['1','On'],['0','Off']]);
  h+='<h3>Fouling</h3><div id="foulbars">'+FOUL.map(f=>'<div class="foul"><span>'+f[1]+'</span><i><b id="fb-'+f[0]+'"></b></i><output id="fo-'+f[0]+'">0%</output></div>').join('')+'</div>';
  h+='<div class="row"><button class="btn sm" data-wash="turbine">Wash turbine</button><button class="btn sm" data-wash="compressor">Wash compressor</button></div>';
  h+='<div class="row"><button class="btn sm" data-m="cooler">Clean air cooler</button><button class="btn sm" data-m="filter">Change filter</button><button class="btn sm" data-m="overhaul">Overhaul rotor</button></div>';
  h+='<h3>Alarms</h3><ul class="alist" id="alist"></ul>';
  h+='<h3>Inject a fault</h3><div class="row"><button class="btn sm" data-fault="lube" aria-pressed="false">Lube oil fails</button><button class="btn sm" data-foul="ft">Dirty turbine</button><button class="btn sm" data-foul="fc">Dirty compressor</button><button class="btn sm" data-foul="fa">Dirty air cooler</button><button class="btn sm" data-foul="ff">Blocked filter</button></div>';
  h+='<h3>Start from</h3><div class="row"><button class="btn sm" data-preset="cold">Stopped</button><button class="btn sm" data-preset="steady">Steady 75%</button><button class="btn sm" data-preset="full">Full load</button><button class="btn sm" data-preset="degraded">Fouled unit</button></div>';
  h+=seg('Training speed','speed',[['1','×1'],['3','×3'],['6','×6']]);
  h+='<p class="muted small" style="margin-top:12px">Try it: at full load, switch the ramp limiter off and drop the load fast. The rotor is still fast while the airflow falls, so the compressor surges. Set points are typical values for this trainer. Use the maker manual for real work.</p>';
  v.innerHTML=h;
}
$('#v-run').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const sg=b.closest('.seg');
  if(sg&&b.dataset.v!==undefined){
    const id=sg.dataset.ctl,val=b.dataset.v;
    if(id==='engine')SIM.act.engine(sim,val==='1');
    else if(id==='lim')SIM.act.limiter(sim,val==='1');
    else if(id==='accr')SIM.act.accrue(sim,val==='1');
    else if(id==='speed')sim.speed=+val;
    updateRun();return;
  }
  if(b.dataset.fault){SIM.act.lubeFail(sim,!sim.lubeFail);updateRun();return;}
  if(b.dataset.foul){SIM.act.foul(sim,b.dataset.foul,0.4);toast('Fouling added','warn');updateRun();return;}
  if(b.dataset.wash){SIM.act.wash(sim,b.dataset.wash);updateRun();return;}
  if(b.dataset.m){const m=b.dataset.m;if(m==='cooler')SIM.act.cleanCooler(sim);else if(m==='filter')SIM.act.changeFilter(sim);else SIM.act.overhaul(sim);updateRun();return;}
  if(b.dataset.preset){SIM.preset(sim,b.dataset.preset);toast({cold:'Stopped: ready for a start-up',steady:'Running steady at 75% load',full:'Running steady at full load',degraded:'Running with a fouled turbocharger'}[b.dataset.preset],'info');updateRun();return;}
});
$('#v-run').addEventListener('input',e=>{
  if(e.target.id==='load'){SIM.act.load(sim,+e.target.value/100);$('#loadv').textContent=e.target.value+'%';}
});
function updateRun(){
  if(UI.tab!=='run')return;
  const v=$('#v-run');
  const rot=(id,val,max)=>$('#nd-'+id).setAttribute('transform','rotate('+(-135+clamp(val,0,max)/max*270).toFixed(1)+' 80 70) translate(0 0)');
  rot('n',sim.N/1000,16);rot('b',sim.PR-1,4);
  $('#dv-n').textContent=(sim.N/1000).toFixed(1);$('#dv-b').textContent=(sim.PR-1).toFixed(2);
  $('#t-in').textContent=Math.round(sim.Tin);$('#t-out').textContent=Math.round(sim.Tout);$('#t-air').textContent=Math.round(sim.Tair);$('#t-b').textContent=Math.round(sim.Tb);
  $('#t-lp').textContent=sim.lubeP.toFixed(1);$('#t-df').textContent=Math.round(sim.dpF);$('#t-dc').textContent=Math.round(sim.dpC);
  $('#t-sm').textContent=sim.engineOn&&sim.N>2600?Math.round(clamp(sim.surgeMargin,-99,99)):'-';
  const pt=$('#mPt');pt.setAttribute('cx',mfx(clamp(sim.flow,0,1.2)).toFixed(1));pt.setAttribute('cy',mfy(clamp(sim.PR,1,4.2)).toFixed(1));
  pt.setAttribute('fill',sim.surging?'#d83a3a':(sim.surgeMargin<15&&sim.engineOn?'#e0a020':'#f2c230'));
  $('#mSurge').setAttribute('d',surgePath(sim.fc,sim.ff));
  const bs=$('#bstat');bs.textContent=SIM.status(sim);bs.style.color=(sim.seized||sim.surging)?'var(--bad)':'var(--ink2)';
  const state={engine:sim.engineOn?'1':'0',lim:sim.limiter?'1':'0',accr:sim.accrue?'1':'0',speed:String(sim.speed)};
  $$('.seg[data-ctl]',v).forEach(sg=>{$$('button',sg).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===state[sg.dataset.ctl])));});
  $$('[data-fault]',v).forEach(b=>b.setAttribute('aria-pressed',String(!!sim.lubeFail)));
  FOUL.forEach(f=>{const p=Math.round(sim[f[0]]*100);$('#fb-'+f[0]).style.width=p+'%';$('#fo-'+f[0]).textContent=p+'%';});
  const ld=$('#load');if(document.activeElement!==ld){ld.value=Math.round(sim.loadSet*100);$('#loadv').textContent=Math.round(sim.loadSet*100)+'%';}
  const al=SIM.alarms(sim);
  $('#alist').innerHTML=al.length?al.map(a=>'<li class="'+(a.sev==='bad'?'bad':'')+'">'+a.text+'</li>').join(''):'<li class="none">No alarms</li>';
}

/* quiz */
function startQuiz(){UI.quiz={order:shuffle(QUIZ.map((q,i)=>i)).slice(0,8),i:0,score:0,picked:null,opts:null};renderQuiz();}
function renderQuiz(){
  const v=$('#v-quiz'),Q=UI.quiz;let h='';
  if(!Q){
    h='<h2>Check what you know</h2><p>Eight questions drawn from the parts guide and procedures. You get an explanation after every answer.</p><div class="row"><button class="btn pri" data-q="start">Start quiz</button></div>';
  }else if(Q.i>=Q.order.length){
    const msg=Q.score>=7?'Strong result. Try the surge and lube oil drills in the Simulator next.':Q.score>=5?'A solid base. Revisit the parts you missed.':'Worth another pass through Parts and Procedures.';
    h='<p class="muted">Quiz complete</p><div class="score">'+Q.score+' / '+Q.order.length+'</div><p>'+msg+'</p><div class="row"><button class="btn pri" data-q="start">Try again</button><button class="btn" data-q="parts">Back to parts</button></div>';
  }else{
    const q=QUIZ[Q.order[Q.i]];
    if(!Q.opts)Q.opts=shuffle(q.a.map((t,k)=>({t:t,ok:k===q.c})));
    h='<div class="stepno">Question '+(Q.i+1)+' of '+Q.order.length+'</div><div class="prog"><i style="width:'+((Q.i+1)/Q.order.length*100)+'%"></i></div><h3 style="font-size:20px;margin-top:6px">'+q.q+'</h3>';
    h+=Q.opts.map((o,k)=>{let c='opt';if(Q.picked!==null){if(o.ok)c+=' right';else if(k===Q.picked)c+=' wrong';}return '<button class="'+c+'" data-k="'+k+'"'+(Q.picked!==null?' disabled':'')+'>'+o.t+'</button>';}).join('');
    if(Q.picked!==null){
      const ok=Q.opts[Q.picked].ok;
      h+='<div class="card"><b>'+(ok?'Correct.':'Not quite.')+'</b> '+q.w+'</div><div class="row"><button class="btn pri" data-q="next">'+(Q.i===Q.order.length-1?'See result':'Next question')+'</button></div>';
    }
  }
  v.innerHTML=h;
}
$('#v-quiz').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const Q=UI.quiz;
  if(b.dataset.q==='start'){startQuiz();$('#v-quiz').scrollTop=0;}
  else if(b.dataset.q==='parts'){UI.quiz=null;setTab('parts');}
  else if(b.dataset.q==='next'){Q.i++;Q.picked=null;Q.opts=null;renderQuiz();$('#v-quiz').scrollTop=0;}
  else if(b.dataset.k!==undefined&&Q&&Q.picked===null){Q.picked=+b.dataset.k;if(Q.opts[Q.picked].ok){Q.score++;MT_PROG.mark('q'+Q.order[Q.i]);}renderQuiz();}
});

/* stage controls */
function setViewButtons(m){$$('#viewseg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===m)));}
$$('#viewseg button').forEach(b=>b.addEventListener('click',()=>{view3d.setView(b.dataset.view);setViewButtons(b.dataset.view);}));
view3d.onView=setViewButtons;
$$('#cams button[data-cam]').forEach(b=>b.addEventListener('click',()=>view3d.cam(b.dataset.cam)));
$('#namesBtn').addEventListener('click',e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));view3d.names(on);});
view3d.onPick=id=>{expandIfCollapsed();selectPart(id);};
$('#alarmBanner').addEventListener('click',()=>{expandIfCollapsed();setTab('run');});

function updateHUD(){
  const C=SIM.C,al=SIM.alarms(sim),nr=sim.N/C.NMAX;
  $('#r-n').textContent=(sim.N/1000).toFixed(1);$('#r-b').textContent=(sim.PR-1).toFixed(2);$('#r-t').textContent=Math.round(sim.Tin);
  $('#pp').classList.toggle('bad',nr>=C.OVS_B);$('#pp').classList.toggle('warn',nr>=C.OVS_W&&nr<C.OVS_B);
  $('#pb').classList.toggle('bad',sim.surging);
  $('#pt').classList.toggle('bad',sim.Tin>=C.EGT_B);$('#pt').classList.toggle('warn',sim.Tin>=C.EGT_W&&sim.Tin<C.EGT_B);
  $('#state').textContent=SIM.status(sim);
  const top=al.find(a=>a.sev==='bad')||al[0],bn=$('#alarmBanner');
  if(top){bn.hidden=false;bn.className=top.sev;bn.textContent=top.text+(al.length>1?'  (+'+(al.length-1)+' more)':'');}else bn.hidden=true;
}

/* main loop */
let last=performance.now(),hudT=0,ok3d=true;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  SIM.step(sim,dt);
  while(sim.events.length){const e=sim.events.shift();toast(e.msg,e.sev);}
  if(ok3d){try{view3d.tick(dt,now/1000);}catch(err){ok3d=false;console.error(err);}}
  hudT+=dt;if(hudT>0.15){hudT=0;updateHUD();updateRun();updateStepChk();}
}
buildRun();renderParts();renderSteps();renderQuiz();
setSheet(Math.round((appEl.clientHeight||700)*0.48),false);
setTab('parts');updateHUD();
requestAnimationFrame(frame);
})();
</script>
