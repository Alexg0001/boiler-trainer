<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oily Water Separator Trainer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#245676">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage-a:#245676; --stage-b:#0b2131;
  --bg:#e7edf0; --panel:#f3f6f7; --card:#ffffff; --ink:#10222d; --ink2:#4d616d; --line:#cbd6dc; --chip:#e3eaee;
  --accent:#f2c230; --accent-ink:#1b1708;
  --ok:#17804f; --warn:#a96a00; --bad:#c32f2f; --info:#1f6fa8;
  --c-comb:#e8742f; --c-water:#3a9bdc; --c-mount:#e0b020; --c-feed:#3fae7c;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08141b; --panel:#112430; --card:#17303f; --ink:#e8f0f4; --ink2:#a0b4c0; --line:#28475a; --chip:#1e3a4b;
    --ok:#4fd197; --warn:#f0b445; --bad:#ff7070; --info:#6cb8ee;
  }
}
:root[data-theme="dark"]{
  --bg:#08141b; --panel:#112430; --card:#17303f; --ink:#e8f0f4; --ink2:#a0b4c0; --line:#28475a; --chip:#1e3a4b;
  --ok:#4fd197; --warn:#f0b445; --bad:#ff7070; --info:#6cb8ee;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--stage-a) 50%,var(--panel) 50%)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 0;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--stage-a),var(--stage-b))}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.nogl{position:absolute;inset:auto 16px 16px;margin:0;padding:12px 14px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px}

/* stage overlays */
#top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 10px 0;pointer-events:none;color:#eaf3f8}
#top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.05;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.brand strong{font:700 24px/1 var(--font-disp);letter-spacing:.01em}
.brand span{font-size:14.5px;opacity:.82;margin-top:3px}
.seg{display:inline-flex;background:rgba(8,26,38,.62);border:1px solid rgba(190,225,245,.22);border-radius:9px;padding:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;color:inherit;padding:6px 10px;border-radius:7px;font-size:14px;font-weight:500;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#top .seg{color:#dcecf5}
#readout{position:absolute;left:10px;right:64px;top:58px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.pill{display:flex;align-items:baseline;gap:5px;background:rgba(8,26,38,.66);border:1px solid rgba(190,225,245,.2);color:#eaf3f8;border-radius:8px;padding:3px 9px 4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill i{font-style:normal;font-size:14px;opacity:.8}
.pill b{font:600 22px/1 var(--font-disp);font-variant-numeric:tabular-nums}
.pill u{text-decoration:none;font-size:14px;opacity:.8}
.pill.warn{border-color:#f0b445;background:rgba(120,78,0,.7)}
.pill.bad{border-color:#ff7070;background:rgba(130,20,20,.75)}
#state{flex-basis:100%;font-size:15.5px;color:#dff0f8;text-shadow:0 1px 6px rgba(0,0,0,.6);padding-left:2px}
#cams{position:absolute;right:10px;top:58px;display:flex;flex-direction:column;gap:6px}
#cams button{width:46px;min-height:36px;border:1px solid rgba(190,225,245,.22);background:rgba(8,26,38,.62);color:#dcecf5;border-radius:8px;font-size:13px;padding:4px 0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#cams button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#alarmBanner{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;max-width:calc(100% - 24px);border:0;border-radius:9px;padding:8px 14px;font-weight:600;font-size:15px;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#alarmBanner.warn{background:#9a6200}
#alarmBanner.bad{background:#b52a2a}
#toast{position:absolute;left:50%;transform:translateX(-50%) translateY(6px);bottom:56px;max-width:calc(100% - 24px);background:rgba(8,26,38,.9);color:#eaf3f8;border:1px solid rgba(190,225,245,.25);border-left:4px solid var(--info);border-radius:8px;padding:8px 12px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:left}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.ok{border-left-color:#4fd197}#toast.warn{border-left-color:#f0b445}#toast.bad{border-left-color:#ff7070}

/* pins */
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#pins.hide{display:none}
.pin{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border:0;background:none;pointer-events:auto;display:grid;place-items:center;will-change:transform,opacity}
.pin .dot{width:13px;height:13px;border-radius:50%;background:var(--pc,#fff);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.4)}
.pin .lab{position:absolute;left:22px;top:50%;transform:translateY(-50%);white-space:nowrap;background:rgba(8,26,38,.9);color:#fff;font-size:13.5px;padding:2px 8px;border-radius:5px;display:none;pointer-events:none}
body.names .pin .lab,.pin.on .lab{display:block}
.pin.on{z-index:3}
.pin.on .dot{transform:scale(1.45);background:var(--accent);box-shadow:0 0 0 3px rgba(242,194,48,.35),0 2px 8px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){.pin.on .dot{animation:ping 1.8s ease-out infinite}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,194,48,.7)}100%{box-shadow:0 0 0 14px rgba(242,194,48,0)}}

/* panel */
#panel{flex:0 0 auto;height:48%;display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);position:relative;z-index:5;min-height:0}
#panel.snap{transition:height .22s ease}
#grab{flex:0 0 22px;display:grid;place-items:center;touch-action:none;cursor:ns-resize}
#grab i{width:42px;height:5px;border-radius:3px;background:var(--line)}
#tabs{flex:0 0 auto;display:flex;border-bottom:1px solid var(--line);padding:0 6px}
#tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font:600 18px/1.1 var(--font-disp);color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px}
#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#body{flex:1 1 0;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 22px;-webkit-overflow-scrolling:touch}
.view[hidden]{display:none}
h2{font:700 30px/1.05 var(--font-disp);margin:2px 0 4px}
h3{font:600 19px/1.2 var(--font-body);margin:16px 0 4px}
p{margin:0 0 8px}
.muted{color:var(--ink2)}
.small{font-size:15.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -14px 6px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:15px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:15px;color:var(--ink2);margin:2px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend s{width:18px;height:6px;border-radius:3px;display:inline-block}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.prow{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gc,#999);border-radius:8px;min-height:48px}
.prow b{font-weight:600;flex:1}
.prow small{color:var(--ink2);font-size:15px}
.prow:active{background:var(--chip)}
.back{border:0;background:none;color:var(--info);padding:4px 0;font-weight:600;font-size:16.5px;min-height:36px}
.gtag{display:inline-block;border-radius:999px;padding:3px 11px;font-size:15px;background:var(--chip);border-left:5px solid var(--gc,#999);margin-bottom:6px}
.facts{margin:6px 0 0;padding-left:20px}
.facts li{margin:3px 0}
.watch{margin-top:12px;padding:10px 12px;border-radius:8px;background:rgba(242,194,48,.18);border-left:5px solid var(--accent)}
.watch b{display:block;margin-bottom:2px}
.pnav{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px;font-weight:600;min-height:46px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{flex:0 0 auto;padding:7px 12px;min-height:40px;font-size:16.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

/* steps */
.procs{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 10px;padding:0 14px 4px;scrollbar-width:none}
.procs::-webkit-scrollbar{display:none}
.prog{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:2px 0 8px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stepno{font:600 16.5px var(--font-body);color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.chk{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--chip);font-size:16.5px}
.chk .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink2);flex:0 0 auto;display:grid;place-items:center;font-size:13px;line-height:1}
.chk.ok .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.ok .tick::after{content:"✓"}
.caution{margin-top:10px;padding:10px 13px;border-radius:8px;background:rgba(195,47,47,.12);border-left:5px solid var(--bad);font-size:16.5px}

/* simulator */
.gauges{display:grid;grid-template-columns:1.3fr .7fr;gap:10px;align-items:stretch}
.gbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gbox svg{width:100%;height:auto;max-height:150px}
.gbox .cap{font-size:15px;color:var(--ink2);margin-top:2px}
.temps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.temps div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
.temps b{display:block;font:600 22px/1.1 var(--font-disp);font-variant-numeric:tabular-nums}
.temps span{font-size:14px;color:var(--ink2)}
.seqrow{display:flex;gap:4px;margin:6px 0 12px}
.seqrow span{flex:1;text-align:center;font-size:14.5px;padding:5px 2px;border-radius:6px;background:var(--chip);color:var(--ink2)}
.seqrow span.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seqrow span.bad{background:var(--bad);color:#fff;font-weight:600}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ctl:first-of-type{border-top:0}
.ctl label,.ctl>span{font-weight:500;flex:1}
.ctl .seg{background:var(--chip);border-color:var(--line);backdrop-filter:none}
.ctl .seg button{color:var(--ink);min-height:38px;padding:6px 12px}
.ctl .seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.ctl input[type=range]{flex:0 0 150px;accent-color:#c99a00;height:32px}
.ctl output{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.alist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.alist li{padding:8px 11px;border-radius:7px;font-size:16.5px;border-left:5px solid var(--warn);background:rgba(240,180,69,.16)}
.alist li.bad{border-left-color:var(--bad);background:rgba(195,47,47,.14)}
.alist li.none{border-left-color:var(--ok);background:rgba(23,128,79,.12)}

/* quiz */
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);min-height:48px}
.opt.right{border-color:var(--ok);background:rgba(23,128,79,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(195,47,47,.13)}
.opt:disabled{cursor:default}
.score{font:700 54px/1 var(--font-disp);margin:6px 0}

@media (min-width:640px) and (min-aspect-ratio:1/1){
  #app{flex-direction:row}
  #panel{width:min(46vw,430px);height:100%!important;border-radius:0;order:2;box-shadow:-6px 0 24px rgba(0,0,0,.22)}
  #grab{display:none}
  #tabs{padding-top:8px}
  #alarmBanner{bottom:16px}
  #toast{bottom:64px}
}
@media (max-width:420px){.brand strong{font-size:21px}.seg button{padding:6px 8px;font-size:13.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ctl input[type=range]{flex:0 0 150px}
.note{font-size:15px;color:var(--ink2);margin:6px 0 0}
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="gl" aria-label="Interactive 3D model of a ship's 15 ppm oily water separator. Drag to rotate, pinch or scroll to zoom, tap a part to learn about it." tabindex="0"></canvas>
    <div id="pins"></div>
    <header id="top">
      <div class="brand"><strong>Oily water separator</strong><span>15 ppm bilge water separator</span></div>
      <div class="seg" id="viewseg" role="group" aria-label="View style">
        <button data-view="cut" aria-pressed="true">Cutaway</button>
        <button data-view="xray" aria-pressed="false">X-ray</button>
        <button data-view="ext" aria-pressed="false">Outside</button>
      </div>
    </header>
    <div id="readout" aria-live="off">
      <div class="pill" id="pr"><i>Oil content</i><b id="r-a">0.0</b><u id="r-au">ppm</u></div>
      <div class="pill" id="pp"><i>Pressure</i><b id="r-p">0.2</b><u>bar</u></div>
      <div class="pill" id="po"><i>Oil chamber</i><b id="r-o">15</b><u>%</u></div>
      <div id="state"></div>
    </div>
    <div id="cams" role="group" aria-label="Camera">
      <button data-cam="front">Front</button>
      <button data-cam="right">Right</button>
      <button data-cam="back">Back</button>
      <button data-cam="top">Top</button>
      <button id="namesBtn" aria-pressed="false">Names</button>
    </div>
    <button id="alarmBanner" hidden></button>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <section id="panel" aria-label="Learning panel">
    <div id="grab" role="button" aria-label="Resize panel" tabindex="0"><i></i></div>
    <nav id="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="parts" aria-selected="true">Parts</button>
      <button role="tab" data-tab="steps" aria-selected="false">Procedures</button>
      <button role="tab" data-tab="run" aria-selected="false">Simulator</button>
      <button role="tab" data-tab="quiz" aria-selected="false">Quiz</button>
    </nav>
    <div id="body">
      <section class="view" id="v-parts" role="tabpanel"></section>
      <section class="view" id="v-steps" role="tabpanel" hidden></section>
      <section class="view" id="v-run" role="tabpanel" hidden></section>
      <section class="view" id="v-quiz" role="tabpanel" hidden></section>
    </div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=(s,e)=>(e||document).querySelector(s);
const $$=(s,e)=>Array.from((e||document).querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------------- simulation ---------------- */
const SIM=(function(){
  const C={PPM:15,P_WARN:1.5,P_BAD:2.0,OC_HI:70,OC_FULL:95};
  const OILIN={light:500,normal:3000,heavy:10000};
  function make(){
    return {run:false,src:'bilge',fill:false,ovb:false,at:'sea',quality:'normal',oilIn:3000,
      q:0,bilge:70,oilCh:15,waste:30,foul:10,primed:0,vesselOil:0,ppm:0,ocm:0,pos:0,press:0.2,
      disch:false,blocked:false,draining:false,autoDrain:false,drainMan:false,viol:0,vFlag:false,pFlag:false,
      overT:0,faults:{emul:false,clog:false,drain:false,valve:false,sensor:false},
      test:{st:0,t:0,tot:0,started:false,last:null,ok:null,fail:false},speed:1,events:[],prev:{keys:''}};
  }
  const ev=(s,msg,sev)=>{s.events.push({msg:msg,sev:sev||'info'});};
  function alarms(s){
    const a=[];
    if(s.disch&&s.ppm>C.PPM)a.push({k:'oily',sev:'bad',text:'Oily water is going overboard. Stop the pump.'});
    if(s.disch&&s.at==='port')a.push({k:'port',sev:'bad',text:'Discharge in port or a special area is not allowed. Shut the overboard valve.'});
    if(s.run&&s.ocm>=C.PPM)a.push({k:'ppm',sev:'bad',text:s.pos<0.5?'Oil content over 15 ppm. Water is going back to the bilge tank.':'Oil content over 15 ppm. Waiting for the valve to divert.'});
    if(s.oilCh>=C.OC_FULL)a.push({k:'ocfull',sev:'bad',text:'Oil chamber full. Oil can pass into the clean water.'});
    else if(s.oilCh>=C.OC_HI)a.push({k:'ochi',sev:'warn',text:'Oil chamber level is high'});
    if(s.press>=C.P_BAD)a.push({k:'pbad',sev:'bad',text:'Very high pressure across the coalescer. Stop and clean it.'});
    else if(s.press>=C.P_WARN)a.push({k:'pwarn',sev:'warn',text:'High pressure across the coalescer. It needs cleaning.'});
    if(s.run&&s.src==='bilge'&&s.bilge<=3)a.push({k:'dry',sev:'bad',text:'Bilge tank is empty. The pump is running dry.'});
    if(s.blocked)a.push({k:'blocked',sev:'warn',text:'The overboard valve is shut. Open it or the water cannot leave.'});
    if(s.run&&s.primed<0.9)a.push({k:'prime',sev:'warn',text:'The vessel is not full of clean water. Oil can pass through.'});
    if(s.waste>=100)a.push({k:'wfull',sev:'bad',text:'Waste oil tank full. Oil cannot be drained.'});
    else if(s.waste>=85)a.push({k:'whi',sev:'warn',text:'Waste oil tank is nearly full'});
    if(s.run&&s.src==='fresh'&&s.vesselOil<0.1&&s.ocm>=C.PPM)a.push({k:'sens',sev:'warn',text:'High reading on clean water. Clean the sensor.'});
    return a;
  }
  function status(s){
    if(!s.run)return 'Pump stopped';
    if(s.blocked)return 'Pump running. No path: overboard valve shut';
    if(s.test.st===1)return 'Pump running. Alarm test in progress';
    if(s.src==='fresh')return 'Pump running. Flushing with fresh water';
    if(s.pos>0.5)return s.disch?'Pump running. Discharging overboard':'Pump running. Valve set to overboard';
    return 'Pump running. Water going back to the bilge tank';
  }
  function step(s,dtReal){
    const dt=dtReal*s.speed;
    const hasWater=s.src==='fresh'||s.bilge>3;
    const dry=s.run&&s.src==='bilge'&&s.bilge<=3;
    s.blocked=s.run&&hasWater&&s.pos>0.5&&!s.ovb;
    const qT=(s.run&&hasWater&&!s.blocked)?1:0;
    s.q+=(qT-s.q)*Math.min(1,dt*2);
    if(s.q<0.01)s.q=0;
    if(s.fill)s.primed=Math.min(1,s.primed+0.14*dt);
    if(dry)s.primed=Math.max(0,s.primed-0.3*dt);
    if(s.q>0.05){
      if(s.src==='bilge')s.vesselOil=Math.min(1,s.vesselOil+0.09*dt*s.q);
      else s.vesselOil=Math.max(0,s.vesselOil-0.14*dt*s.q);
    }
    s.disch=s.q>0.05&&s.pos>0.5&&s.ovb;
    if(s.disch&&s.src==='bilge')s.bilge=Math.max(0,s.bilge-0.5*dt*s.q);
    /* oil chamber and drain */
    const inRate=(s.src==='bilge')?s.q*(s.oilIn/3000)*0.7:0;
    s.oilCh=Math.min(100,s.oilCh+inRate*dt);
    if(!s.drainMan){if(s.oilCh>=70)s.autoDrain=true;if(s.oilCh<=20)s.autoDrain=false;}
    else if(s.oilCh<=5)s.drainMan=false;
    s.draining=(s.autoDrain||s.drainMan)&&!s.faults.drain&&s.waste<100&&s.oilCh>2;
    if(s.draining){const d=Math.min(s.oilCh,8*dt);s.oilCh-=d;s.waste=Math.min(100,s.waste+d*0.12);}
    /* clogging and pressure */
    s.foul=Math.min(100,s.foul+s.q*dt*(0.05+s.oilIn/60000)*(s.faults.emul?2:1)*(s.src==='bilge'?1:0.1));
    s.press+=((0.2+0.5*s.q+0.015*s.foul)-s.press)*Math.min(1,dt*3);
    /* how clean is the water leaving the vessel */
    let P=0.001+(1-s.primed)*0.02;
    if(s.foul>60)P+=0.008*(s.foul-60)/40;
    if(s.faults.emul)P+=0.006;
    if(s.oilCh>=95)P+=0.02;
    const ppmT=s.q>0.05?s.oilIn*P*(s.src==='bilge'?1:s.vesselOil):0;
    s.ppm+=(ppmT-s.ppm)*Math.min(1,dt*1.5);
    if(s.q<=0.05&&s.ppm<0.05)s.ppm=0;
    /* the meter reading lags a little and can be wrong if the sensor is dirty */
    const forced=s.test.st===1?40:0;
    const oT=(s.q>0.05?s.ppm+(s.faults.sensor?28:0):(s.faults.sensor?10:0))+forced;
    s.ocm+=(oT-s.ocm)*Math.min(1,dt*0.45);
    /* three-way valve: overboard only while the pump runs and the reading is below 15 ppm */
    const target=(s.run&&hasWater&&s.ocm<C.PPM)?1:0;
    if(!s.faults.valve){const dd=dt*0.25;s.pos+=Math.max(-dd,Math.min(dd,target-s.pos));}
    /* pollution and rule breaches */
    if(s.disch&&s.ppm>C.PPM){
      s.overT+=dt;
      if(s.overT>12&&!s.vFlag){s.vFlag=true;s.viol++;ev(s,'Oily water went overboard. Stop the pump and find the cause.','bad');}
    }else{s.overT=0;if(!s.disch||s.ppm<C.PPM*0.8)s.vFlag=false;}
    if(s.disch&&s.at==='port'){if(!s.pFlag){s.pFlag=true;s.viol++;ev(s,'Discharge in port or a special area is not allowed','bad');}}
    else s.pFlag=false;
    /* alarm test */
    const t=s.test;
    if(t.st===1){
      t.tot+=dt;
      if(s.ocm>=C.PPM&&!t.started){t.started=true;t.t=0;}
      if(t.started){
        t.t+=dt;
        if(s.pos<=0.05){t.last=t.t;t.ok=t.t<=20;t.fail=false;t.st=0;t.started=false;ev(s,'Alarm test: the valve diverted in '+t.t.toFixed(1)+' s. '+(t.ok?'Pass':'Too slow'),t.ok?'ok':'bad');}
      }
      if(t.st===1&&t.tot>25){t.st=0;t.started=false;t.ok=false;t.fail=true;t.last=null;ev(s,'Alarm test failed. The valve did not divert.','bad');}
    }
    /* new alarms raise a toast */
    const al=alarms(s),keys=al.map(a=>a.k);
    al.forEach(a=>{if(s.prev.keys.indexOf(a.k)<0&&a.k!=='ppm'&&a.k!=='oily'&&a.k!=='port')ev(s,a.text,a.sev);});
    s.prev.keys=keys.join(',');
  }
  const act={
    pump(s,on){
      on=!!on;
      if(on&&!s.run&&s.primed<0.9)ev(s,'Fill the vessel with clean water first','warn');
      if(!on&&s.run&&s.src==='bilge'&&s.vesselOil>0.5)ev(s,'The vessel is left full of oily water. Flush it with fresh water before stopping.','warn');
      s.run=on;
    },
    src(s,v){s.src=v;},
    fill(s,on){s.fill=!!on;},
    ovb(s,on){s.ovb=!!on;},
    at(s,v){s.at=v;},
    quality(s,v){s.quality=v;s.oilIn=OILIN[v]||3000;},
    drain(s){if(s.oilCh>5)s.drainMan=true;else ev(s,'There is very little oil to drain','info');},
    testAlarm(s){
      if(!s.run||s.pos<0.9||s.q<0.5){ev(s,'Start the separator and wait for overboard discharge first','warn');return;}
      s.test={st:1,t:0,tot:0,started:false,last:null,ok:null,fail:false};ev(s,'Alarm test started','info');
    },
    refill(s){s.bilge=80;ev(s,'Bilge tank refilled','info');},
    emptyWaste(s){s.waste=5;ev(s,'Waste oil tank emptied','info');},
    cleanCoal(s){
      if(s.run){ev(s,'Stop the pump first','warn');return;}
      s.foul=3;s.primed=0;s.faults.clog=false;s.vesselOil=0;ev(s,'Coalescer cleaned. Refill the vessel with clean water.','info');
    },
    cleanSensor(s){s.faults.sensor=false;ev(s,'Sensor cleaned','info');},
    fault(s,name,on){
      s.faults[name]=!!on;
      if(on&&name==='clog')s.foul=Math.max(s.foul,88);
      if(on&&name==='valve')s.pos=1;
    }
  };
  function preset(s,name){
    const keep=s.speed;
    Object.assign(s,make());s.speed=keep;
    if(name==='ready'||name==='running'){s.primed=1;s.ovb=true;}
    if(name==='running'){s.run=true;s.q=1;s.pos=1;s.vesselOil=1;s.ppm=3;s.ocm=3;s.disch=true;}
    s.prev.keys=alarms(s).map(a=>a.k).join(',');
  }
  return {C:C,make:make,step:step,act:act,alarms:alarms,status:status,preset:preset};
})();

      el.style.transform='translate('+((_v.x*0.5+0.5)*W).toFixed(1)+'px,'+((-_v.y*0.5+0.5)*H).toFixed(1)+'px)';
      el.classList.toggle('on',p.id===focusId||(pinMode==='one'&&p.id===pinId));
    });
  }

  /* ---- apply the simulation to the model ---- */
  const COLD=new T.Color(0x6b5a38),CLEAR=new T.Color(0x4e8aa8),GREEN=new T.Color(0x4fbf8a),BROWN=new T.Color(0x5a3a1c);
  const _c1=new T.Color(),_c2=new T.Color();
  A.lcdT=0;
  function setValve(v,open,dt){const k=Math.min(1,dt*5);v.cur+=((open?1:0)-v.cur)*k;v.stem.position.y=0.26+0.1*v.cur;v.stem.rotation.y=v.cur*3;}
  function updateFlows(s,dt){
    const q=s.q,bil=s.src==='bilge',fr=s.src==='fresh';
    const filling=s.fill&&s.primed<0.999;
    const F={SUCT:bil?q:0,HDR:(fr?q:0)+(filling?0.6:0),FRESHS:fr?q:0,FILLP:filling?0.6:0,PUMPO:q,EFF:q,
      OVB:(s.pos>0.5&&s.ovb)?q:0,RECIR:s.pos<=0.5?q:0,OILD:s.draining?0.8:0};
    const hi=s.ppm>15;
    const COL={SUCT:0xc9a063,HDR:0x7fc6ff,FRESHS:0x7fc6ff,FILLP:0x7fc6ff,PUMPO:bil?0xc9a063:0x7fc6ff,EFF:hi?0xff8a5a:0xa6e3ff,OVB:hi?0xff8a5a:0xa6e3ff,RECIR:0xc9a063,OILD:0xffb347};
    A.flows.forEach(f=>{
      const v=F[f.id]||0;
      if(v<0.03){f.obj.visible=false;return;}
      f.obj.visible=true;
      f.phase+=dt*v*1.5/f.len;f.phase-=Math.floor(f.phase);
      const pos=f.geo.attributes.position.array;
      for(let i=0;i<f.n;i++){
        let u=(f.phase+i/f.n)%1;if(u<0)u+=1;const dist=u*f.len;
        let k=1;while(k<f.cum.length-1&&f.cum[k]<dist)k++;
        const a=f.pts[k-1],b=f.pts[k],sl=(f.cum[k]-f.cum[k-1])||1,t=(dist-f.cum[k-1])/sl;
        pos[i*3]=a.x+(b.x-a.x)*t;pos[i*3+1]=a.y+(b.y-a.y)*t;pos[i*3+2]=a.z+(b.z-a.z)*t;
      }
      f.geo.attributes.position.needsUpdate=true;
      f.mat.color.setHex(COL[f.id]||0xffffff);
    });
  }
  function applySim(s,dt,tm){
    /* pump and motor */
    const run=s.q>0.05?1:0;
    rotG.rotation.y+=dt*run*10;mrot.rotation.y+=dt*run*18;
    pLampM.emissiveIntensity=s.run?1.4:0.05;
    /* valves */
    setValve(A.vBilge,s.src==='bilge',dt);setValve(A.vFresh,s.src==='fresh',dt);setValve(A.vFill,s.fill,dt);setValve(A.vOvb,s.ovb,dt);
    /* three-way valve arrow: points overboard when pos=1 and back to the bilge tank when pos=0 */
    arrowG.rotation.y=Math.PI-s.pos*(Math.PI/2);
    _c1.setHex(0xffb040);_c2.setHex(0x7ee08a);arrowM.color.copy(_c1).lerp(_c2,s.pos);arrowM.emissive.copy(arrowM.color);
    /* bilge tank */
    const wh=0.05+1.35*clamp(s.bilge,0,100)/100;
    bWater.scale.y=Math.max(0.02,wh);bOil.position.y=0.15+wh;bOil.scale.y={light:0.04,normal:0.08,heavy:0.16}[s.quality]||0.08;
    /* vessel water colours: murky when full of oily water, clearer after the coalescer */
    z1M.color.copy(CLEAR).lerp(COLD,clamp(s.vesselOil*(s.oilIn/3000>1?1:0.5+s.oilIn/6000),0,1));z1M.emissive.copy(z1M.color);
    z2M.color.copy(CLEAR);
    const fl=clamp(s.foul/100,0,1);coalM.color.copy(GREEN).lerp(BROWN,fl);
    const vis=clamp(s.primed,0,1);
    z1.scale.y=Math.max(0.01,1.35*vis);z2.scale.y=Math.max(0.01,1.2*vis);
    /* oil chamber and waste tank */
    oilVol.scale.y=Math.max(0.01,0.78*clamp(s.oilCh,0,100)/100);
    wOil.scale.y=Math.max(0.02,0.05+0.85*clamp(s.waste,0,100)/100);
    A.sol.coilM.emissiveIntensity=s.draining?1.6:0.05;
    probeLampM.emissiveIntensity=s.oilCh>=70?(0.8+0.6*Math.sin(tm*8)):0.05;
    /* gauge needle, 0 to 4 bar over 270 degrees */
    needleG.rotation.z=-(-135+clamp(s.press,0,4)/4*270)*Math.PI/180;
    /* oil meter cell and lamps */
    const bad=s.ocm>=15;
    cellM.emissive.setHex(bad?0xff3a2a:0x22dd66);cellM.emissiveIntensity=s.q>0.05?0.9:0.2;
    const al=SIM.alarms(s),anyBad=al.some(x=>x.sev==='bad');
    ocmLampM.emissiveIntensity=bad&&s.run?(1.0+0.6*Math.sin(tm*8)):0.05;
    A.lamps.forEach(l=>{
      let on=false;
      if(l.k==='run')on=s.run;else if(l.k==='ovb')on=s.disch;else if(l.k==='rec')on=s.run&&s.pos<0.5&&s.q>0.05;else if(l.k==='alm')on=anyBad&&Math.sin(tm*7)>-0.2;
      l.m.emissiveIntensity=on?1.5:0.05;
    });
    A.lcdT+=dt;if(A.lcdT>0.25){A.lcdT=0;drawLCD(s);drawOCM(s);}
    /* oil droplets rise through the vessel while bilge water is flowing */
    const showD=viewMode!=='ext'&&s.q>0.05&&s.src==='bilge';
    dObj.visible=showD;
    if(showD){
      for(let i=0;i<NDROP;i++){let y=dArr[i*3+1]+dt*0.55*s.q;if(y>3.1)y=0.8+Math.random()*0.3;dArr[i*3+1]=y;}
      dGeo.attributes.position.needsUpdate=true;dMat.opacity=0.25+0.7*clamp(s.vesselOil,0,1);
    }
    updateFlows(s,dt);
  }

  function resize(){
    const r=stage.getBoundingClientRect(),w=Math.max(2,Math.floor(r.width)),h=Math.max(2,Math.floor(r.height));
    if(w===W&&h===H)return;W=w;H=h;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  }

  resize();
  cam.r=goal.r=homeR();
  setView('cut');rebuildFocus();drawLCD(sim);drawOCM(sim);

  const api={ok:true,onPick:null,onView:null,focus:focus,setView:setView,cam:camPreset,
    names(on){document.body.classList.toggle('names',!!on);},
    pins(mode,id){pinMode=mode;pinId=id||null;pinsEl.classList.toggle('hide',mode==='none');},
    tick(dt,tm){

      applySim(sim,dt,tm);
      if(focusId&&FOCUSM.length){const k=reduce?0.4:0.45+0.25*Math.sin(tm*4.2);FOCUSM.forEach(m=>{const b=m.userData.base;m.material.emissive.copy(b.emissive).lerp(ACC,k);m.material.emissiveIntensity=Math.max(b.ei,1);});}
      renderer.render(scene,camera);

    }};
  return api;
  }catch(err){
    console.error(err);
    $('#stage').insertAdjacentHTML('beforeend','<p class="nogl">The 3D view hit a problem and was turned off. The guide, procedures, simulator and quiz still work.</p>');
    return stub;
  }
})();

const mqDesk=window.matchMedia('(min-width:640px) and (min-aspect-ratio:1/1)');

function sheetH(){return panel.getBoundingClientRect().height;}
function setSheet(h,anim){

const grab=$('#grab');let drag=null;
grab.addEventListener('pointerdown',e=>{if(mqDesk.matches)return;try{grab.setPointerCapture(e.pointerId);}catch(_){}drag={y:e.clientY,h:sheetH(),m:0};panel.classList.remove('snap');});
grab.addEventListener('pointermove',e=>{if(!drag)return;const dy=drag.y-e.clientY;drag.m=Math.max(drag.m,Math.abs(dy));setSheet(drag.h+dy,false);});

  if(!drag)return;const d=drag;drag=null;calcStops();const h=sheetH();
  if(d.m<6){setSheet(h<150?stops[1]:stops[0],true);}
  else{let best=stops[0];stops.forEach(s=>{if(Math.abs(s-h)<Math.abs(best-h))best=s;});setSheet(best,true);}

  h+='<h3>Start from</h3><div class="row"><button class="btn sm" data-preset="stopped">Everything stopped</button><button class="btn sm" data-preset="ready">Ready to start</button><button class="btn sm" data-preset="running">Running normally</button></div>';
  h+=seg('Training speed','speed',[['1','\u00d71'],['3','\u00d73'],['6','\u00d76']]);
  h+='<p class="muted small" style="margin-top:12px">Settings and readings are typical values for this trainer. Use your own ship\'s manuals for real work.</p>';
  v.innerHTML=h;
}
$('#v-run').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const sg=b.closest('.seg');
  if(sg&&b.dataset.v!==undefined){
    const id=sg.dataset.ctl,val=b.dataset.v;
    if(id==='pump')SIM.act.pump(sim,val==='1');
    else if(id==='src')SIM.act.src(sim,val);
    else if(id==='fill')SIM.act.fill(sim,val==='1');
    else if(id==='ovb')SIM.act.ovb(sim,val==='1');
    else if(id==='at')SIM.act.at(sim,val);
    else if(id==='quality')SIM.act.quality(sim,val);
    else if(id==='speed')sim.speed=+val;
    updateRun();return;
  }
  if(b.dataset.fault){SIM.act.fault(sim,b.dataset.fault,!sim.faults[b.dataset.fault]);updateRun();return;}
  if(b.dataset.preset){SIM.preset(sim,b.dataset.preset);toast(b.dataset.preset==='stopped'?'Everything stopped':b.dataset.preset==='ready'?'Ready to start':'Running normally','info');updateRun();return;}
  if(b.id==='drainBtn'){SIM.act.drain(sim);return;}
  if(b.id==='testBtn'){SIM.act.testAlarm(sim);return;}
  if(b.id==='refillBtn'){SIM.act.refill(sim);return;}
  if(b.id==='wasteBtn'){SIM.act.emptyWaste(sim);return;}
  if(b.id==='coalBtn'){SIM.act.cleanCoal(sim);updateRun();return;}
  if(b.id==='sensBtn'){SIM.act.cleanSensor(sim);updateRun();}
});
function updateRun(){
  if(UI.tab!=='run')return;
  const v=$('#v-run');
  $('#needle').setAttribute('transform','rotate('+ppmDeg(sim.ocm).toFixed(1)+' 80 88)');
  $('#dialv').textContent=Math.min(sim.ocm,999).toFixed(1)+' ppm';
  const ly=122-clamp(sim.oilCh,0,100)*1.14;
  $('#lvptr').setAttribute('transform','translate(0 '+ly.toFixed(1)+')');
  const lv=$('#lvv');lv.textContent=Math.round(sim.oilCh);lv.setAttribute('y',(ly+7).toFixed(1));
  $('#t-a').textContent=sim.press.toFixed(1);$('#t-b').textContent=Math.round(sim.bilge);
  $('#t-q').textContent=Math.round(sim.waste);$('#t-r').textContent=Math.round(sim.foul);
  const ts=$('#tstat'),t=sim.test;
  if(t.st>0){ts.textContent=t.started?'Alarm test: valve moving, '+t.t.toFixed(1)+' s':'Alarm test running';ts.style.color='var(--ink2)';}
  else if(t.fail){ts.textContent='Last alarm test: failed. The valve did not divert.';ts.style.color='var(--bad)';}
  else if(t.last!==null){ts.textContent='Last alarm test: valve diverted in '+t.last.toFixed(1)+' s. '+(t.ok?'Pass':'Too slow');ts.style.color=t.ok?'var(--ok)':'var(--bad)';}
  else{ts.textContent=SIM.status(sim);ts.style.color='var(--ink2)';}
  const tv=$('#tviol');tv.textContent='Oily discharges this session: '+sim.viol;tv.style.color=sim.viol>0?'var(--bad)':'var(--ink2)';
  const state={pump:sim.run?'1':'0',src:sim.src,fill:sim.fill?'1':'0',ovb:sim.ovb?'1':'0',at:sim.at,quality:sim.quality,speed:String(sim.speed)};
  $$('.seg[data-ctl]',v).forEach(sg=>{$$('button',sg).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===state[sg.dataset.ctl])));});
  $$('[data-fault]',v).forEach(b=>b.setAttribute('aria-pressed',String(!!sim.faults[b.dataset.fault])));
  $('#testBtn').disabled=sim.test.st>0;
  const al=SIM.alarms(sim);
  $('#alist').innerHTML=al.length?al.map(a=>'<li class="'+(a.sev==='bad'?'bad':'')+'">'+a.text+'</li>').join(''):'<li class="none">No alarms</li>';
}

/* quiz */
function startQuiz(){UI.quiz={order:shuffle(QUIZ.map((q,i)=>i)).slice(0,8),i:0,score:0,picked:null,opts:null};renderQuiz();}
function renderQuiz(){
  const v=$('#v-quiz'),Q=UI.quiz;let h='';
  if(!Q){
    h='<h2>Check what you know</h2><p>Eight questions drawn from the parts guide and procedures. You get an explanation after every answer.</p><div class="row"><button class="btn pri" data-q="start">Start quiz</button></div>';
  }else if(Q.i>=Q.order.length){
    const msg=Q.score>=7?'Strong result. Try the fault drills in the Simulator next.':Q.score>=5?'A solid base. Revisit the parts you missed.':'Worth another pass through Parts and Procedures.';
    h='<p class="muted">Quiz complete</p><div class="score">'+Q.score+' / '+Q.order.length+'</div><p>'+msg+'</p><div class="row"><button class="btn pri" data-q="start">Try again</button><button class="btn" data-q="parts">Back to parts</button></div>';
  }else{
    const q=QUIZ[Q.order[Q.i]];
    if(!Q.opts)Q.opts=shuffle(q.a.map((t,k)=>({t:t,ok:k===q.c})));
    h='<div class="stepno">Question '+(Q.i+1)+' of '+Q.order.length+'</div><div class="prog"><i style="width:'+((Q.i+1)/Q.order.length*100)+'%"></i></div><h3 style="font-size:20px;margin-top:6px">'+q.q+'</h3>';
    h+=Q.opts.map((o,k)=>{let c='opt';if(Q.picked!==null){if(o.ok)c+=' right';else if(k===Q.picked)c+=' wrong';}return '<button class="'+c+'" data-k="'+k+'"'+(Q.picked!==null?' disabled':'')+'>'+o.t+'</button>';}).join('');
    if(Q.picked!==null){
      const ok=Q.opts[Q.picked].ok;
      h+='<div class="card"><b>'+(ok?'Correct.':'Not quite.')+'</b> '+q.w+'</div><div class="row"><button class="btn pri" data-q="next">'+(Q.i===Q.order.length-1?'See result':'Next question')+'</button></div>';
    }
  }
  v.innerHTML=h;
}
$('#v-quiz').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const Q=UI.quiz;
  if(b.dataset.q==='start'){startQuiz();$('#v-quiz').scrollTop=0;}
  else if(b.dataset.q==='parts'){UI.quiz=null;setTab('parts');}
  else if(b.dataset.q==='next'){Q.i++;Q.picked=null;Q.opts=null;renderQuiz();$('#v-quiz').scrollTop=0;}
  else if(b.dataset.k!==undefined&&Q&&Q.picked===null){Q.picked=+b.dataset.k;if(Q.opts[Q.picked].ok){Q.score++;MT_PROG.mark('q'+Q.order[Q.i]);}renderQuiz();}
});

/* stage controls */
function setViewButtons(m){$$('#viewseg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===m)));}
$$('#viewseg button').forEach(b=>b.addEventListener('click',()=>{view3d.setView(b.dataset.view);setViewButtons(b.dataset.view);}));
view3d.onView=setViewButtons;
$$('#cams button[data-cam]').forEach(b=>b.addEventListener('click',()=>view3d.cam(b.dataset.cam)));
$('#namesBtn').addEventListener('click',e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));view3d.names(on);});
view3d.onPick=id=>{expandIfCollapsed();selectPart(id);};
$('#alarmBanner').addEventListener('click',()=>{expandIfCollapsed();setTab('run');});


function updateHUD(){
  const C=SIM.C,al=SIM.alarms(sim);
  $('#r-a').textContent=Math.min(sim.ocm,999).toFixed(1);$('#r-au').textContent='ppm';
  $('#r-p').textContent=sim.press.toFixed(1);$('#r-o').textContent=Math.round(sim.oilCh);
  $('#pr').classList.toggle('bad',sim.run&&sim.ocm>=C.PPM);$('#pr').classList.toggle('warn',sim.run&&sim.ocm>=C.PPM*0.7&&sim.ocm<C.PPM);
  $('#pp').classList.toggle('bad',sim.press>=C.P_BAD);$('#pp').classList.toggle('warn',sim.press>=C.P_WARN&&sim.press<C.P_BAD);
  $('#po').classList.toggle('bad',sim.oilCh>=C.OC_FULL);$('#po').classList.toggle('warn',sim.oilCh>=C.OC_HI&&sim.oilCh<C.OC_FULL);
  $('#state').textContent=SIM.status(sim);
  const top=al.find(a=>a.sev==='bad')||al[0],bn=$('#alarmBanner');
  if(top){bn.hidden=false;bn.className=top.sev;bn.textContent=top.text+(al.length>1?'  (+'+(al.length-1)+' more)':'');}else bn.hidden=true;
}

/* main loop */
let last=performance.now(),hudT=0,ok3d=true;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  SIM.step(sim,dt);
  while(sim.events.length){const e=sim.events.shift();toast(e.msg,e.sev);}
  if(ok3d){try{view3d.tick(dt,now/1000);}catch(err){ok3d=false;console.error(err);}}
  hudT+=dt;if(hudT>0.15){hudT=0;updateHUD();updateRun();updateStepChk();}
}
buildRun();renderParts();renderSteps();renderQuiz();
setSheet(Math.round((appEl.clientHeight||700)*0.48),false);
setTab('parts');updateHUD();
requestAnimationFrame(frame);
})();
</script>
